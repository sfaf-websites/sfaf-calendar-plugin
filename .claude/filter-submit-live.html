 *

 *        data-category="support-groups"
 *        data-per-page="12"

     * generated with ?ver=<plugin version> baked in. That pin never changes
     * again, so the host page kept asking for calendar.css?ver=2.9.0 long after

     * two differ, the server wins.

        link.href = url;
        link.setAttribute('data-sfaf-calendar-css', 'server');
        (document.head || document.getElementsByTagName('head')[0]).appendChild(link);

        container.innerHTML = '';
        container.appendChild(box);

     * so say what happened and offer the calendar itself.

     */

        box.className = 'sfaf-embed-error';

        var kept = [];
        for (var i = 0; i < classes.length; i++) {
            if (classes[i] && classes[i].indexOf('sfaf-card-') !== 0) {
                kept.push(classes[i]);
            }
        }
        if (style && /^[A-Za-z0-9_-]+$/.test(style)) {
            kept.push('sfaf-card-' + style);
        }
        container.className = kept.join(' ');
    }

    /*
     * THE VERSION THIS FILE WAS SHIPPED AS (3.89.0).
     *
     * IT IS NOT A CACHE BUSTER AND MUST NOT BECOME ONE. The script URL is
     * deliberately unversioned, because a version in a snippet somebody pasted
     * once PINS it rather than busting it, which was a real defect in 2.10.1.
     * See SFAF_Embed::script_url().
     *
     * WHAT IT IS FOR. Two releases of correct work were invisible on the embed
     * because the browser was running a cached copy of this file from before
     * them. That failure is indistinguishable from the fix not working, and
     * nobody thinks to hard refresh. The payload carries the version the SERVER
     * is on, fetched fresh on every load and impossible to pin, so the two can
     * be compared and the mismatch NAMED.
     *
     * It is kept honest by .claude/embed-filters-test.php, which fails the
     * build if this string is not SFAF_VERSION. It cannot drift by being
     * forgotten at release time.
     */
    var EMBED_JS_VERSION = '3.100.0';
    var staleReported = false;

    /**
     * Say so, once, when this script is older than the site it is talking to.
     *
     * A WARNING, NOT A RELOAD. A script that refetches itself when it dislikes
     * a number can loop against a CDN serving two versions from two edges, on a
     * page this plugin does not own. The remedy is a hard refresh or an expired
     * cache, and both are somebody's decision rather than this file's.
     */
    function reportIfStale(serverVersion) {
        if (staleReported || !serverVersion || serverVersion === EMBED_JS_VERSION) {
            return;
        }
        staleReported = true;
        if (window.console && window.console.warn) {
            window.console.warn(
                'SFAF Calendar: this page is running embed.js ' + EMBED_JS_VERSION
                + ' while the calendar site is on ' + serverVersion
                + '. The browser is holding a cached copy of the script, so anything '
                + 'fixed since ' + EMBED_JS_VERSION + ' will not be on this page until it is '
                + 'reloaded without the cache.'
            );
        }
    }

    /** Replace the whole block (first load, and numbered page navigation). */
    function loadBlock(container, page, scrollIntoView) {
        request(container, page, 'block', function (data) {
            adoptStylesheet(data.css_url);
            reportIfStale(data.js_version);

            /*
             * THE OPEN FILTER PANEL SURVIVES THE SWAP (3.89.0).
             *
             * innerHTML below replaces everything, and the server renders the
             * Organizers and groups control CLOSED, because a <details> is
             * closed unless it says otherwise. So every tick shut the panel and
             * choosing two organizers meant reopening it between them.
             *
             * calendar.js has done this since 3.87.0 and embed.js did not,
             * which is the fourth time a fix reached one script and not the
             * other. Read before the swap and put back after it, in the one
             * place that does the swapping.
             */
            var whoOpen = !!container.querySelector('[data-uc-who][open]');

            container.innerHTML = data.html;

            if (whoOpen) {
                var who = container.querySelector('[data-uc-who]');
                if (who) { who.open = true; }
            }
            /* The rows are new markup, so the hiding has to be reapplied or the
               groups the chosen organizers do not run come back one frame after
               being hidden. See narrowWho(). */
            narrowWho(container);
            applyCardStyle(container, data.card_style);
            /*
             * The block arrives already showing what was asked for, so the
             * state is NOT reset here any more. It used to be, because the only
             * way a block was re-fetched was a first load; a group choice
             * re-fetches it too, and clearing the attributes would have thrown
             * away the choice that caused the request one line after the server
             * honoured it. The search box is the exception: the fresh markup
             * carries the term the request was made with, so the attribute
             * already agrees with what is on screen.
             */
            bind(container);
            // Warm the neighbouring months once the block is on screen, so the
            // first arrow click is instant. After first paint, never before.
            var grid = gridOf(container);
            if (grid) {
                prefetchAround(container, grid.getAttribute('data-month') || '');
            }
            if (scrollIntoView) {
                var top = container.getBoundingClientRect().top;
                if (top < 0) {
                    container.scrollIntoView();
                }
            }
        }, function () {
            showError(container);
        });
    }

    /** Fetch the next page and append it (load more, infinite scroll). */
    function loadMore(container, trigger) {
        var block = inner(container);
        var list = listOf(container);
        if (!block || !list || block.getAttribute('data-loading') === '1') {
            return;
        }

        var page = parseInt(block.getAttribute('data-page') || '1', 10);
        var maxPages = parseInt(block.getAttribute('data-max-pages') || '1', 10);
        var next = page + 1;

        if (next > maxPages) {
            removePagination(container);
            return;
        }

        block.setAttribute('data-loading', '1');
        var isButton = trigger && trigger.tagName === 'BUTTON';
        if (isButton) {
            trigger.disabled = true;
            trigger.textContent = 'Loading…';
        }

        request(container, next, 'items', function (data) {
            block.setAttribute('data-loading', '');

            var holder = document.createElement('div');
            holder.innerHTML = data.html;
            while (holder.firstChild) {
                list.appendChild(holder.firstChild);
            }
            block.setAttribute('data-page', String(next));
            // The new cards were not in the document when bind() ran, so they
            // have never been observed. revealCards() skips anything already
            // carrying .uc-reveal, so this only ever reaches the new ones.
            revealCards(container);

            // Nothing to reapply: the request already carried the chosen
            // category, so what just landed is page N of the filtered set.
            if (!data.has_more || next >= maxPages) {
                removePagination(container);
            } else if (isButton) {
                trigger.disabled = false;
                trigger.textContent = 'Load More';
            }
        }, function () {
            block.setAttribute('data-loading', '');
            if (isButton) {
                trigger.disabled = false;
                trigger.textContent = 'Load More';
            }
        });
    }

    function removePagination(container) {
        var pagination = container.querySelector('.uc-pagination');
        if (pagination && pagination.parentNode) {
            pagination.parentNode.removeChild(pagination);
        }
    }

    /* -----------------------------------------------------------------------
     * Interaction inside a block
     *
     * Everything is scoped to one container, so several blocks on a page filter
     * and page independently of each other.
     * -------------------------------------------------------------------- */

    /**
     * Wire up the controls in freshly rendered markup.
     *
     * Everything bound here belongs to elements that are replaced wholesale on
     * the next render, so re-running it cannot double-bind. Anything that has to
     * survive a render — or reach cards appended later — is delegated from the
     * container in init() instead.
     */
    function bind(container) {
        var block = inner(container);
        if (!block) {
            return;
        }

        bindPagination(container, block);
        bindFilters(container);
        bindSearch(container);
        bindViewToggle(container, block);
        bindMonth(container);
        revealCards(container);
    }

    /* -----------------------------------------------------------------------
     * ENTRANCE: each list card as it reaches the viewport.
     *
     * THE TWIN OF initReveal() IN calendar.js. Two runtimes render the same
     * markup, this file on somebody else's page, that one on the calendar site
     *, and neither can load the other. The behaviour is deliberately identical
     * and the CSS is literally the same file (calendar.css, adopted by
     * adoptStylesheet), so a change to the look is one edit; a change to WHEN it
     * fires is two, and they are cross-referenced.
     *
     * THIS BLOCK LIVES INSIDE SFAF.ORG'S PAGE AND MUST NOT FIGHT IT. An
     * IntersectionObserver is a private object: no global handler, no scroll
     * listener, no shared registry. A host theme running AOS or its own reveal
     * script cannot see this one and this one cannot see it. The class name
     * .uc-reveal is ours and appears nowhere in the host's stylesheet, and the
     * rules that use it are scoped under .uc-calendar.
     *
     * DEGRADES TO VISIBLE, ALWAYS. .uc-reveal, the class that hides, is only
     * ever added on the line before the element is observed. No observer, no
     * class, no hiding: reduced motion returns early, a browser without
     * IntersectionObserver returns early, and a card added after the block was
     * bound is simply visible. There is no arrangement in which a card ends up
     * invisible with nothing left to reveal it.
     *
     * LIST VIEW ONLY. .uc-event-list is the list panel's container. The month
     * grid is a table of 42 cells and staggering it would look like a fault.
     * -------------------------------------------------------------------- */
    function revealCards(container) {
        // Which branch ran, on the block rather than on <html>: this is
        // somebody else's page and the root element is not ours to stamp.
        // Inspect the embed container and it says on, reduced or no-observer.
        var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        container.setAttribute('data-uc-motion', reduced ? 'reduced' : 'on');

        if (reduced) {
            return;
        }
        if (!('IntersectionObserver' in window)) {
            container.setAttribute('data-uc-motion', 'no-observer');
            return;
        }

        var cards = container.querySelectorAll('.uc-event-list .uc-event-card');
        if (!cards.length) {
            return;
        }

        // ONCE PER CARD: unobserved on the first crossing, so scrolling back up
        // a long list does not replay anything.
        var observer = new IntersectionObserver(function (entries, obs) {
            for (var i = 0; i < entries.length; i++) {
                if (!entries[i].isIntersecting) { continue; }
                entries[i].target.classList.add('is-in');
                obs.unobserve(entries[i].target);
            }
        }, { rootMargin: '0px 0px -40px 0px', threshold: 0.01 });

        for (var j = 0; j < cards.length; j++) {
            if (cards[j].classList.contains('uc-reveal')) { continue; }
            cards[j].classList.add('uc-reveal');
            observer.observe(cards[j]);
        }
    }

    /* -----------------------------------------------------------------------
     * View toggle
     * -------------------------------------------------------------------- */

    function panelOf(container, name) {
        return container.querySelector('.uc-panel-' + name);
    }

    /**
     * WHICH PANELS A VIEW SHOWS, asked as one question instead of two.
     *
     * THIS IS THE FAULT THAT SHIPPED IN 3.30.0. showView() used to say
     * `list.hidden = (view !== 'list')` and `cal.hidden = (view !== 'calendar')`,
     * which is correct for the only two views that existed when it was written
     * and hides BOTH panels for any third. bindViewToggle() calls showView()
     * unconditionally on every render, viewFor() had learned to answer
     * 'combined', and so a combined block rendered its search box, its filter
     * bar, its count and nothing else, at every width, on a live page.
     *
     * Written as a function that takes the panel's name because two independent
     * comparisons is the shape that lets one mode be forgotten. The default is
     * "keep it", so a view added later renders too much rather than nothing:
     * an extra panel is a layout somebody will report, and an empty block is
     * the calendar looking broken.
     *
     * The twin of this is showView() in calendar.js, which reaches the same
     * answer a different way and is cross-referenced there.
     */
    function panelHiddenFor(view, panel) {
        if (view === 'combined') {
            /* THE COMBINED VIEW SHOWS THE GRID AND THE SIDEBAR AND HIDES THE
             * LIST (3.82.0). It used to show everything, which was right while
             * it built no list panel. It builds one now, so the toggle has
             * somewhere to go, and showing it here would be both views at once. */
            return (panel === 'list');
        }
        if (view !== 'list' && view !== 'calendar') {
            return false;
        }
        return (view !== panel);
    }

    /** Show the panels this view calls for, and keep the buttons in step. */
    function showView(container, view, remember) {
        var block = inner(container);
        if (!block) {
            return;
        }

        var list = panelOf(container, 'list');
        var cal = panelOf(container, 'calendar');
        if (list) { list.hidden = panelHiddenFor(view, 'list'); }
        if (cal) { cal.hidden = panelHiddenFor(view, 'calendar'); }

        /* ---------------------------------------------------------------
         * LEAVING AND RE-ENTERING THE COMBINED LAYOUT (3.82.0)
         *
         * A combined block has two more pieces than any other: the month head
         * that spans both halves, and the sidebar column. They are not
         * `.uc-panel-list` or `.uc-panel-calendar`, so the two lines above say
         * nothing about them, and leaving them on screen under a list is the
         * fault this whole change exists to avoid repeating.
         *
         * THE WRAPPER'S CLASS STAYS PUT (3.95.1), AND IT USED TO COME OFF.
         *
         * 3.82.0 took it off so a lone list was not sitting inside a card.
         * Measured, the cost of that was the thing this release is fixing: the
         * card is what sizes the panels inside it, so with the border gone the
         * list drew 2px wider than the grid and sidebar it replaces, and the
         * edge of the block moved as somebody toggled.
         *
         * THE CARD IS THE CONTAINER ALL THREE SHARE. Sizing the list from it
         * like the other two is what makes the two views the same width, and it
         * is one owner rather than a class that means one thing to the CSS and
         * another to whatever reads it next. monthParams() in calendar.js was
         * reading that class to decide whether the block was combined, and was
         * finding nothing whenever the list was showing.
         * ------------------------------------------------------------- */
        var panels = container.querySelector('.uc-view-panels');
        if (panels && panels.getAttribute('data-uc-combined') === '1') {
            var toCombined = (view === 'combined');
            var head = container.querySelector('.uc-combined-head');
            var side = panelOf(container, 'sidebar');
            if (head) { head.hidden = !toCombined; }
            if (side) { side.hidden = !toCombined; }
        }

        block.setAttribute('data-view', view);
        // Every mode is named here. A mode left out of this list is not removed
        // when another is applied, and the block keeps two uc-view classes: the
        // 1200px cap and every container query read them.
        block.className = block.className.replace(/\buc-view-(list|calendar|combined|sidebar)\b/g, '').trim() + ' uc-view-' + view;

        // aria-pressed is the state a screen reader announces, so it has to
        // move with the visual active class rather than being set once.
        var buttons = container.querySelectorAll('.uc-view-btn');
        for (var i = 0; i < buttons.length; i++) {
            var on = (buttons[i].getAttribute('data-view') === view);
            buttons[i].classList.toggle('active', on);
            buttons[i].setAttribute('aria-pressed', on ? 'true' : 'false');
        }

        if (remember) {
            rememberView(container, view);
        }
        if (view === 'calendar') {
            syncDayPanel(container);
        }
    }

    function bindViewToggle(container, block) {
        var buttons = container.querySelectorAll('.uc-view-btn');
        for (var i = 0; i < buttons.length; i++) {
            (function (button) {
                button.addEventListener('click', function () {
                    showView(container, button.getAttribute('data-view') || 'list', true);
                });
            })(buttons[i]);
        }
        // The server rendered whichever view it was told to; a remembered
        // choice may differ, and this is where the two are reconciled.
        showView(container, viewFor(container), false);
    }

    /* -----------------------------------------------------------------------
     * Month grid
     * -------------------------------------------------------------------- */

    function gridOf(container) {
        return container.querySelector('.uc-month');
    }

    /** Prefetched month HTML, keyed by block and month. */
    var monthCache = {};

    /*
     * EVERY NARROWING BELONGS IN THIS KEY (3.88.0).
     *
     * The category was here and the search term, the groups and the organizers
     * were not, so searching and then clearing, or ticking an organizer and
     * untivking it, served the grid cached for the other state out of this
     * object. That is the same fault the category note below describes, three
     * more times, and it is the client-side twin of the server's cache
     * identity, which has carried all four for releases.
     */
    function monthCacheKey(container, month) {
        // The chosen category belongs in the key: without it, filtering and then
        // returning would serve the other category's grid out of this cache.
        return viewKey(container) + '#' + activeCategory(container)
            + '#' + (container.getAttribute('data-active-groups') || '')
            + '#' + (container.getAttribute('data-active-organizer') || '')
            + '#' + (container.getAttribute('data-active-search') || '')
            + '#' + month;
    }

    /**
     * Swap in a month's grid.
     *
     * A VISIBLE loading state, unlike the silent prefetch: this one is a
     * response to a click, so the visitor is waiting and should be told.
     */
    function loadMonth(container, month) {
        var grid = gridOf(container);
        var panel = panelOf(container, 'calendar');
        if (!panel || !month) {
            return;
        }

        /*
         * BOTH HALVES MOVE TOGETHER, HERE TOO (3.45.2).
         *
         * The combined mode's month name spans both halves and its right-hand
         * column lists the month the grid is showing, so the payload carries
         * three pieces and all three are applied in one place. This applied the
         * grid alone and the grid arrived carrying a month name of its own,
         * which left two sets of navigation on screen disagreeing about the
         * month: the spanning one, still on the month before, and the one that
         * had just been dropped into the left column.
         *
         * THE CACHE HOLDS THE WHOLE PAYLOAD, not one string out of it. Holding
         * the grid alone is the same fault a second time, delayed until
         * somebody navigates back to a month they have already seen.
         */
        function applyMonth(data) {
            if (!data || typeof data.html !== 'string') {
                return;
            }
            panel.innerHTML = data.html;
            var side = panelOf(container, 'sidebar');
            if (side && typeof data.side === 'string') {
                side.innerHTML = data.side;
            }
            var head = container.querySelector('.uc-combined-head');
            if (head && typeof data.head === 'string') {
                head.innerHTML = data.head;
            }
            bindMonth(container);
            prefetchAround(container, month);
        }

        var cached = monthCache[monthCacheKey(container, month)];
        if (cached) {
            applyMonth(cached);
            return;
        }

        if (grid) {
            grid.classList.add('uc-month-loading');
            grid.setAttribute('aria-busy', 'true');
        }

        request(container, 1, 'month', function (data) {
            monthCache[monthCacheKey(container, month)] = data;
            applyMonth(data);
        }, function () {
            // FAILURE MUST NOT LOOK LIKE AN EMPTY MONTH. A blank grid is
            // indistinguishable from a month with nothing on, which is common
            // in real data, so say what happened and offer a way to retry.
            var g = gridOf(container);
            if (g) {
                g.classList.remove('uc-month-loading');
                g.removeAttribute('aria-busy');
            }
            showMonthError(container, month);
        }, { month: month });
    }

    function showMonthError(container, month) {
        var grid = gridOf(container);
        if (!grid) {
            return;
        }
        var old = grid.querySelector('.uc-month-error');
        if (old && old.parentNode) {
            old.parentNode.removeChild(old);
        }

        var box = document.createElement('div');
        box.className = 'uc-month-error';
        box.setAttribute('role', 'alert');

        var text = document.createElement('span');
        text.textContent = 'That month could not be loaded.';
        box.appendChild(text);

        var retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'uc-month-retry';
        retry.textContent = 'Try again';
        retry.addEventListener('click', function () {
            if (box.parentNode) { box.parentNode.removeChild(box); }
            loadMonth(container, month);
        });
        box.appendChild(retry);

        grid.insertBefore(box, grid.firstChild);
    }

    /**
     * Warm the months either side, quietly.
     *
     * No loading state and no error handling on purpose: nobody asked for
     * these, so a failure should be invisible and the click that needs them
     * will simply fetch normally.
     */
    function prefetchAround(container, month) {
        var grid = gridOf(container);
        if (!grid) {
            return;
        }
        var neighbours = [grid.getAttribute('data-prev'), grid.getAttribute('data-next')];
        for (var i = 0; i < neighbours.length; i++) {
            (function (target) {
                if (!target || monthCache[monthCacheKey(container, target)]) {
                    return;
                }
                /* THE WHOLE PAYLOAD, the same shape loadMonth() stores. Two
                   writers putting two different shapes into one cache is how a
                   prefetched month comes to apply differently from a fetched
                   one, and it only shows on the months somebody warmed. */
                request(container, 1, 'month', function (data) {
                    monthCache[monthCacheKey(container, target)] = data;
                }, function () { /* silent by design */ }, { month: target });
            })(neighbours[i]);
        }
    }

    function bindMonth(container) {
        var grid = gridOf(container);
        if (!grid) {
            return;
        }

        /* FROM THE CONTAINER, NOT THE GRID (3.45.0). The month head spans both
           halves in the combined mode and so sits outside .uc-month, and the
           month tabs are under the sidebar. Both carry data-goto and both mean
           "move the whole view", so both are bound here. */
        var navs = container.querySelectorAll('[data-goto]');
        for (var i = 0; i < navs.length; i++) {
            (function (button) {
                button.addEventListener('click', function () {
                    loadMonth(container, button.getAttribute('data-goto'));
                });
            })(navs[i]);
        }

        bindGridKeys(container, grid);
        bindDaySelection(container, grid);
        syncDayPanel(container);
    }

    /* -----------------------------------------------------------------------
     * Grid keyboard navigation
     *
     * A roving tabindex: exactly one cell is in the tab order, and the arrow
     * keys move focus (and the tab stop) around the month. This is what makes
     * a 42-cell grid usable without tabbing through every day.
     * -------------------------------------------------------------------- */

    function cellsOf(grid) {
        return grid.querySelectorAll('td.uc-day');
    }

    function focusCell(grid, cells, index) {
        if (index < 0 || index >= cells.length) {
            return;
        }
        for (var i = 0; i < cells.length; i++) {
            cells[i].setAttribute('tabindex', i === index ? '0' : '-1');
        }
        cells[index].focus();
    }

    function bindGridKeys(container, grid) {
        var cells = cellsOf(grid);
        if (!cells.length) {
            return;
        }

        grid.addEventListener('keydown', function (event) {
            var current = -1;
            for (var i = 0; i < cells.length; i++) {
                if (cells[i] === document.activeElement) {
                    current = i;
                    break;
                }
            }
            if (current < 0) {
                return;
            }

            var next = -1;
            switch (event.key) {
                case 'ArrowRight': next = current + 1; break;
                case 'ArrowLeft':  next = current - 1; break;
                case 'ArrowDown':  next = current + 7; break;
                case 'ArrowUp':    next = current - 7; break;
                case 'Home':       next = current - (current % 7); break;
                case 'End':        next = current - (current % 7) + 6; break;
                case 'Enter':
                case ' ':
                    selectDay(container, cells[current].getAttribute('data-day'));
                    event.preventDefault();
                    return;
                default: return;
            }

            if (next >= 0 && next < cells.length) {
                focusCell(grid, cells, next);
                event.preventDefault();
            }
        });
    }

    /* -----------------------------------------------------------------------
     * Mobile: tap a date, see that day below the grid
     *
     * Seven columns do not fit a phone, so the grid collapses to a date number
     * and one dot per event (CSS), and the chosen day's events render underneath
     * as ordinary list cards. Never opens blank: today when today has events,
     * otherwise the next day that does.
     * -------------------------------------------------------------------- */

    function bindDaySelection(container, grid) {
        var cells = cellsOf(grid);
        for (var i = 0; i < cells.length; i++) {
            (function (cell) {
                cell.addEventListener('click', function (event) {
                    // A click straight on an event link is a navigation, not a
                    // day selection.
                    var node = event.target;
                    while (node && node !== cell) {
                        if (node.tagName === 'A') { return; }
                        node = node.parentNode;
                    }
                    selectDay(container, cell.getAttribute('data-day'));
                });
            })(cells[i]);
        }
    }

    /** The first day at or after `from` that has events, or ''. */
    function firstDayWithEvents(grid, from) {
        var cells = cellsOf(grid);
        var fallback = '';
        for (var i = 0; i < cells.length; i++) {
            var day = cells[i].getAttribute('data-day');
            var count = parseInt(cells[i].getAttribute('data-count') || '0', 10);
            if (count > 0) {
                if (!fallback) { fallback = day; }
                if (!from || day >= from) { return day; }
            }
        }
        return fallback;
    }

    function selectDay(container, day) {
        var grid = gridOf(container);
        if (!grid || !day) {
            return;
        }
        grid.setAttribute('data-selected', day);

        var cells = cellsOf(grid);
        for (var i = 0; i < cells.length; i++) {
            var on = (cells[i].getAttribute('data-day') === day);
            cells[i].classList.toggle('uc-day-selected', on);
            // Not colour alone: the state is in the accessibility tree too.
            cells[i].setAttribute('aria-selected', on ? 'true' : 'false');
        }
        renderDayPanel(container, grid, day);
    }

    /**
     * Copy the chosen day's event blocks into the panel below the grid.
     *
     * Cloned from markup already on the page rather than fetched: the month
     * response carries every event it contains, so a tap costs no request.
     */
    function renderDayPanel(container, grid, day) {
        var panel = grid.querySelector('.uc-month-day-panel');
        if (!panel) {
            return;
        }
        var cell = grid.querySelector('td.uc-day[data-day="' + day + '"]');
        panel.innerHTML = '';
        if (!cell) {
            return;
        }

        var heading = document.createElement('h4');
        heading.className = 'uc-day-panel-title';
        heading.textContent = (cell.getAttribute('aria-label') || '').split('.')[0];
        panel.appendChild(heading);

        /* THE CLOSURE COMES WITH THE DAY (3.95.1), AND IT WAS NOT HERE AT ALL.
           This panel is the readable surface at the widths where the cell hides
           its own closure line, so a closed day arrived here saying nothing
           about being closed. aria-hidden comes off the clone: it is set in the
           cell because the cell aria-label already carries the sentence, and
           this panel has no such label. */
        var closed = cell.querySelector('.uc-day-closed-mark');
        if (closed) {
            var mark = closed.cloneNode(true);
            mark.removeAttribute('aria-hidden');
            mark.className = 'uc-day-panel-closed';
            panel.appendChild(mark);
        }

        var events = cell.querySelector('.uc-day-events');
        if (!events || !events.children.length) {
            if (!closed) {
                var none = document.createElement('p');
                none.className = 'uc-day-panel-empty';
                none.textContent = 'Nothing scheduled on this day.';
                panel.appendChild(none);
            }
            return;
        }
        panel.appendChild(events.cloneNode(true));
    }

    /** Pick a sensible day when the grid first appears, so it is never blank. */
    function syncDayPanel(container) {
        var grid = gridOf(container);
        if (!grid) {
            return;
        }
        var already = grid.getAttribute('data-selected');
        if (already) {
            renderDayPanel(container, grid, already);
            return;
        }
        var today = grid.getAttribute('data-today') || '';
        var todayCell = grid.querySelector('td.uc-day[data-day="' + today + '"]');
        var count = todayCell ? parseInt(todayCell.getAttribute('data-count') || '0', 10) : 0;
        var day = (count > 0) ? today : firstDayWithEvents(grid, today);
        if (day) {
            selectDay(container, day);
        }
    }

    function bindPagination(container, block) {
        var loadMoreBtn = container.querySelector('.uc-load-more');
        if (loadMoreBtn) {
            loadMoreBtn.addEventListener('click', function () {
                loadMore(container, loadMoreBtn);
            });
        }

        // Numbered pages: the server rendered these as buttons carrying the
        // page number, because a link would point at the REST URL.
        var pageButtons = container.querySelectorAll('.uc-pagination-pages button[data-page]');
        for (var i = 0; i < pageButtons.length; i++) {
            (function (button) {
                button.addEventListener('click', function () {
                    loadBlock(container, parseInt(button.getAttribute('data-page'), 10) || 1, true);
                });
            })(pageButtons[i]);
        }

        var sentinel = container.querySelector('.uc-infinite-sentinel');
        if (sentinel && 'IntersectionObserver' in window) {
            var observer = new IntersectionObserver(function (entries) {
                for (var j = 0; j < entries.length; j++) {
                    if (entries[j].isIntersecting) {
                        loadMore(container, sentinel);
                    }
                }
            }, { rootMargin: '300px' });
            observer.observe(sentinel);
        }
    }

    /** Every card in a block, whichever layout it was rendered in. */
    function cardsIn(container) {
        return container.querySelectorAll('.uc-event-card, .uc-compact-card');
    }

    /**
     * The category this block is showing, as the endpoint wants it.
     *
     * 'all' and '' both mean "no choice made"; the endpoint then falls back to
     * the snippet's own scope.
     */
    function activeCategory(container) {
        var value = container.getAttribute('data-active-category') || '';
        return (value === 'all') ? '' : value;
    }

    /**
     * The category buttons and the chips both re-fetch the WHOLE block.
     *
     * They used to swap only the list, which was right while a category
     * changed nothing but the rows. It changes the controls now: choosing one
     * is what makes the Groups row appear, and the row is derived by the
     * endpoint from what that category actually contains. Rebuilding it here
     * would be a second implementation of the derivation, in another language.
     *
     * The search box still swaps the list alone, because re-rendering the block
     * would take the caret out from between two keystrokes.
     */

    /** The number above the list: the endpoint's total, never the card count. */
    function setCount(container, total) {
        var count = container.querySelector('.uc-count-number');
        if (!count) {
            return;
        }
        if (total === null || typeof total === 'undefined') {
            count.textContent = String(cardsIn(container).length);
            return;
        }
        count.textContent = String(total);
    }

    function bindFilters(container) {
        var buttons = container.querySelectorAll('.uc-filter-btn');
        for (var i = 0; i < buttons.length; i++) {
            (function (button) {
                button.addEventListener('click', function (e) {
                    /*
                     * THE PILL IS A SUBMIT BUTTON AND THIS IS WHAT STOPS IT
                     * SUBMITTING (3.98.1). It sits inside the bar's real GET
                     * form, which is what makes it work with script off, so
                     * with script on the default has to be taken away or the
                     * block filters in place and the page reloads on top of it
                     * a moment later. The same line is in calendar.js.
                     */
                    e.preventDefault();
                    for (var j = 0; j < buttons.length; j++) {
                        buttons[j].classList.remove('active');
                        buttons[j].setAttribute('aria-pressed', 'false');
                    }
                    button.classList.add('active');
                    button.setAttribute('aria-pressed', 'true');
                    container.setAttribute('data-active-category', button.getAttribute('data-category') || 'all');
                    // A different category holds different groups, so the
                    // second-level choice cannot outlive the first-level one.
                    container.setAttribute('data-active-groups', '');
                    loadBlock(container, 1, false);
                });
            })(buttons[i]);
        }
    }

    /**
     * The second level: groups.
     *
     * THE WHOLE BLOCK IS RE-FETCHED, not just the list. The Groups row is
     * derived by the server from what the chosen category contains, and the
     * breadcrumb states where the visitor is; rebuilding either here would be a
     * second implementation of both, in another language, free to disagree with
     * the endpoint's.
     *
     * Delegated from the container in init(), once, so it survives every render.
     */
    /**
     * The organizer dropdown, which now runs a query.
     *
     * DELEGATED, because the whole block is replaced on every filter change and
     * a listener bound to the <select> itself would go with the old markup.
     * bindFilters() binds the chips directly and is re-run after each render;
     * this follows bindGroups() instead, which is bound once in init().
     */
    function bindOrganizer(container) {
        container.addEventListener('change', function (e) {
            var sel = e.target;
            if (!sel || !sel.matches || !sel.matches('[data-uc-organizer]')) {
                return;
            }
            var slug = String(sel.value || 'all');
            container.setAttribute('data-active-organizer', slug === 'all' ? '' : slug);
            // A different organizer holds different series.
            container.setAttribute('data-active-groups', '');
            loadBlock(container, 1, false);
        });
    }

    /**
     * ORGANIZERS AND GROUPS, ON THE EMBED (3.88.0).
     *
     * THE CONTROL HAD NO HANDLER HERE AT ALL. 3.85.0 merged the organizer
     * select and the groups row into one <details> and wired it in
     * calendar.js, which is this site's script. The embed has its own, and
     * embed.js still listened for `[data-uc-organizer]` and `[data-uc-group]`,
     * which are the controls that merge REMOVED. So on an embed the dropdown
     * rendered, opened, and did nothing whatever anybody ticked.
     *
     * That is the third time a correct change reached the shortcode and not the
     * embed, after the list card and the toggle. The renderer is shared; the
     * two scripts are not, and nothing makes them agree.
     *
     * DELEGATED ON THE CONTAINER, like every other handler in this file, so a
     * block redrawn by loadBlock() keeps it.
     */
    function whoChosen(container, sel) {
        var panel = container.querySelector('[data-uc-who-panel]');
        if (!panel) { return []; }
        return Array.prototype.slice.call(panel.querySelectorAll(sel))
            .filter(function (b) { return b.checked; })
            .map(function (b) { return b.value; })
            .filter(Boolean);
    }

    /**
     * Hide the groups the chosen organizers do not run.
     *
     * MODULE LEVEL BECAUSE loadBlock() HAS TO CALL IT TOO (3.89.0). This lived
     * inside bindWho(), which runs once when the block is mounted. The hiding
     * is an ATTRIBUTE ON EACH ROW and the redraw replaces every row, so after a
     * tick the server's freshly rendered options came back unhidden and the
     * narrowing silently undid itself one frame after being applied.
     *
     * The rules are calendar.js's and have to stay identical: a group with no
     * organizered events is ALWAYS shown, because an empty list is missing
     * information rather than a mismatch, and a ticked group is never hidden or
     * the filter runs with nothing on screen to clear it by.
     */
    function narrowWho(container) {
        var panel = container.querySelector('[data-uc-who-panel]');
        if (!panel) { return; }
        var orgs = whoChosen(container, '[data-uc-who-organizer]');
        var opts = panel.querySelectorAll('[data-uc-who-group-orgs]');
        var shown = 0;
        Array.prototype.forEach.call(opts, function (opt) {
            var mine = (opt.getAttribute('data-uc-who-group-orgs') || '').split(/\s+/).filter(Boolean);
            var box = opt.querySelector('input');
            var keep = !orgs.length || !mine.length || (box && box.checked)
                || mine.some(function (s) { return orgs.indexOf(s) > -1; });
            opt.hidden = !keep;
            if (keep) { shown++; }
        });
        var none = panel.querySelector('[data-uc-who-none]');
        if (none) { none.hidden = shown > 0 || !opts.length; }
    }

    function bindWho(container) {
        function panelIn() { return container.querySelector('[data-uc-who-panel]'); }

        function chosen(sel) { return whoChosen(container, sel); }

        function narrow() { narrowWho(container); }

        function relabel() {
            var panel = panelIn();
            if (!panel) { return; }
            var names = Array.prototype.slice.call(panel.querySelectorAll('input'))
                .filter(function (b) { return b.checked; })
                .map(function (b) {
                    var s = b.nextElementSibling;
                    return s ? (s.textContent || '').replace(/^\s+|\s+$/g, '') : '';
                })
                .filter(Boolean);
            var label = container.querySelector('[data-uc-who-label]');
            if (label) {
                label.textContent = !names.length ? 'Organizers and groups'
                    : (names.length <= 2 ? names.join(', ') : names.length + ' selected');
            }
            var trigger = container.querySelector('[data-uc-who-trigger]');
            if (trigger) { trigger.classList.toggle('active', names.length > 0); }
        }

        /* NOTHING REORDERS THIS LIST (3.93.0). Ticked items used to move to the
           top of their column, on OPEN only so a row never moved out from under
           the cursor between one press and the next. Both are gone, and the
           second because of the first: with no sort there is nothing for the
           timing to protect.

           Selection-first is for a long scrolling list where the thing just
           ticked would be out of sight. This panel shows all thirty-four at
           once, so it moved the name somebody was reading and bought nothing.
           Alphabetical, ticked or not. Removed from this script AND from
           calendar.js AND from the renderer's own $sorter, because a sort left
           in any one of the three puts the behaviour back on that path only,
           which is the split that has cost five faults. */

        var timer = null;

        container.addEventListener('toggle', function (e) {
            var d = e.target;
            if (!d || !d.matches || !d.matches('[data-uc-who]') || !d.open) { return; }
            narrow();
        }, true);

        container.addEventListener('change', function (e) {
            var box = e.target;
            if (!box || !box.matches) { return; }
            if (!box.matches('[data-uc-who-organizer], [data-uc-who-group]')) { return; }

            narrow();
            relabel();
            container.setAttribute('data-active-organizer', chosen('[data-uc-who-organizer]').join(','));
            container.setAttribute('data-active-groups', chosen('[data-uc-who-group]').join(','));

            /* DEBOUNCED FOR THE REASON calendar.js DEBOUNCES: loadBlock()
               replaces the block, so three ticks in a second would be three
               redraws each replacing the markup the next is being ticked into.
               350ms, the same number, because it is the same decision. */
            if (timer) { clearTimeout(timer); }
            timer = setTimeout(function () {
                timer = null;
                loadBlock(container, 1, false);
            }, 350);
        });

        container.addEventListener('click', function (e) {
            var t = e.target;
            if (!t || !t.closest) { return; }
            var clear = t.closest('[data-uc-who-clear]');
            if (clear && container.contains(clear)) {
                e.preventDefault();
                var panel = panelIn();
                if (panel) {
                    Array.prototype.forEach.call(panel.querySelectorAll('input'), function (b) { b.checked = false; });
                }
                narrow();
                relabel();
                container.setAttribute('data-active-organizer', '');
                container.setAttribute('data-active-groups', '');
                loadBlock(container, 1, false);
                return;
            }
            /* Light dismiss, which a <details> does not give and a popover did. */
            var open = container.querySelector('[data-uc-who][open]');
            if (open && !open.contains(t)) { open.open = false; }
        });

        narrow();
    }

    function bindGroups(container) {
        container.addEventListener('click', function (e) {
            var t = e.target;
            if (!t || !t.closest) {
                return;
            }

            var clear = t.closest('[data-uc-group-clear]');
            if (clear && container.contains(clear)) {
                e.preventDefault();
                container.setAttribute('data-active-groups', '');
                loadBlock(container, 1, false);
                return;
            }

            var crumb = t.closest('[data-uc-crumb]');
            if (crumb && container.contains(crumb)) {
                e.preventDefault();
                if (crumb.getAttribute('data-uc-crumb') === 'all') {
                    container.setAttribute('data-active-category', 'all');
                }
                container.setAttribute('data-active-groups', '');
                loadBlock(container, 1, false);
                return;
            }

            var pill = t.closest('[data-uc-group]');
            if (pill && container.contains(pill) && pill.tagName !== 'INPUT') {
                e.preventDefault();
                toggleGroup(container, pill.getAttribute('data-uc-group') || '');
            }
        });

        container.addEventListener('change', function (e) {
            var box = e.target;
            if (box && box.matches && box.matches('input[data-uc-group]')) {
                toggleGroup(container, box.getAttribute('data-uc-group') || '');
            }
        });
    }

    function toggleGroup(container, slug) {
        if (!slug) {
            return;
        }
        var current = container.getAttribute('data-active-groups') || '';
        var list = current === '' ? [] : current.split(',');
        var at = list.indexOf(slug);

        if (at === -1) {
            list.push(slug);
        } else {
            list.splice(at, 1);
        }
        container.setAttribute('data-active-groups', list.join(','));
        loadBlock(container, 1, false);
    }

    /**
     * A category chip on a card filters this block instead of navigating.
     *
     * The chip's href is a real calendar URL carrying ?uc_cat=, and that is what
     * has to happen when this listener is not there: no JavaScript, a
     * middle-click, or a host page where the script failed. Somebody reading an
     * embed on another site should not be thrown to a different domain for a
     * filter this block can apply itself.
     *
     * Delegated from the container, once, in init(): cards arrive from later
     * requests and would otherwise miss the binding.
     */
    function bindChips(container) {
        container.addEventListener('click', function (e) {
            var chip = e.target && e.target.closest ? e.target.closest('.uc-lc-chip-link') : null;
            if (!chip || !container.contains(chip)) {
                return;
            }
            if (e.button > 0 || e.metaKey || e.ctrlKey || e.shiftKey) {
                return;
            }
            var slug = chip.getAttribute('data-uc-cat') || '';
            if (!slug) {
                return;
            }
            e.preventDefault();

            var button = container.querySelector('.uc-filter-btn[data-category="' + slug + '"]');
            if (button) {
                button.click();
                return;
            }
            container.setAttribute('data-active-category', slug);
            container.setAttribute('data-active-groups', '');
            loadBlock(container, 1, false);
        });
    }

    /**
     * Search, run by the endpoint.
     *
     * ASKS THE SERVER, so an embed on another site and the calendar on this
     * one return the same events for the same words. Both queries are built by
     * SFAF_Search, through the same renderer, so there is nothing here that
     * could disagree with the calendar site: this file no longer decides what
     * matching means, it just asks.
     *
     * REQUESTS ONLY THE LIST, not the whole block. Re-rendering the block would
     * replace the filter bar and take the focus out of the search box between
     * keystrokes, which makes typing impossible. So this asks for `items` and
     * swaps the list underneath, leaving the box, its value and the caret
     * exactly where they were.
     */
    function bindSearch(container) {
        var input = container.querySelector('.uc-search');
        if (!input) {
            return;
        }

        var timer = null;
        var seq = 0;

        function run() {
            var term = (input.value || '').replace(/^\s+|\s+$/g, '');
            container.setAttribute('data-active-search', term);

            /*
             * THE MONTH GRID AND THE SIDEBAR ARE REDRAWN TOO (3.88.0), AND THIS
             * IS THE FAULT MARK FOUND IN THE NETWORK TAB.
             *
             * This asked for mode=items and nothing else, so on an embed in
             * calendar or combined view a search refreshed the LIST, which is
             * the panel that is hidden or far below, and the grid beside it
             * never moved. The shortcode had exactly this bug and it was fixed
             * in 3.86.0; the embed has its own script and its own route and did
             * not get the fix, which is the third time a correct change has gone
             * to one path and not the other.
             *
             * THE MONTH REQUEST CARRIES THE TERM ALREADY. params() reads
             * data-active-search, which is set above before either request is
             * made, so mode=month and mode=items describe the same search.
             */
            var grid = gridOf(container);
            if (grid) {
                loadMonth(container, grid.getAttribute('data-month') || '');
            }

            var list = listOf(container);
            if (!list) {
                return;
            }

            // Only the newest request may write. A slow answer for "har"
            // landing after a fast one for "harm reduction" would otherwise
            // leave the wrong list under the right search box.
            seq++;
            var mine = seq;

            request(container, 1, 'items', function (data) {
                if (mine !== seq) {
                    return;
                }
                list.innerHTML = (data && data.html) ? data.html : '';
                if (!data || !data.html) {
                    list.innerHTML = '<p class="uc-empty">No events match that search.</p>';
                }
                revealCards(container);
                var block = inner(container);
                if (block) {
                    // Page one of a different result set. Left alone, Load More
                    // would append page five of the previous one.
                    block.setAttribute('data-page', '1');
                    if (data && typeof data.max_pages !== 'undefined') {
                        block.setAttribute('data-max-pages', String(data.max_pages));
                    }
                }
                if (!data || !data.has_more) {
                    removePagination(container);
                }
                // The search request carried the chosen category too, so these
                // rows are already the right ones. Only the count needs writing.
                setCount(container, (data && typeof data.total !== 'undefined') ? data.total : null);
            }, function () {
                if (mine === seq) {
                    showError(container);
                }
            });
        }

        input.addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(run, 250);
        });
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();
                clearTimeout(timer);
                run();
            }
        });
    }

    /**
     * Walk up from an event target to the add-to-calendar button it sits in.
     * The click often lands on the SVG icon inside the button, not the button.
     */
    function toggleFor(node, container) {
        while (node && node !== container) {
            if (node.classList && node.classList.contains('uc-addcal-toggle')) {
                return node;
            }
            node = node.parentNode;
        }
        return null;
    }

    /**
     * The "Add to Calendar" dropdown on each card.
     *
     * Delegated from the container and bound once, so it also covers cards that
     * arrive later from load more or infinite scroll.
     */
    function bindAddToCalendar(container) {
        container.addEventListener('click', function (event) {
            var toggle = toggleFor(event.target, container);
            if (!toggle) {
                return;
            }
            event.preventDefault();
            event.stopPropagation();

            var menu = toggle.parentNode;
            var open = menu.classList.contains('open');
            closeMenus();
            if (!open) {
                menu.classList.add('open');
            }
        });
    }

    function closeMenus() {
        var open = document.querySelectorAll('[data-sfaf-calendar] .uc-addcal.open');
        for (var i = 0; i < open.length; i++) {
            open[i].classList.remove('open');
        }
    }

    document.addEventListener('click', closeMenus);

    /* -----------------------------------------------------------------------
     * Start-up
     * -------------------------------------------------------------------- */

    function init(container) {
        if (container.getAttribute('data-sfaf-ready') === '1') {
            return;
        }
        container.setAttribute('data-sfaf-ready', '1');
        container.setAttribute('data-active-category', 'all');
        container.setAttribute('data-active-groups', '');
        container.setAttribute('data-active-search', '');

        // Bound to the container itself, once, so they survive every re-render
        // and reach cards that arrive from a later request.
        bindAddToCalendar(container);
        bindChips(container);
        bindGroups(container);
        bindOrganizer(container);
        /* The merged Organizers and Groups control (3.88.0). bindGroups and
           bindOrganizer above listen for the two controls that merge replaced,
           and are kept because render_group_row() and the select are still in
           the renderer for a block that asks for the old shape. This is the one
           that reaches what the filter bar actually draws now. */
        bindWho(container);

        ensureStylesheet();
        setLoading(container);
        loadBlock(container, 1, false);
    }

    /**
     * Find blocks that have not been set up yet. Safe to call repeatedly, which
     * is what makes a second copy of the script tag harmless and lets a host
     * page start a block it added after load.
     */
    function scan() {
        var blocks = document.querySelectorAll('[data-sfaf-calendar]');
        for (var i = 0; i < blocks.length; i++) {
            init(blocks[i]);
        }
    }

    /* -----------------------------------------------------------------------
     * THE CRON NUDGE
     *
     * WordPress's "cron" is not a scheduler. It is a check that runs when
     * somebody loads a page of the site the jobs live on, and the site these
     * jobs live on gets almost no traffic. A reminder due at 6am on a site
     * nobody visits until the afternoon goes out in the afternoon, or not at
     * all. That is not a theoretical concern: it is the difference between the
     * morning-of reminder working and not working.
     *
     * This block is the fix, and it works because of where this file runs: on
     * sfaf.org, which has plenty of visitors, while the calendar and its jobs
     * live on another site entirely. Every page carrying a calendar can lend
     * that site a heartbeat.
     *
     * IT COSTS ALMOST NOTHING, AND THERE ARE THREE SEPARATE REASONS.
     *
     *   1. IT DOES NOT RUN DURING PAGE LOAD. It waits for the window load
     *      event and then for an idle moment, so it cannot compete with the
     *      calendar's own request, with images, or with anything the host page
     *      is doing. On a page that never goes idle it never fires at all,
     *      which is the correct outcome: that visitor is busy.
     *   2. MOST VISITORS SEND NOTHING. A timestamp in localStorage means one
     *      browser sends at most one ping per interval no matter how many
     *      calendar pages it opens, so a person reading six programme pages
     *      costs one request, not six.
     *   3. THE ONES THAT DO SEND COST THE SERVER NOTHING. The endpoint reads
     *      one option and returns 204 when the interval has not elapsed. Only
     *      the first ping after the interval does any work.
     *
     * It is fire-and-forget: no-cors, so there is no preflight and no CORS
     * requirement on the response, and the reply is never read. Nothing on this
     * page depends on it, nothing waits for it, and a failure is silent by
     * design. A blocked request, a firewalled origin or a browser with no
     * fetch() leaves the page exactly as it was.
     *
     * SAFE TO CALL FROM ANYWHERE, because it carries no parameters and cannot
     * ask for anything: the endpoint takes no input and does one thing.
     * -------------------------------------------------------------------- */

    var PING_URL = ROOT + '/wp-admin/admin-ajax.php?action=sfaf_cron_ping';
    var PING_KEY = 'sfafCronPingAt';
    var PING_EVERY_MS = 15 * 60 * 1000;

    function pingDue() {
        try {
            var last = parseInt(window.localStorage.getItem(PING_KEY), 10);
            if (last && (Date.now() - last) < PING_EVERY_MS) {
                return false;
            }
            window.localStorage.setItem(PING_KEY, String(Date.now()));
        } catch (e) {
            // Private mode, a blocked cookie policy, a browser with storage
            // switched off. Ping anyway: the server-side interval is the real
            // guard, and this one is only here to spare it the requests.
            return true;
        }
        return true;
    }

    function nudgeCron() {
        if (!window.fetch || !pingDue()) {
            return;
        }
        try {
            window.fetch(PING_URL, {
                method: 'GET',
                mode: 'no-cors',
                cache: 'no-store',
                credentials: 'omit',
                keepalive: true
            })['catch'](function () { /* nothing here depends on it */ });
        } catch (e) { /* nothing here depends on it */ }
    }

    function scheduleNudge() {
        var idle = window.requestIdleCallback || function (fn) { return window.setTimeout(fn, 1200); };
        idle(nudgeCron, { timeout: 5000 });
    }

/* SFAF-PREVIEW-START
     *
     * EVERYTHING BETWEEN THESE TWO MARKERS EXISTS TWICE, BYTE FOR BYTE, IN
     * calendar.js AND embed.js, AND `.claude/hover-preview-test.php` FAILS IF
     * THE TWO COPIES DIVERGE BY A SINGLE CHARACTER.
     *
     * WHY IT HAS TO BE IN BOTH. 3.75.0 shipped this in calendar.js only, and
     * calendar.js is the shortcode's script. **The calendar has no front end on
     * resources.sfaf.org: it exists only as an embed on sfaf.org**, which runs
     * embed.js, a deliberately jQuery-free reimplementation of the handful of
     * interactions an embed needs. So the preview was correct, tested, and
     * never once executed anywhere anybody could see it. The month grid markup
     * was right the whole time, because both routes call the same
     * render_month_grid(); only the behaviour was missing.
     *
     * WHY A DUPLICATED BLOCK RATHER THAN A THIRD FILE. A shared file means a
     * second network request from a third-party page, injected by a script
     * that is already deriving one URL from its own src, with an ordering
     * question attached. This project has solved the same problem once before,
     * for the recurrence engine, which exists in PHP and in JavaScript and is
     * kept honest by a cross-check that slices the JS between markers. This is
     * that arrangement: one logical copy, enforced by the build rather than by
     * anybody remembering.
     *
     * SO IT USES NO jQUERY AND NOTHING FROM EITHER FILE'S SCOPE. Plain
     * addEventListener, plain closest(), and two constants of its own. If you
     * edit it here, the build will tell you to paste it there.
     */
    var PREVIEW_OPEN_DELAY  = 260;
    var PREVIEW_CLOSE_DELAY = 140;

    function initMonthPreview() {
        /* The device, asked rather than guessed. matchMedia is old enough to
           assume; if it is missing, so is any device this would suit. */
        if (!window.matchMedia || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            return;
        }

        var probe = document.createElement('div');
        if (typeof probe.showPopover !== 'function') {
            return; // See "NO FALLBACK, DELIBERATELY" above.
        }

        /* ONE PANEL FOR THE WHOLE PAGE, built once and refilled. A panel per
           tile would be sixty panels and sixty images on a busy month. */
        var panel = document.createElement('div');
        panel.className = 'uc-mp';
        panel.setAttribute('popover', 'manual');
        /* It describes the tile the pointer is on and is never focused, so it
           is decoration to a screen reader: the tile's own link already carries
           the title, the time and the date. */
        panel.setAttribute('aria-hidden', 'true');
        /*
         * TWO TARGETS: THE PICTURE AND THE BUTTON (3.78.0).
         *
         * THE ADDRESS WAS NEVER MISSING. The tile this previews IS an <a> with
         * the event's href on it, so the URL has always been on the element
         * fill() is handed. 3.76.0's fault was that nothing read it and the
         * panel was built entirely out of spans: a pill that looked like a
         * button, was not one, and had no destination behind it.
         *
         * 3.77.0 THEN MADE THE WHOLE PANEL ONE LINK, WHICH WAS THE WRONG
         * ANSWER AND IS WHY THIS NOTE IS LONGER THAN THE CODE. Wrapping
         * everything in an <a> meant the panel inherited link styling, and on
         * this theme that tinted the entire box teal: the date, the time and
         * the place all read as links because they were inside one. A preview
         * whose every line looks clickable says less than one with two things
         * that are.
         *
         * SO IT IS TWO, AND ONLY THOSE TWO. The picture is what somebody aims
         * at without thinking and the pill is what somebody aims at having
         * read it. The TITLE is not one, because a title that is a link in a
         * panel where the date beside it is not is the same confusion in
         * miniature, and the tile underneath is already a link on the title.
         *
         * WHAT SURVIVES FROM THE ONE-LINK VERSION IS ITS REASONING, AND ALL OF
         * IT STILL HOLDS:
         *
         *   BOTH DESTINATIONS COME OFF THE TILE, copied rather than
         *   re-derived, so two links cannot disagree with each other or with
         *   the tile about where they go or how they open.
         *
         *   NEITHER IS A TAB STOP. The panel is aria-hidden, and a focusable
         *   element inside an aria-hidden container is the worst of both:
         *   invisible to a screen reader and still a stop. A keyboard user tabs
         *   to the TILE, which opens this and carries the same destination, so
         *   a stop in here would be a second per event and sixty extra on a
         *   busy month. tabindex="-1" on both.
         */
        panel.innerHTML =
            '<a class="uc-mp-shot" tabindex="-1" href="#">' +
                '<span class="uc-mp-media"><img alt="" decoding="async" /></span>' +
            '</a>' +
            '<span class="uc-mp-body">' +
                '<span class="uc-mp-off"></span>' +
                '<span class="uc-mp-title"></span>' +
                '<span class="uc-mp-date"></span>' +
                '<span class="uc-mp-time"></span>' +
                '<span class="uc-mp-place"></span>' +
                '<a class="uc-mp-go" tabindex="-1" href="#">View Event Details</a>' +
            '</span>';
        document.body.appendChild(panel);

        /* The two targets, kept in one list so nothing can fill one and forget
           the other. */
        var links  = [ panel.querySelector('.uc-mp-shot'), panel.querySelector('.uc-mp-go') ];
        var img    = panel.querySelector('.uc-mp-media img');
        var media  = panel.querySelector('.uc-mp-shot');
        var off    = panel.querySelector('.uc-mp-off');
        var openT  = null;
        var closeT = null;
        var current = null;

        function fill(a) {
            /*
             * THE DESTINATION AND HOW IT OPENS BOTH COME OFF THE TILE, never
             * from anything this file decides. The tile carries target and rel
             * from sfaf_new_tab_attrs(), and a panel that opened in the same
             * tab while the tile opened a new one would be two answers to one
             * question. Copied rather than re-derived for that reason, and
             * BOTH TARGETS GET THE SAME THREE in one loop, so the picture and
             * the pill cannot go to different places or open differently.
             */
            links.forEach(function (link) {
                if (!link) { return; }
                link.setAttribute('href', a.getAttribute('href') || '#');
                copyAttr(a, link, 'target');
                copyAttr(a, link, 'rel');
            });

            var src = a.getAttribute('data-uc-pv-img') || '';
            if (src) {
                img.src = src;
                media.hidden = false;
            } else {
                /* No src at all rather than an empty one: setting src="" makes
                   a browser re-request the current document. */
                img.removeAttribute('src');
                media.hidden = true;
            }
            var cancelled = a.getAttribute('data-uc-pv-off') || '';
            off.textContent = cancelled;
            off.hidden = !cancelled;

            panel.querySelector('.uc-mp-title').textContent = a.getAttribute('data-uc-pv-title') || '';
            fillLine(panel.querySelector('.uc-mp-date'), a.getAttribute('data-uc-pv-date'));
            fillLine(panel.querySelector('.uc-mp-time'), a.getAttribute('data-uc-pv-time'));
            fillLine(panel.querySelector('.uc-mp-place'), a.getAttribute('data-uc-pv-place'));
        }

        /* An empty line is removed rather than left as an empty row, or an
           online event with no place would render a gap where an address goes. */
        function fillLine(el, text) {
            el.textContent = text || '';
            el.hidden = !text;
        }

        /* Copy an attribute, or take it off when the source has none. The
           second half matters: without it a tile that opens in a new tab would
           leave target="_blank" behind on the panel for the next tile that does
           not. */
        function copyAttr(from, to, name) {
            var value = from.getAttribute(name);
            if (null === value) {
                to.removeAttribute(name);
            } else {
                to.setAttribute(name, value);
            }
        }

        /*
         * WHERE IT GOES. Below the tile by default; above when there is not
         * room below; and pinned inside the viewport horizontally either way.
         *
         * THE BOTTOM ROW IS THE CASE THIS EXISTS FOR. A tile on the last week
         * of the month has the fold a few pixels under it, and a panel that
         * only ever opened downward would be off screen exactly where the
         * month is busiest.
         *
         * MEASURED AFTER THE PANEL IS SHOWN, NOT BEFORE. A popover has no size
         * until it is in the top layer, so it is shown first, measured, then
         * placed. It carries a class that keeps it invisible for that one
         * frame, or the first paint would be a flash in the corner.
         */
        function place(a) {
            var tile = a.getBoundingClientRect();
            var box  = panel.getBoundingClientRect();
            var gap  = 10;
            var edge = 8;

            var below = window.innerHeight - tile.bottom;
            var above = tile.top;
            var top;
            if (below >= box.height + gap + edge) {
                top = tile.bottom + gap;
                panel.classList.remove('is-above');
            } else if (above >= box.height + gap + edge) {
                top = tile.top - box.height - gap;
                panel.classList.add('is-above');
            } else {
                /* Neither side fits, which is a short window rather than a
                   bottom row. Sit it against the top edge and let it be beside
                   the tile rather than off screen. */
                top = Math.max(edge, Math.min(tile.top, window.innerHeight - box.height - edge));
                panel.classList.add('is-above');
            }

            var left = tile.left + (tile.width / 2) - (box.width / 2);
            left = Math.max(edge, Math.min(left, window.innerWidth - box.width - edge));

            panel.style.top  = Math.round(top) + 'px';
            panel.style.left = Math.round(left) + 'px';
        }

        function show(a) {
            current = a;
            fill(a);
            panel.classList.add('is-measuring');
            try {
                if (!panel.matches(':popover-open')) { panel.showPopover(); }
            } catch (e) {
                return; // Already open, or refused. Either way, nothing to do.
            }
            place(a);
            panel.classList.remove('is-measuring');
            panel.classList.add('is-open');
        }

        function hide() {
            current = null;
            panel.classList.remove('is-open');
            try {
                if (panel.matches(':popover-open')) { panel.hidePopover(); }
            } catch (e) { /* already closed */ }
        }

        function clearTimers() {
            if (openT) { window.clearTimeout(openT); openT = null; }
            if (closeT) { window.clearTimeout(closeT); closeT = null; }
        }

        function wantOpen(a) {
            clearTimers();
            if (current === a) { return; }
            openT = window.setTimeout(function () { show(a); }, PREVIEW_OPEN_DELAY);
        }

        function wantClose() {
            clearTimers();
            closeT = window.setTimeout(hide, PREVIEW_CLOSE_DELAY);
        }

        /* DELEGATED, so a month fetched by the view toggle or the arrows gets
           the behaviour without anything being rebound. mouseover rather than
           mouseenter because mouseenter does not bubble, and focusin/focusout
           rather than focus/blur for exactly the same reason.

           PLAIN addEventListener AND NO jQUERY, WHICH IS WHAT LETS THIS BLOCK
           EXIST IN BOTH SCRIPTS. embed.js has no jQuery on purpose, and the
           host page is somebody else's. See the marker note at the top. */
        function tileFrom(e) {
            var t = e.target;
            if (!t || typeof t.closest !== 'function') { return null; }
            return t.closest('.uc-day-event a[data-uc-preview]');
        }
        document.addEventListener('mouseover', function (e) {
            var tile = tileFrom(e);
            if (tile) { wantOpen(tile); }
        });
        document.addEventListener('mouseout', function (e) {
            if (tileFrom(e)) { wantClose(); }
        });
        /* The keyboard gets it too. Tabbing through a month is how somebody not
           using a mouse reads it, and there is no reason for them to have less.
           Focus is immediate: they asked for this tile. */
        document.addEventListener('focusin', function (e) {
            var tile = tileFrom(e);
            if (tile) { clearTimers(); show(tile); }
        });
        document.addEventListener('focusout', function (e) {
            if (tileFrom(e)) { wantClose(); }
        });

        /* Moving onto the panel keeps it; leaving it closes it. Without this,
           the panel closes as the pointer crosses the gap toward it. */
        panel.addEventListener('mouseover', clearTimers);
        panel.addEventListener('mouseout', wantClose);

        /* A scroll moves the tile out from under the panel, and a resize moves
           everything. Close rather than chase: the pointer is already somewhere
           else by the time either finishes. */
        window.addEventListener('scroll', function () { clearTimers(); hide(); }, true);
        window.addEventListener('resize', function () { clearTimers(); hide(); });
    }
    /* SFAF-PREVIEW-END */

    window.sfafCalendarEmbed = { scan: scan };

    /* THE PREVIEW IS BUILT ONCE FOR THE PAGE, NOT ONCE PER BLOCK, and not
     * inside scan(). Its listeners are delegated on the document and its panel
     * is appended to <body>, so a second block, a month fetched by the arrows
     * and a view swapped by the toggle are all already covered. Building it
     * per block would give a host page with two embeds two panels.
     *
     * It refuses to build itself where the device cannot hover, so on a phone
     * this costs one matchMedia call and nothing else. */
    try {
        initMonthPreview();
    } catch (e) {
        /* Same contract as everything else here: a failed enhancement must not
         * take the calendar with it. The tiles are still links. */
        if (window.console && window.console.error) {
            window.console.error('SFAF calendar: the hover preview failed to start.', e);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', scan);
    } else {
        scan();
    }

    // After load, not with it.
    if (document.readyState === 'complete') {
        scheduleNudge();
    } else {
        window.addEventListener('load', scheduleNudge);
    }
})();

</script>

<script>
var lines = [];
function say(s) { lines.push(s); }

function report() {
  document.getElementById('out').textContent = lines.join('\n');
}

/* ---- WATCHING FOR A NAVIGATION, three ways. ---------------------------
 *
 * A submit event is the one this fault raises, and it is caught in the CAPTURE
 * phase on the window so nothing downstream can hide it, then prevented so the
 * run continues past the first failure and reports on every control rather
 * than on the first one.
 *
 * The other two are there because a submit event is not the only way a page
 * goes somewhere: a script can call form.submit(), which fires no event at
 * all, or set location. Each is recorded and none is allowed to happen. */
window.__submits = [];
window.__navs    = [];
window.__allowSubmit = false;
window.__lastForm = null;

window.addEventListener('submit', function (e) {
  window.__lastForm = e.target;
  if (window.__allowSubmit) {
    /* THE NO-SCRIPT READING. requestSubmit(button) asks the browser for the
       submission that button would make, and FormData(form, submitter) is the
       browser's own serialisation of it, the submitter's name and value
       included. So what is read here is the address a visitor without script
       would actually be sent to. */
    window.__wouldSend = new URLSearchParams(new FormData(e.target, e.submitter)).toString();
  } else {
    window.__submits.push((e.submitter && e.submitter.textContent || '?').trim());
  }
  e.preventDefault();
}, true);

window.addEventListener('beforeunload', function () { window.__navs.push('unload'); });
HTMLFormElement.prototype.submit = function () { window.__navs.push('form.submit()'); };

function since(n) { return window.__submits.length - n; }

/* ---- THE CONTROLS, FOUND THE WAY A PERSON FINDS THEM. ------------------ */
function pills() {
  return Array.prototype.slice.call(document.querySelectorAll('.uc-filter-btn'));
}
function theForm() { return document.querySelector('.uc-filter-form'); }

function pressed(el, label) {
  var subs = window.__submits.length;
  var navs = window.__navs.length;
  el.click();
  var s = since(subs), n = window.__navs.length - navs;
  say('  ' + label
      + '  submits ' + s
      + ', navigations ' + n
      + (s || n ? '   <- THE PAGE WAS ABOUT TO RELOAD' : ''));
  return s + n;
}

function run(which) {
  say(which);
  say('');

  var form = theForm();
  say('the bar is inside a GET form   ' + (form ? form.method.toLowerCase() : 'THERE IS NO FORM'));
  say('pills on the bar               ' + pills().length);
  say('');

  /* ---- 1. EVERY PILL, PRESSED. ------------------------------------- */
  say('pressing each pill:');
  var bad = 0;
  pills().forEach(function (p) {
    bad += pressed(p, (p.getAttribute('data-category') || '?'));
  });
  say('');

  /* ---- 2. THE SEARCH FIELD. Typing, and Enter. ---------------------- */
  say('the search field:');
  var box = document.querySelector('.uc-search');
  if (!box) {
    say('  THERE IS NO SEARCH FIELD');
    bad++;
  } else {
    var subs = window.__submits.length, navs = window.__navs.length;
    box.focus();
    box.value = 'strut';
    box.dispatchEvent(new Event('input', { bubbles: true }));
    box.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', keyCode: 13, bubbles: true, cancelable: true }));
    var s = since(subs), n = window.__navs.length - navs;
    say('  Enter in the box              submits ' + s + ', navigations ' + n
        + (s || n ? '   <- THE PAGE WAS ABOUT TO RELOAD' : ''));
    bad += s + n;
  }
  say('');

  /* ---- 3. THE ORGANIZERS AND GROUPS CONTROL. ------------------------ */
  say('the Organizers and groups control:');
  var who = document.querySelector('[data-uc-who]');
  var boxes = document.querySelectorAll('[data-uc-who] input[type="checkbox"]');
  if (!who || !boxes.length) {
    say('  THE CONTROL IS NOT ON THE PAGE');
    bad++;
  } else {
    who.open = true;
    var subs = window.__submits.length, navs = window.__navs.length;
    boxes[0].click();
    var s = since(subs), n = window.__navs.length - navs;
    say('  ticking the first name        submits ' + s + ', navigations ' + n
        + (s || n ? '   <- THE PAGE WAS ABOUT TO RELOAD' : ''));
    bad += s + n;
  }
  say('');

  say('controls that would have navigated  ' + bad);
  say('');

  /* ---- 4. THE NO-SCRIPT ADDRESS. ------------------------------------
   *
   * requestSubmit() does not dispatch a click, so neither script's handler
   * runs and neither can influence the answer. What comes back is the query
   * string the browser itself would build for a press of that button. */
  say('what a press would send with script off:');
  if (!form) {
    say('  NO FORM, so nothing would be sent at all');
    bad++;
  } else {
    pills().forEach(function (p) {
      window.__allowSubmit = true;
      window.__wouldSend = '(nothing)';
      form.requestSubmit(p);
      window.__allowSubmit = false;
      say('  ' + (p.getAttribute('data-category') || '?') + '  ->  ?' + window.__wouldSend);
    });
  }
  say('');
  say('script errors    ' + (window.__errs.length ? window.__errs.join(' | ') : 'none'));
  report();
}
window.addEventListener('load', function () {
  setTimeout(function () { run('embed.js, on the real embed markup'); }, 250);
});
</script>
</body>
</html>
