         * one. It is called with the dialog never having been built, which its
         * `else` branch already handles by hiding the block.
         */
        var carried = choice.getAttribute('data-uc-scope-answered');
        if (carried === 'this' || carried === 'all_upcoming') {
            choose(carried, true);
            return;
        }

        /* Last, so every listener above is bound before the question can be
         * answered. Everything up to this point works whether or not this
         * does anything. */
        openModal();
    }

    /* ---------------------------------------------------------------------
     * THE RECURRENCE CONTROL.
     *
     * ENHANCEMENT ONLY. The server sends every panel visible and every control
     * a real input, and reads repeat_mode on save. With this function deleted
     * the whole thing still works: you pick a mode, tick days, choose an end,
     * and save. What is added is folding away the panels that do not apply and
     * the live summary line.
     *
     * THE DATE ARITHMETIC IS DUPLICATED HERE, AND THAT IS A REAL RISK. The
     * count in the summary has to be the count that will actually be created,
     * so this mirrors SFAF_Recurrence::dates() step for step: the same week
     * blocks, the same "a month without a fifth Friday is skipped", the same
     * distinction between last and fifth, the same caps, the same merge of
     * hand-picked dates. Two implementations of one rule can drift, so they are
     * cross-checked against each other over a matrix of cases rather than
     * trusted to stay in step by inspection. If you change one, change the
     * other and re-run that check.
     *
     * THE MARKERS BELOW ARE LOAD-BEARING. .claude/recurrence-crosscheck.php
     * slices this file between them and evaluates what it finds, so the check
     * runs against the code that ships rather than against a copy of it that
     * somebody remembered to update. Everything between the markers must be
     * free of DOM access and of anything outside this block, because that is
     * all the harness gives it.
     * ------------------------------------------------------------------- */
    /* --8<-- recurrence engine start --8<-- */
    var UC_MAX_OCCURRENCES = 366;
    var UC_DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    function ucParseYmd(s) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
        if (!m) { return null; }
        // UTC throughout, so nothing here can be moved a day by a timezone.
        // The stored dates are plain calendar days and are treated as such.
        return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    }
    function ucYmd(d) {
        var mm = String(d.getUTCMonth() + 1);
        var dd = String(d.getUTCDate());
        return d.getUTCFullYear() + '-' + (mm.length < 2 ? '0' + mm : mm) + '-' + (dd.length < 2 ? '0' + dd : dd);
    }
    function ucAddDays(d, n) {
        var x = new Date(d.getTime());
        x.setUTCDate(x.getUTCDate() + n);
        return x;
    }
    function ucAddMonths(d, n) {
        var x = new Date(d.getTime());
        // Matches PHP's "+1 month": the 31st of January becomes the 3rd of
        // March rather than being clamped to the 28th. Same overflow, so the
        // two engines agree on the awkward dates as well as the easy ones.
        x.setUTCMonth(x.getUTCMonth() + n);
        return x;
    }
    function ucNthWeekday(year, month, nth, dow) {
        if (nth === -1) {
            var last = new Date(Date.UTC(year, month + 1, 0));
            return ucAddDays(last, -(((last.getUTCDay() - dow) + 7) % 7));
        }
        var first = new Date(Date.UTC(year, month, 1));
        var day = 1 + (((dow - first.getUTCDay()) + 7) % 7) + (nth - 1) * 7;
        var d = new Date(Date.UTC(year, month, day));
        return (d.getUTCMonth() === month) ? d : null;
    }

    /** The mirror of SFAF_Recurrence::clean_dates(). */
    function ucCleanDates(list, after) {
        var seen = {};
        var out = [];
        (list || []).forEach(function (raw) {
            var d = String(raw == null ? '' : raw).replace(/^\s+|\s+$/g, '');
            var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
            if (!m) { return; }
            // A real calendar day, not merely the shape of one. Date.UTC rolls
            // 2026-02-31 forward to March, so the round trip is the check,
            // the same thing checkdate() does on the PHP side.
            var probe = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
            if (ucYmd(probe) !== d) { return; }
            if (after && d <= after) { return; }
            if (seen[d]) { return; }
            seen[d] = true;
            out.push(d);
        });
        out.sort();
        return out;
    }

    /** The mirror of SFAF_Recurrence::merge_dates(). */
    function ucMergeDates(patternDates, extra) {
        var seen = {};
        var out = [];
        (patternDates || []).concat(extra || []).forEach(function (d) {
            if (seen[d]) { return; }
            seen[d] = true;
            out.push(d);
        });
        out.sort();
        return out.slice(0, UC_MAX_OCCURRENCES);
    }

    /**
     * The mirror of SFAF_Recurrence::dates().
     *
     * `extra` is the hand-picked list and is merged in on the same terms the
     * PHP applies: cleaned against the start date, de-duplicated against the
     * pattern's own dates, sorted, and the whole set capped.
     */
    function ucRecurrenceDates(startYmd, endYmd, spec, limit, extra) {
        if (!startYmd) { return []; }
        return ucMergeDates(
            ucPatternDates(startYmd, endYmd, spec, limit),
            ucCleanDates(extra, startYmd)
        );
    }

    /** The mirror of SFAF_Recurrence::pattern_dates(): the cadence alone. */
    function ucPatternDates(startYmd, endYmd, spec, limit) {
        var from = ucParseYmd(startYmd);
        if (!from || !spec || !spec.type) { return []; }
        // A custom schedule has no cadence. Every date it has was chosen by
        // hand and arrives through `extra`.
        if (spec.type === 'custom') { return []; }
        limit = Math.max(0, limit | 0);
        if (!endYmd && limit <= 0) { return []; }

        var stop = endYmd ? ucParseYmd(endYmd) : ucAddMonths(from, 120);
        if (!stop || stop < from) { return []; }

        var cap = limit > 0 ? Math.min(limit, UC_MAX_OCCURRENCES) : UC_MAX_OCCURRENCES;
        var interval = Math.max(1, Math.min(spec.interval || 1, 52));
        var out = [];
        var cur, i;

        if (spec.type === 'daily') {
            cur = from;
            while (out.length < cap) {
                cur = ucAddDays(cur, interval);
                if (cur > stop) { break; }
                out.push(ucYmd(cur));
            }
        } else if (spec.type === 'weekly') {
            var days = (spec.days && spec.days.length) ? spec.days.slice() : [from.getUTCDay()];
            days.sort(function (a, b) { return a - b; });
            var weekStart = ucAddDays(from, -from.getUTCDay());
            var horizon = ucAddDays(stop, 7);
            for (var block = 0; out.length < cap; block++) {
                var base = ucAddDays(weekStart, block * interval * 7);
                if (base > horizon) { break; }
                for (i = 0; i < days.length; i++) {
                    var hit = ucAddDays(base, days[i]);
                    if (hit <= from || hit > stop) { continue; }
                    if (out.length >= cap) { break; }
                    out.push(ucYmd(hit));
                }
                if (block > UC_MAX_OCCURRENCES) { break; }
            }
        } else if (spec.type === 'monthly') {
            cur = from;
            while (out.length < cap) {
                cur = ucAddMonths(cur, interval);
                if (cur > stop) { break; }
                out.push(ucYmd(cur));
            }
        } else if (spec.type === 'monthly_nth') {
            var nth = spec.nth, dow = spec.dow;
            if (!nth || dow < 0) {
                nth = Math.ceil(from.getUTCDate() / 7);
                dow = from.getUTCDay();
            }
            var cursor = new Date(Date.UTC(from.getUTCFullYear(), from.getUTCMonth(), 1));
            for (i = 0; i < UC_MAX_OCCURRENCES && out.length < cap; i++) {
                cursor = ucAddMonths(cursor, 1);
                if (cursor > stop) { break; }
                var got = ucNthWeekday(cursor.getUTCFullYear(), cursor.getUTCMonth(), nth, dow);
                if (!got || got > stop || got <= from) { continue; }
                out.push(ucYmd(got));
            }
        }
        return out;
    }

    /** The mirror of SFAF_Recurrence::pattern_label(). */
    function ucRecurrenceLabel(spec, startYmd) {
        var from = ucParseYmd(startYmd);
        var interval = Math.max(1, spec.interval || 1);
        var i, list;

        if (spec.type === 'custom') { return 'On chosen dates'; }
        if (spec.type === 'daily') {
            return interval === 1 ? 'Every day' : 'Every ' + interval + ' days';
        }
        if (spec.type === 'weekly') {
            var days = (spec.days && spec.days.length) ? spec.days.slice() : (from ? [from.getUTCDay()] : []);
            days.sort(function (a, b) { return a - b; });
            list = [];
            for (i = 0; i < days.length; i++) { list.push(UC_DAY_NAMES[days[i]]); }
            var on = list.length ? ' on ' + ucJoinWords(list) : '';
            if (interval === 1) { return 'Every week' + on; }
            if (interval === 2 && days.length === 1) { return 'Every other ' + UC_DAY_NAMES[days[0]]; }
            return 'Every ' + interval + ' weeks' + on;
        }
        if (spec.type === 'monthly') {
            var every = interval === 1 ? 'Every month' : 'Every ' + interval + ' months';
            // "on day 4". No ordinal: see SFAF_Recurrence::pattern_label(), whose
            // words this has to match exactly or the cross-check fails.
            return from ? every + ' on day ' + from.getUTCDate() : every;
        }
        if (spec.type === 'monthly_nth') {
            var nth = spec.nth, dow = spec.dow;
            if (!nth || dow < 0) {
                if (!from) { return 'Every month, on the same weekday'; }
                nth = Math.ceil(from.getUTCDate() / 7);
                dow = from.getUTCDay();
            }
            var words = { '1': 'first', '2': 'second', '3': 'third', '4': 'fourth', '5': 'fifth', '-1': 'last' };
            return 'Every ' + (words[String(nth)] || 'first') + ' ' + UC_DAY_NAMES[dow] + ' of the month';
        }
        return '';
    }
    function ucJoinWords(list) {
        if (!list.length) { return ''; }
        if (list.length === 1) { return list[0]; }
        if (list.length === 2) { return list[0] + ' and ' + list[1]; }
        // The serial comma, matching SFAF_Recurrence::join_words(). The
        // cross-check compares this function's output against that one's, so
        // they change together.
        return list.slice(0, -1).join(', ') + ', and ' + list[list.length - 1];
    }
    function ucPrettyDate(ymd) {
        var d = ucParseYmd(ymd);
        if (!d) { return ymd; }
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        // "Aug 4, 2026". The comma was missing, and this is the same 'M j, Y'
        // that sfaf_ap_date( ..., 'short_year' ) renders on the PHP side: these
        // dates sit in the same schedule editor as the ones the server writes.
        return months[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear();
    }
    function ucPlural(n, one, many) { return n === 1 ? one : many; }

    /**
     * The mirror of SFAF_Recurrence::summary().
     *
     * The sentence AND the number, from one function, because the number is a
     * promise about how many posts a save is going to create and the sentence
     * is what somebody reads instead of counting. Splitting them is how a
     * summary comes to say 21 while the generator makes 23.
     */
    function ucRecurrenceSummary(startYmd, endYmd, spec, limit, extra, tail) {
        if (!spec || !spec.type) {
            return 'Does not repeat. One event will be created.';
        }
        if (!startYmd) {
            return 'Set the event date first, since every repeat is counted from it.';
        }

        var clean = ucCleanDates(extra, startYmd);
        var made = ucRecurrenceDates(startYmd, endYmd, spec, limit, clean);
        var total = made.length + 1;   // the event itself is the first occurrence

        if (spec.type === 'custom') {
            if (!clean.length) {
                return 'Add the dates this happens on.';
            }
            return total + ' ' + ucPlural(total, 'date', 'dates') + '. '
                + total + ' ' + ucPlural(total, 'event', 'events') + ' will be created.';
        }

        // The extras that ADD a date, not the ones in the box: a date the
        // pattern already produces is one event, so counting it here would
        // announce an event that is not going to exist. See the PHP note.
        var fromPattern = ucPatternDates(startYmd, endYmd, spec, limit);
        var net = clean.filter(function (d) { return fromPattern.indexOf(d) === -1; });
        var plus = '';
        if (net.length) {
            plus = ', plus ' + net.length + ' extra ' + ucPlural(net.length, 'date', 'dates');
        }

        return ucRecurrenceLabel(spec, startYmd) + (tail || '') + plus + '. '
            + total + ' ' + ucPlural(total, 'event', 'events') + ' will be created.';
    }
    /* --8<-- recurrence engine end --8<-- */

    function initRecurrence() {
        Array.prototype.forEach.call(document.querySelectorAll('[data-uc-repeat]'), function (root) {
            var summary = root.querySelector('[data-uc-repeat-summary]');
            var panels = {};
            Array.prototype.forEach.call(root.querySelectorAll('[data-uc-repeat-panel]'), function (p) {
                panels[p.getAttribute('data-uc-repeat-panel')] = p;
            });
            // The date the event itself is on. Every pattern is anchored to it,
            // and it can change while this control is open, so it is read from
            // the form each time rather than captured once.
            var dateInput = document.querySelector('input[name="date"]');

            function startDate() {
                if (dateInput && dateInput.value) { return dateInput.value; }
                return root.getAttribute('data-uc-repeat-date') || '';
            }
            function mode() {
                var on = root.querySelector('[data-uc-repeat-mode]:checked');
                return on ? on.value : '';
            }
            function chosenDays() {
                var out = [];
                Array.prototype.forEach.call(root.querySelectorAll('[data-uc-repeat-day]:checked'), function (b) {
                    out.push(parseInt(b.value, 10));
                });
                return out;
            }
            function currentSpec() {
                var m = mode();
                if (m === 'custom') { return { type: 'custom', interval: 1, days: [] }; }
                if (m === 'daily') { return { type: 'daily', interval: 1 }; }
                if (m === 'weekly') {
                    var n = parseInt((root.querySelector('[name="repeat_weekly_interval"]') || {}).value, 10);
                    return { type: 'weekly', interval: (n > 0 ? n : 1), days: chosenDays() };
                }
                if (m === 'monthly') {
                    var sub = root.querySelector('[data-uc-repeat-monthly]:checked');
                    if (sub && sub.value === 'nth') {
                        return {
                            type: 'monthly_nth',
                            nth: parseInt((root.querySelector('[name="repeat_nth"]') || {}).value, 10) || 1,
                            dow: parseInt((root.querySelector('[name="repeat_nth_dow"]') || {}).value, 10)
                        };
                    }
                    return { type: 'monthly', interval: 1 };
                }
                return null;
            }
            function ends() {
                var on = root.querySelector('[data-uc-repeat-ends]:checked');
                return on ? on.value : 'never';
            }

            /* ---- The dates picker -----------------------------------------
             *
             * ONE LIST, TWO MEANINGS, AND THE MEANING IS THE MODE. Under Custom
             * it is the schedule; beside a pattern it is the dates the pattern
             * does not cover. Same markup, same repeat_dates[] field name, same
             * parser on the server, so there is no second idea of what a chosen
             * date is.
             *
             * EACH ROW CARRIES A HIDDEN INPUT rather than the list being
             * serialised on submit. A hidden input is a real form field: it
             * survives a browser restoring the form, it needs no submit
             * handler, and if this script throws after the rows are built the
             * dates still post. Removing a row removes its field, which is the
             * whole of what "remove" has to mean.
             *
             * THE FOUR SERVER-RENDERED SLOTS ARE THE NO-SCRIPT PATH and are
             * hidden here rather than emptied: a hidden input with no value
             * posts an empty string, which clean_dates() drops, so leaving them
             * in place costs nothing and keeps the markup honest for anybody
             * reading it with script switched off.
             */
            var datesPanel = panels.dates;
            var addRow = root.querySelector('[data-uc-dates-add]');
            var addInput = root.querySelector('[data-uc-dates-input]');
            var addBtn = root.querySelector('[data-uc-dates-addbtn]');
            var list = root.querySelector('[data-uc-dates-list]');
            var slots = root.querySelector('[data-uc-dates-slots]');
            var datesLabel = root.querySelector('[data-uc-dates-label]');
            var chosen = [];

            if (addRow) { addRow.removeAttribute('hidden'); }
            if (slots) { slots.hidden = true; }

            function renderDates() {
                if (!list) { return; }
                list.textContent = '';

                /* THE EVENT'S OWN DATE IS SHOWN AS THE FIRST ROW IN CUSTOM
                 * MODE, and it is not removable. The summary says "5 dates" and
                 * counts the event itself as one of them, so five rows have to
                 * be on screen or the sentence is describing something the
                 * manager cannot see. Beside a pattern it is not shown, because
                 * there the list means "extra" and the event's date is not one
                 * of the extras. */
                var start = startDate();
                if (mode() === 'custom' && start) {
                    var own = document.createElement('li');
                    own.className = 'uc-dates-row uc-dates-row-own';
                    var ownText = document.createElement('span');
                    ownText.className = 'uc-dates-when';
                    ownText.textContent = ucPrettyDate(start);
                    var ownTag = document.createElement('span');
                    ownTag.className = 'uc-dates-own-tag';
                    ownTag.textContent = "the event's own date";
                    own.appendChild(ownText);
                    own.appendChild(ownTag);
                    list.appendChild(own);
                }

                chosen.forEach(function (ymd) {
                    var li = document.createElement('li');
                    li.className = 'uc-dates-row';

                    var hidden = document.createElement('input');
                    hidden.type = 'hidden';
                    hidden.name = 'repeat_dates[]';
                    hidden.value = ymd;

                    var when = document.createElement('span');
                    when.className = 'uc-dates-when';
                    when.textContent = ucPrettyDate(ymd);

                    var remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'uc-link-danger uc-btn-sm';
                    remove.textContent = 'Remove';
                    remove.setAttribute('aria-label', 'Remove ' + ucPrettyDate(ymd));
                    remove.addEventListener('click', function () {
                        chosen = chosen.filter(function (d) { return d !== ymd; });
                        renderDates();
                        refresh();
                        if (addInput) { addInput.focus(); }
                    });

                    li.appendChild(hidden);
                    li.appendChild(when);
                    li.appendChild(remove);
                    list.appendChild(li);
                });
            }

            function addDate() {
                if (!addInput) { return; }
                // Cleaned by the same rules the server uses, against the event's
                // own date, so a date the save would silently drop is refused
                // here instead of appearing in a list and then not existing.
                var got = ucCleanDates([addInput.value], startDate());
                if (!got.length) { return; }
                if (chosen.indexOf(got[0]) === -1) {
                    chosen.push(got[0]);
                    chosen.sort();
                }
                addInput.value = '';
                renderDates();
                refresh();
            }

            if (addBtn) { addBtn.addEventListener('click', addDate); }
            if (addInput) {
                // Enter in a date field would otherwise submit the whole form,
                // which on this screen creates the event.
                addInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addDate();
                    }
                });
            }

            function refresh() {
                var m = mode();
                if (panels.weekly) { panels.weekly.hidden = (m !== 'weekly'); }
                if (panels.monthly) { panels.monthly.hidden = (m !== 'monthly'); }
                // No cadence under Custom, so nothing for "Ends" to bound.
                if (panels.ends) { panels.ends.hidden = (m === '' || m === 'custom'); }
                if (datesPanel) { datesPanel.hidden = (m === ''); }
                if (datesLabel) {
                    datesLabel.textContent = (m === 'custom') ? 'Dates' : 'Extra dates';
                }

                if (!summary) { return; }
                var spec = currentSpec();
                var start = startDate();

                // The two prompts that are about a control rather than about a
                // count, so they are answered before the engine is asked for a
                // number it cannot produce.
                if (spec && spec.type === 'weekly' && !spec.days.length) {
                    summary.textContent = 'Pick at least one day of the week.';
                    return;
                }

                var how = ends(), until = '', limit = 0, tail = '';
                if (spec && spec.type !== 'custom' && start) {
                    if (how === 'on') {
                        until = (root.querySelector('[name="repeat_until"]') || {}).value || '';
                        if (!until) {
                            summary.textContent = 'Choose the date it runs until.';
                            return;
                        }
                        tail = ', until ' + ucPrettyDate(until);
                    } else if (how === 'after') {
                        var total = parseInt((root.querySelector('[name="repeat_count"]') || {}).value, 10);
                        if (!(total > 1)) {
                            summary.textContent = 'Choose how many occurrences there should be.';
                            return;
                        }
                        limit = total - 1;
                    } else {
                        limit = 52;      // must equal SFAF_Portal::REPEAT_OPEN_ENDED_LIMIT
                        tail = ', for a year';
                    }
                }

                summary.textContent = ucRecurrenceSummary(start, until, spec, limit, chosen, tail);
            }

            root.addEventListener('change', refresh);
            root.addEventListener('input', refresh);
            if (dateInput) {
                dateInput.addEventListener('change', function () {
                    // The event's own date anchors everything, and moving it
                    // can make a chosen date invalid (on or before it). Re-clean
                    // rather than leaving a row that will be dropped on save.
                    chosen = ucCleanDates(chosen, startDate());
                    renderDates();
                    refresh();
                });
            }
            renderDates();
            refresh();
        });
    }

    /* ---------------------------------------------------------------------
     * "Anyone else": one address at a time, as removable pills.
     *
     * ENHANCEMENT ONLY, AGAIN. Each pill is a ticked checkbox, so unticking one
     * takes the address off the list with scripting switched off, and the Add
     * field simply posts and is appended by the server. What this adds is
     * refusing a bad address while the person is still looking at it, rather
     * than after a save and a page load, and taking a removed pill off the
     * screen instead of leaving it there greyed out.
     * ------------------------------------------------------------------- */
    function initEmailPills() {
        Array.prototype.forEach.call(document.querySelectorAll('[data-uc-emails]'), function (root) {
            var list = root.querySelector('[data-uc-email-pills]');
            var input = root.querySelector('[data-uc-email-input]');
            var addBtn = root.querySelector('[data-uc-email-add]');
            var error = root.querySelector('[data-uc-email-error]');
            var empty = root.querySelector('[data-uc-emails-empty]');
            if (!list || !input || !addBtn) { return; }

            function known() {
                var out = [];
                Array.prototype.forEach.call(list.querySelectorAll('[data-uc-email-pill]'), function (b) {
                    if (b.checked) { out.push(b.value.toLowerCase()); }
                });
                return out;
            }
            function syncEmpty() {
                if (!empty) { return; }
                empty.hidden = known().length !== 0;
            }
            function say(msg) {
                if (!error) { return; }
                error.textContent = msg || '';
                error.hidden = !msg;
            }
            function valid(addr) {
                // Deliberately the same shape of test the server applies: an
                // address with one @, something either side, and a dot in the
                // domain. Anything stricter here would reject addresses the
                // server would have accepted, which is worse than the reverse.
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr);
            }

            function add() {
                var addr = (input.value || '').trim();
                if (!addr) { say('Type an address first.'); input.focus(); return; }
                if (!valid(addr)) { say('"' + addr + '" is not an email address.'); input.focus(); return; }
                if (known().indexOf(addr.toLowerCase()) !== -1) {
                    say('That address is already on the list.');
                    input.value = '';
                    return;
                }

                var label = document.createElement('label');
                label.className = 'uc-email-pill';
                var box = document.createElement('input');
                box.type = 'checkbox';
                box.name = 'notify_emails[]';
                box.value = addr;
                box.checked = true;
                box.setAttribute('data-uc-email-pill', '');
                var text = document.createElement('span');
                text.className = 'uc-email-pill-text';
                text.textContent = addr;
                var x = document.createElement('span');
                x.className = 'uc-email-pill-x';
                x.setAttribute('aria-hidden', 'true');
                x.textContent = '×';
                label.appendChild(box);
                label.appendChild(text);
                label.appendChild(x);
                list.appendChild(label);

                // The add field must not also post, or the address would be
                // counted twice: once as a pill and once as a new one.
                input.value = '';
                say('');
                syncEmpty();
                input.focus();
            }

            addBtn.addEventListener('click', add);
            input.addEventListener('keydown', function (e) {
                // Enter adds the address rather than submitting the whole form,
                // which is what it would otherwise do in a single-field row.
                if (e.key === 'Enter') { e.preventDefault(); add(); }
            });
            input.addEventListener('input', function () { say(''); });

            list.addEventListener('change', function (e) {
                var box = e.target;
                if (!box || !box.hasAttribute || !box.hasAttribute('data-uc-email-pill')) { return; }
                if (!box.checked) {
                    var pill = box.closest('.uc-email-pill');
                    if (pill) { pill.parentNode.removeChild(pill); }
                }
                syncEmpty();
            });

            syncEmpty();
        });
    }

    /* ---------------------------------------------------------------------
     * SERIES PREFILL, AT EVENT CREATION (3.38.0).
     *
     * Choosing a series offers to fill the rest of the form in from it. Every
     * value is written straight into the fields on this page: nothing posts,
     * nothing redirects, and nothing already typed is lost by pressing it. That
     * is the FAQ set picker's shape and it is deliberate, because 3.3.0 found
     * that a control which applies by posting discards unsaved edits and people
     * then stop using it.
     *
     * IT ASKS BEFORE OVERWRITING. Every ticked box names a field; any of those
     * fields that already has something in it is listed by name in a confirm
     * before a single one is written. The picker being first on the form means
     * this is usually nothing, and "usually" is not a guarantee.
     *
     * THE DATE IS NOT HERE. It is not in the payload, so there is no box to
     * tick and nothing a later change could expose.
     * ------------------------------------------------------------------- */
    function initSeriesPrefill() {
        var root = document.querySelector('[data-uc-series-prefill]');
        if (!root) { return; }

        var select = root.querySelector('[data-uc-series-select]');
        var panel = root.querySelector('[data-uc-prefill-panel]');
        var optsBox = root.querySelector('[data-uc-prefill-opts]');
        var nameOut = root.querySelector('[data-uc-prefill-name]');
        var applyBtn = root.querySelector('[data-uc-prefill-apply]');
        var noneBtn = root.querySelector('[data-uc-prefill-none]');
        var said = root.querySelector('[data-uc-prefill-said]');
        var dataNode = root.querySelector('[data-uc-prefill-data]');
        if (!select || !panel || !optsBox || !dataNode) { return; }

        var data;
        try {
            data = JSON.parse(dataNode.textContent || '{}');
        } catch (e) {
            return; // Without the payload there is nothing to offer.
        }

        var form = select.form || document.querySelector('form.uc-form');
        if (!form) { return; }

        /*
         * WHAT EACH OPTION IS: a label, the payload keys it reads, and the
         * functions that read and write the form. Keeping read and write beside
         * each other is what makes the overwrite check honest: the thing that
         * decides "is this field already filled" is the same thing that will
         * write to it.
         */
        var OPTIONS = [
            {
                key: 'location', label: 'Location',
                has: function (d) { return d.location_mode !== ''; },
                preview: function (d) { return d.venue_name || d.location; },
                filled: function () {
                    var text = form.querySelector('[name="location"]');
                    var venue = form.querySelector('[name="venue"]');
                    return (text && text.value.trim() !== '') || (venue && venue.value && venue.value !== '0');
                },
                write: function (d) {
                    var mode = form.querySelector('[data-uc-location-mode="' + d.location_mode + '"]');
                    if (mode) { mode.checked = true; mode.dispatchEvent(new Event('change', { bubbles: true })); }
                    if (d.location_mode === 'venue') {
                        var venue = form.querySelector('[name="venue"]');
                        if (venue) { venue.value = String(d.venue); }
                    } else {
                        var text = form.querySelector('[name="location"]');
                        if (text) { text.value = d.location; }
                    }
                }
            },
            {
                key: 'times', label: 'Start and end time',
                has: function (d) { return d.start_time !== '' || d.end_time !== ''; },
                preview: function (d) { return d.start_time + (d.end_time ? ' to ' + d.end_time : ''); },
                filled: function () {
                    var s = form.querySelector('[name="start_time"]');
                    var e = form.querySelector('[name="end_time"]');
                    return (s && s.value !== '') || (e && e.value !== '');
                },
                write: function (d) {
                    var s = form.querySelector('[name="start_time"]');
                    var e = form.querySelector('[name="end_time"]');
                    if (s) { s.value = d.start_time; }
                    if (e) { e.value = d.end_time; }
                }
            },
            {
                key: 'description', label: 'Description',
                has: function (d) { return String(d.description).trim() !== ''; },
                preview: function (d) { return trimWords(stripTags(d.description), 8); },
                filled: function () { return descriptionValue().trim() !== ''; },
                write: function (d) { setDescription(d.description); }
            },
            {
                key: 'image', label: 'Image',
                has: function (d) { return d.image_url !== '' || d.image_id > 0; },
                preview: function (d) { return fileName(d.image_url); },
                /*
                 * A PICTURE, NOT ITS FILE NAME (3.64.2). Every other row on
                 * this card shows the value itself: the address, the times, the
                 * opening words. This row showed
                 * prop-harm-reduction-1024x576.jpg, which answers nothing
                 * anybody is asking at that moment. The file name stays as the
                 * alt text, so a screen reader keeps the only handle it had,
                 * and as the fallback when the URL will not load.
                 */
                previewNode: function (d) {
                    var src = d.image_preview || d.image_url;
                    if (!src) { return null; }
                    var img = document.createElement('img');
                    img.className = 'uc-prefill-thumb';
                    img.alt = fileName(d.image_url);
                    img.addEventListener('error', function () {
                        var span = document.createElement('span');
                        span.textContent = fileName(d.image_url);
                        if (img.parentNode) { img.parentNode.replaceChild(span, img); }
                    });
                    img.src = src;
                    return img;
                },
                filled: function () {
                    var url = form.querySelector('[data-uc-image-url]');
                    var id = form.querySelector('[data-uc-image-id]');
                    return (url && url.value.trim() !== '') || (id && id.value && id.value !== '0');
                },
                write: function (d) {
                    var url = form.querySelector('[data-uc-image-url]');
                    if (url && d.image_url) { url.value = d.image_url; }
                    var id = form.querySelector('[data-uc-image-id]');
                    if (id && d.image_id) { id.value = String(d.image_id); }

                    /*
                     * AND THE SCREEN HAS TO SHOW IT (3.64.2). Writing the two
                     * hidden values left the preview empty and the tag reading
                     * "Placeholder", so the button reported filling six things
                     * in and the picture was the one thing that could not be
                     * seen. It is COPIED onto this event, exactly as the
                     * location and the times are, so it reads as the event's
                     * own image and not as an inherited one.
                     */
                    var anchor = url || id;
                    var field = anchor && anchor.closest ? anchor.closest('.uc-image-field') : null;
                    if (field) {
                        showImagePreview(field, d.image_preview || d.image_url);
                        markImageAsOwn(field);
                    }
                    // Setting .value in script fires neither input nor change,
                    // so the completeness meter has to be told by hand.
                    if (window.sfafRefreshCompleteness) { window.sfafRefreshCompleteness(); }
                }
            },
            {
                key: 'category', label: 'Category',
                has: function (d) { return d.categories.length > 0; },
                preview: function (d) { return d.category_names.join(', '); },
                filled: function () {
                    return !!form.querySelector('[name="category[]"]:checked');
                },
                write: function (d) {
                    // Additive within the option: the boxes it names are ticked
                    // and nothing else is untouched, because the overwrite
                    // question was already asked above.
                    d.categories.forEach(function (id) {
                        var box = form.querySelector('[name="category[]"][value="' + id + '"]');
                        if (box && !box.checked) {
                            box.checked = true;
                            box.dispatchEvent(new Event('change', { bubbles: true }));
                        }
                    });
                }
            },
            {
                /*
                 * A SET, NOT A VALUE (3.40.0). The picker became checkboxes when
                 * events gained co-hosts, so this reads and writes the same way
                 * the category option directly above does. The label is the
                 * phrase the event page will show, so the checkbox reads the way
                 * the result will.
                 */
                key: 'organizer', label: 'Organizer',
                has: function (d) { return d.organizers && d.organizers.length > 0; },
                preview: function (d) { return d.organizer_name; },
                filled: function () {
                    return !!form.querySelector('[name="organizer[]"]:checked');
                },
                write: function (d) {
                    d.organizers.forEach(function (id) {
                        var box = form.querySelector('[name="organizer[]"][value="' + id + '"]');
                        if (box && !box.checked) {
                            box.checked = true;
                            box.dispatchEvent(new Event('change', { bubbles: true }));
                        }
                    });
                }
            },
            {
                key: 'faq', label: 'FAQ set',
                has: function (d) { return d.faq_set !== ''; },
                preview: function (d) { return d.faq_set_name; },
                filled: function () {
                    var q = form.querySelector('[name^="uc_faqs"][name$="[question]"]');
                    return !!(q && q.value.trim() !== '');
                },
                write: function (d) {
                    /*
                     * Handed to the FAQ set picker rather than reimplemented.
                     * It already knows how to add rows without duplicating a
                     * question that is there, and two pieces of code writing
                     * FAQ rows is two that can disagree.
                     */
                    var sel = document.querySelector('[data-uc-faq-set]');
                    var btn = document.querySelector('[data-uc-faq-apply]');
                    if (sel && btn) {
                        sel.value = d.faq_set;
                        btn.click();
                    }
                }
            }
        ];

        function stripTags(s) {
            var tmp = document.createElement('div');
            tmp.innerHTML = String(s);
            return (tmp.textContent || '').replace(/\s+/g, ' ').trim();
        }
        function trimWords(s, n) {
            var w = String(s).split(' ');
            return w.length <= n ? s : w.slice(0, n).join(' ') + '...';
        }
        function fileName(url) {
            var name = String(url || '').split('?')[0].split('/').pop();
            return name || 'the series image';
        }

        /*
         * THE DESCRIPTION MAY BE TinyMCE OR A TEXTAREA, and which one depends on
         * whether the editor started. Both are asked, in that order, so the
         * prefill works either way rather than silently writing into a textarea
         * nobody can see.
         */
        function editor() {
            return (window.tinymce && window.tinymce.get) ? window.tinymce.get('uc-description') : null;
        }
        function descriptionValue() {
            var ed = editor();
            if (ed && !ed.isHidden()) { return ed.getContent({ format: 'text' }); }
            var ta = form.querySelector('[name="description"]');
            return ta ? ta.value : '';
        }
        function setDescription(html) {
            var ed = editor();
            if (ed && !ed.isHidden()) { ed.setContent(html); return; }
            var ta = form.querySelector('[name="description"]');
            if (ta) { ta.value = html; }
        }

        function say(msg, bad) {
            if (!said) { return; }
            said.textContent = msg || '';
            said.className = 'uc-flash uc-prefill-said' + (bad ? ' uc-flash-error' : '');
            if (msg) { said.removeAttribute('hidden'); } else { said.setAttribute('hidden', 'hidden'); }
        }

        var current = [];

        function build() {
            var id = select.value;
            var d = data[id];
            say('');

            if (!id || id === '0' || !d) {
                panel.setAttribute('hidden', 'hidden');
                return;
            }

            current = OPTIONS.filter(function (o) { return o.has(d); });

            if (!current.length) {
                // A series with nothing to lend offers nothing, rather than an
                // empty panel asking a question with no answers.
                panel.setAttribute('hidden', 'hidden');
                return;
            }

            if (nameOut) {
                nameOut.textContent = select.options[select.selectedIndex].text;
            }

            optsBox.innerHTML = '';
            current.forEach(function (o) {
                var label = document.createElement('label');
                label.className = 'uc-check';

                var box = document.createElement('input');
                box.type = 'checkbox';
                box.checked = true;                 // all ticked by default
                box.setAttribute('data-uc-prefill-opt', o.key);

                var text = document.createElement('span');
                text.className = 'uc-prefill-opt-text';
                var strong = document.createElement('strong');
                strong.textContent = o.label;
                /*
                 * A ROW SHOWS ITS VALUE, and for one of them the value is a
                 * picture. previewNode() is optional: an option without one is
                 * text, exactly as every row was before, and an option with one
                 * that hands back nothing falls back to the same text rather
                 * than to an empty row.
                 */
                var quiet = document.createElement('span');
                quiet.className = 'uc-muted';
                var node = o.previewNode ? o.previewNode(d) : null;
                if (node) {
                    quiet.appendChild(node);
                } else {
                    quiet.textContent = o.preview(d) || '';
                }

                text.appendChild(strong);
                text.appendChild(quiet);
                label.appendChild(box);
                label.appendChild(text);
                optsBox.appendChild(label);
            });

            panel.removeAttribute('hidden');
        }

        function apply() {
            var d = data[select.value];
            if (!d) { return; }

            var chosen = current.filter(function (o) {
                var box = optsBox.querySelector('[data-uc-prefill-opt="' + o.key + '"]');
                return box && box.checked;
            });

            if (!chosen.length) {
                say('Nothing was ticked, so nothing was filled in.');
                return;
            }

            /*
             * THE OVERWRITE QUESTION, ASKED ONCE AND NAMING THE FIELDS.
             * Not "this will overwrite things": the point of asking is that
             * somebody can tell whether the things are ones they care about.
             */
            var clashes = chosen.filter(function (o) { return o.filled(); });
            if (clashes.length) {
                var names = clashes.map(function (o) { return o.label; }).join(', ');
                var msg = 'You have already filled in: ' + names + '.\n\n'
                    + 'Filling in from the series will replace ' + (clashes.length === 1 ? 'it' : 'them') + '. Continue?';
                if (!window.confirm(msg)) {
                    say('Nothing was changed.');
                    return;
                }
            }

            chosen.forEach(function (o) { o.write(d); });

            say('Filled in ' + chosen.length + ' ' + (chosen.length === 1 ? 'thing' : 'things')
                + ' from the series. Everything is still yours to edit.');
        }

        function clearAll() {
            var boxes = optsBox.querySelectorAll('[data-uc-prefill-opt]');
            Array.prototype.forEach.call(boxes, function (b) { b.checked = false; });
            say('Cleared. Nothing will be filled in.');
        }

        select.addEventListener('change', build);
        if (applyBtn) { applyBtn.addEventListener('click', apply); }
        if (noneBtn) { noneBtn.addEventListener('click', clearAll); }

        // A series may already be chosen, from the "add a date" link on a
        // series screen, in which case the offer should be there on arrival.
        build();
    }

    /* ---------------------------------------------------------------------
     * ASKING BEFORE ANYBODY IS EMAILED (3.42.0)
     *
     * WHAT THIS REPLACED. A checkbox, ticked, sitting among thirty other
     * controls on the event form, and a second one on the cancel card. Between
     * them they decided whether every person registered for an event got mail
     * saying it had moved or was off. The common case was that nobody noticed
     * them, so the mail went by default, and it cannot be recalled.
     *
     * SO THE QUESTION IS ASKED AT THE MOMENT OF SAVING, and only when there is
     * something to ask about: a date, start time, end time or location that
     * actually changed, AND at least one person is registered for it. With
     * neither, this does nothing at all and the save goes straight through. A
     * click in the way of a save that cannot email anybody is a click that
     * teaches people to dismiss dialogs.
     *
     * DETECTION IS DONE ON THE FORMATTED VALUES, which is what the server
     * compares in movable_diff(): '18:00' and '6 pm' are the same fact and
     * nobody should be told about the difference. The server stamps the event's
     * current formatted facts on the block, this reads the controls and formats
     * them the same way, and the two are compared. That is why apDate() and
     * apTimeRange() below exist, and why .claude/ap-format-crosscheck.php holds
     * them to the PHP versions case by case.
     *
     * THE SERVER IS STILL THE AUTHORITY ON WHAT IS SENT. This decides whether
     * to ASK. What actually goes out is decided after the write, by comparing
     * the before-snapshot against the result, and gated on the answer this
     * records. So a dialog shown when nothing really moved sends nothing, and
     * an answer of 'send' on an unchanged event sends nothing.
     *
     * NO ANSWER MEANS NO MAIL. The hidden field ships empty. With scripting
     * off there is no dialog, so nothing is ever sent, which is the safe
     * direction: not sending leaves a manager able to send, and sending cannot
     * be taken back. The screen the save lands on says which happened.
     * ------------------------------------------------------------------ */

    /* uc-ap-format start. .claude/ap-format-crosscheck.php slices between these
     * two markers and runs the functions against the PHP formatters. Keep them. */
    var AP_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                     'July', 'August', 'September', 'October', 'November', 'December'];
    var AP_DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    /* sfaf_ap_date( $d, 'full' ), which is date_i18n( 'l, F j, Y' ).
     * Built from the parts rather than from a Date the browser parsed, because
     * new Date('2026-09-08') is UTC midnight and prints as the 7th anywhere
     * west of Greenwich. That is the same defect the PHP side documents in
     * sfaf_local_timestamp(). */
    function apDate(iso) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').trim());
        if (!m) { return ''; }
        var y = parseInt(m[1], 10), mo = parseInt(m[2], 10), d = parseInt(m[3], 10);
        if (mo < 1 || mo > 12 || d < 1 || d > 31) { return ''; }
        var dow = new Date(Date.UTC(y, mo - 1, d)).getUTCDay();
        return AP_DAYS[dow] + ', ' + AP_MONTHS[mo - 1] + ' ' + d + ', ' + y;
    }

    /* sfaf_ap_time(): ":00" dropped, meridiem lowercase. */
    function apTime(hhmm, meridiem) {
        var m = /^(\d{1,2}):(\d{2})/.exec(String(hhmm || '').trim());
        if (!m) { return ''; }
        var h = parseInt(m[1], 10), min = m[2];
        if (h < 0 || h > 23) { return ''; }
        var suffix = h < 12 ? 'am' : 'pm';
        var h12 = h % 12;
        if (0 === h12) { h12 = 12; }
        var clock = ('00' === min) ? String(h12) : (h12 + ':' + min);
        return (false === meridiem) ? clock : (clock + ' ' + suffix);
    }

    /* sfaf_ap_time_range(): the first meridiem is omitted when both match. */
    function apTimeRange(start, end) {
        start = String(start || '').trim();
        end = String(end || '').trim();
        if (!start) { return ''; }
        if (!end) { return apTime(start); }
        var sm = /^(\d{1,2}):/.exec(start);
        var em = /^(\d{1,2}):/.exec(end);
        if (!sm || !em) { return apTime(start); }
        var sh = parseInt(sm[1], 10);
        var eh = parseInt(em[1], 10);
        var same = ((sh < 12) === (eh < 12));
        return apTime(start, !same) + '–' + apTime(end);
    }

    /* SFAF_Venues::compose(): street, city, then state and ZIP as one bit. */
    function composeAddress(street, city, state, zip) {
        var tail = (String(state || '').trim() + ' ' + String(zip || '').trim()).trim();
        var bits = [];
        [String(street || '').trim(), String(city || '').trim(), tail].forEach(function (bit) {
            if (bit) { bits.push(bit); }
        });
        return bits.join(', ');
    }
    /* uc-ap-format end. */

    /* What sfaf_event_location() would return if this form were saved now.
     *
     * The venue branch reads the chosen option's data-uc-display, which the
     * server rendered with SFAF_Venues::display(), rather than rebuilding the
     * string here: composing the same address twice in two languages is how
     * they come to disagree. */
    function locationNow(form) {
        /* Online answers first, exactly as sfaf_event_location() does, and with
         * the same two words. The dialog that asks "tell everybody registered
         * what moved" compares this against the stored value, so a disagreement
         * here is an email saying the wrong thing. */
        var online = form.querySelector('[data-uc-online-toggle]');
        if (online && online.checked) {
            return 'Online Event';
        }

        var mode = form.querySelector('input[name="location_mode"]:checked');
        if (!mode) {
            var plain = form.querySelector('input[name="location"]');
            return plain ? plain.value.trim() : '';
        }
        if ('venue' === mode.value) {
            var sel = form.querySelector('select[name="venue"]');
            var opt = (sel && sel.selectedIndex >= 0) ? sel.options[sel.selectedIndex] : null;
            if (opt && parseInt(sel.value, 10) > 0) {
                return (opt.getAttribute('data-uc-display') || '').trim();
            }
        }
        function val(name) {
            var el = form.querySelector('[name="location_' + name + '"]');
            return el ? el.value : '';
        }
        var composed = composeAddress(val('street'), val('city'), val('state'), val('zip'));
        if (composed) { return composed; }
        var fallback = form.querySelector('input[name="location"]');
        return fallback ? fallback.value.trim() : '';
    }

    function factsNow(form) {
        function val(name) {
            var el = form.querySelector('[name="' + name + '"]');
            return el ? el.value : '';
        }
        return {
            Date: apDate(val('date')),
            Time: apTimeRange(val('start_time'), val('end_time')),
            Location: locationNow(form)
        };
    }

    /* movable_diff()'s rule: a fact that was empty and still is has not moved,
     * and an empty side is written as "not set" rather than as nothing. */
    function factsDiff(before, after) {
        var out = [];
        ['Date', 'Time', 'Location'].forEach(function (label) {
            var from = String(before[label] || '');
            var to = String(after[label] || '');
            if (from === to) { return; }
            if (!from && !to) { return; }
            out.push({ label: label, from: from || 'not set', to: to || 'not set' });
        });
        return out;
    }

    /*
     * A DIALOG WITH TWO ANSWERS AND A WAY OUT, and no default among them.
     *
     * Cancel is first in the source, so showModal() focuses it: the answer that
     * changes nothing is the one a stray Return key finds. Neither of the two
     * real answers is marked as the default, because both do something and the
     * whole fault being fixed was one of them happening by inaction.
     *
     * Returns via callback: 'send', 'silent', or null for cancel.
     */
    function ucAskNotify(opts, done) {
        var supported = false;
        try {
            supported = typeof document.createElement('dialog').showModal === 'function';
        } catch (err) {
            supported = false;
        }

        /* No <dialog>: ask with confirm() rather than not asking. Two questions
         * in sequence, because confirm() has only two answers and there are
         * three. The way out is offered first. */
        if (!supported) {
            if (!window.confirm(opts.lead + '\n\nOK to continue, Cancel to go back to the form.')) {
                done(null);
                return;
            }
            if (!opts.sendQuestion) {
                done('silent');
                return;
            }
            done(window.confirm(opts.sendQuestion) ? 'send' : 'silent');
            return;
        }

        var dialog = document.createElement('dialog');
        dialog.className = 'uc-confirm-modal uc-notify-modal';

        var form = document.createElement('form');
        form.method = 'dialog';

        var title = document.createElement('h2');
        title.className = 'uc-notify-modal-title';
        title.textContent = opts.title;
        form.appendChild(title);

        var lead = document.createElement('p');
        lead.className = 'uc-confirm-msg';
        lead.textContent = opts.lead;
        form.appendChild(lead);

        if (opts.changes && opts.changes.length) {
            var list = document.createElement('ul');
            list.className = 'uc-notify-changes';
            opts.changes.forEach(function (c) {
                var li = document.createElement('li');
                var name = document.createElement('span');
                name.className = 'uc-notify-change-label';
                name.textContent = c.label;
                var was = document.createElement('span');
                was.className = 'uc-notify-was';
                was.textContent = c.from;
                var arrow = document.createElement('span');
                arrow.className = 'uc-notify-arrow';
                arrow.setAttribute('aria-hidden', 'true');
                arrow.textContent = '→';
                var now = document.createElement('span');
                now.className = 'uc-notify-now';
                now.textContent = c.to;
                li.appendChild(name);
                li.appendChild(was);
                li.appendChild(arrow);
                li.appendChild(now);
                list.appendChild(li);
            });
            form.appendChild(list);
        }

        var actions = document.createElement('div');
        actions.className = 'uc-confirm-actions uc-notify-actions';

        var cancel = document.createElement('button');
        cancel.type = 'submit';
        cancel.value = 'cancel';
        cancel.className = 'uc-btn uc-btn-sm';
        cancel.textContent = opts.cancelLabel;

        /*
         * AN EMPTY sendLabel MEANS THERE IS NO SEND, SO THERE IS ONE ACTION
         * (3.72.0).
         *
         * Cancelling an event nobody has registered for offered two buttons
         * reading "Cancel the event" and "Cancel the event", because the two
         * answers this dialog exists to tell apart are "and email them" and
         * "and do not", and with nobody to email they collapse into the same
         * sentence. Two buttons with one label is not a choice; it is a
         * question the screen could not answer being passed to the reader.
         *
         * So the caller says there is no send by giving no label for one, and
         * what is left is the single thing that happens plus the way out. The
         * one that remains is the SILENT value, which is the truth: nothing is
         * emailed either way, and 'send' would put a notify_choice on the form
         * that sfaf_should_notify() would honour.
         */
        var send = null;
        if (opts.sendLabel) {
            send = document.createElement('button');
            send.type = 'submit';
            send.value = 'send';
            send.className = 'uc-btn uc-btn-sm uc-btn-primary';
            send.textContent = opts.sendLabel;
        }

        var silent = document.createElement('button');
        silent.type = 'submit';
        silent.value = 'silent';
        /* With no send beside it this IS the action, so it carries the weight
         * the send button would have carried. */
        silent.className = 'uc-btn uc-btn-sm' + (send ? '' : ' uc-btn-danger');
        silent.textContent = opts.silentLabel;

        actions.appendChild(cancel);
        actions.appendChild(silent);
        if (send) { actions.appendChild(send); }
        form.appendChild(actions);

        /*
         * THE MESSAGE TO REGISTRANTS IS A SECOND STEP OF THIS DIALOG, AND IT
         * ONLY EXISTS ONCE SOMEBODY HAS SAID THEY ARE EMAILING (3.72.0).
         *
         * The alternative was a box on the form, beside the public "why" line,
         * and it has a failure this does not: somebody writes a paragraph to
         * the people who registered, then presses "Cancel without telling
         * them", and the paragraph is never sent and never shown. Nothing on
         * the screen would have told them that. Here the box cannot be reached
         * except through the answer that sends it, so the state does not exist.
         *
         * ONE DIALOG STILL. The send button stops being a submit and becomes
         * the thing that swaps this panel in; the first panel is hidden rather
         * than destroyed, so Back restores it exactly. A second showModal()
         * over the first is what 3.48.0 already refused for the approval
         * prompt, and for the same reason: two boxes in a row is how somebody
         * learns to press the second without reading it.
         *
         * IT IS NOT THE PUBLIC REASON. That one is on the form, it renders on
         * the event page, and it is written whether anybody is emailed or not.
         * The labels are what carry the difference and they are written to be
         * read before anybody types: see render_cancel_card().
         */
        var stashed = '';
        if (send && opts.sendPrompt) {
            var step = document.createElement('div');
            step.className = 'uc-notify-step';
            step.hidden = true;

            var stepLabel = document.createElement('label');
            stepLabel.className = 'uc-field';
            var stepName = document.createElement('span');
            stepName.className = 'uc-field-label';
            stepName.textContent = opts.sendPrompt.label;
            var box = document.createElement('textarea');
            box.rows = 4;
            box.placeholder = opts.sendPrompt.placeholder || '';
            stepLabel.appendChild(stepName);
            stepLabel.appendChild(box);
            step.appendChild(stepLabel);

            if (opts.sendPrompt.hint) {
                var stepHint = document.createElement('p');
                stepHint.className = 'uc-hint';
                stepHint.textContent = opts.sendPrompt.hint;
                step.appendChild(stepHint);
            }

            var stepActions = document.createElement('div');
            stepActions.className = 'uc-confirm-actions uc-notify-actions';

            var back = document.createElement('button');
            back.type = 'button';
            back.className = 'uc-btn uc-btn-sm';
            back.textContent = 'Go back';

            var confirmSend = document.createElement('button');
            confirmSend.type = 'submit';
            confirmSend.value = 'send';
            confirmSend.className = 'uc-btn uc-btn-sm uc-btn-primary';
            confirmSend.textContent = opts.sendPrompt.confirmLabel || opts.sendLabel;

            stepActions.appendChild(back);
            stepActions.appendChild(confirmSend);
            step.appendChild(stepActions);
            form.appendChild(step);

            /* Not a submit any more: it opens the second step instead of
             * answering. Its value is never read, so nothing downstream
             * changes. */
            send.type = 'button';
            send.addEventListener('click', function () {
                lead.hidden = true;
                actions.hidden = true;
                if (opts.changes && opts.changes.length) {
                    var changeList = form.querySelector('.uc-notify-changes');
                    if (changeList) { changeList.hidden = true; }
                }
                step.hidden = false;
                box.focus();
            });

            back.addEventListener('click', function () {
                step.hidden = true;
                lead.hidden = false;
                actions.hidden = false;
                if (opts.changes && opts.changes.length) {
                    var backList = form.querySelector('.uc-notify-changes');
                    if (backList) { backList.hidden = false; }
                }
                send.focus();
            });

            /* Read before the dialog closes, because the element goes with it. */
            confirmSend.addEventListener('click', function () {
                stashed = box.value;
            });
        }

        dialog.appendChild(form);
        document.body.appendChild(dialog);

        dialog.addEventListener('close', function () {
            document.body.classList.remove('uc-modal-open');
            var answer = dialog.returnValue;
            dialog.remove();
            done(('send' === answer || 'silent' === answer) ? answer : null, stashed);
        });

        ucDismissOnBackdrop(dialog);
        document.body.classList.add('uc-modal-open');
        dialog.showModal();
    }

    /*
     * RESUBMIT WITHOUT LOSING WHICH BUTTON WAS PRESSED.
     *
     * The save buttons are name="save_mode" with three different values, and
     * form.submit() posts none of them: a bare submit() drops the submitter,
     * which would send save_mode absent and take the status decision away from
     * the button somebody actually pressed. requestSubmit(submitter) keeps it.
     * Where that is missing the name and value are carried by a hidden input
     * instead, which posts identically.
     */
    function resubmit(form, submitter) {
        if (typeof form.requestSubmit === 'function') {
            try {
                form.requestSubmit(submitter || undefined);
                return;
            } catch (err) {
                /* Fall through to the hidden-input route. */
            }
        }
        if (submitter && submitter.name) {
            var carry = document.createElement('input');
            carry.type = 'hidden';
            carry.name = submitter.name;
            carry.value = submitter.value;
            form.appendChild(carry);
        }
        form.submit();
    }

    function initChangeNotice() {
        var block = document.querySelector('[data-uc-change-notice]');
        if (!block) { return; }
        var form = block.closest('form');
        var field = block.querySelector('[data-uc-notify-choice]');
        if (!form || !field) { return; }

        var people = parseInt(block.getAttribute('data-uc-notify-people'), 10) || 0;
        var events = parseInt(block.getAttribute('data-uc-notify-events'), 10) || 0;
        if (people < 1) { return; }

        /* The event as stored, formatted by the server. Comparing against these
         * rather than against the controls' initial values means the dialog
         * asks about exactly what movable_diff() would call a move. */
        var before = {
            Date: block.getAttribute('data-uc-fact-date') || '',
            Time: block.getAttribute('data-uc-fact-time') || '',
            Location: block.getAttribute('data-uc-fact-location') || ''
        };

        var answered = false;

        form.addEventListener('submit', function (e) {
            if (answered) {
                answered = false;
                return;
            }
            var changes = factsDiff(before, factsNow(form));
            if (!changes.length) {
                /* Nothing anybody registered would care about moved, so there is
                 * nothing to ask and the empty field means nothing is sent. */
                return;
            }

            e.preventDefault();
            var submitter = e.submitter || null;

            var lead = people + (1 === people ? ' person is' : ' people are') + ' registered';
            lead += (events > 1) ? (' across ' + events + ' of the dates this save can touch. ') : ' for this event. ';
            lead += 'Emailing them cannot be undone.';

            ucAskNotify({
                title: 'Should they be told?',
                lead: lead,
                changes: changes,
                sendQuestion: 'Email the ' + people + (1 === people ? ' person' : ' people') + ' registered?',
                sendLabel: 'Save and email ' + (1 === people ? 'them' : 'them all'),
                silentLabel: 'Save without telling them',
                cancelLabel: 'Back to the form'
            }, function (answer) {
                if (null === answer) {
                    /* Nothing saved and nothing sent. Everything typed is still
                     * on the form, because it was never submitted. */
                    return;
                }
                field.value = answer;
                answered = true;
                resubmit(form, submitter);
            });
        });
    }

    /*
     * CANCELLING ASKS ONCE, AND THE EMAIL QUESTION RIDES THAT ASK.
     *
     * Cancelling is already deliberate, so it does not get a dialog of its own
     * plus a second one about mail. The one confirmation states how many people
     * would be told and offers both answers. With nobody registered there is
     * nothing to ask about, so it stays a plain confirmation.
     */
    function initCancelConsent() {
        document.querySelectorAll('form[data-uc-confirm-cancel]').forEach(function (form) {
            /* THE SAME DIALOG SERVES PUTTING IT BACK ON (3.73.0). Both are
             * one manager action that may email everybody registered, and
             * a second confirmation with its own wording would be a second
             * place for the consent rule to be got wrong. Only the words
             * differ, and they are chosen here rather than by the caller. */
            var back = form.hasAttribute('data-uc-confirm-reinstate');
            var field = form.querySelector('[data-uc-notify-choice]');
            var counter = form.querySelector('[data-uc-cancel-count]');
            /* The registrants-only message the dialog's second step collects.
             * Starts empty and is only ever filled on a 'send' answer, so the
             * server never has to decide whether a stored message was meant to
             * go out. See render_cancel_card() and the handler. */
            var note = form.querySelector('[data-uc-cancel-message]');
            var people = counter ? (parseInt(counter.getAttribute('data-uc-cancel-count'), 10) || 0) : 0;
            var answered = false;

            form.addEventListener('submit', function (e) {
                if (answered) {
                    answered = false;
                    return;
                }
                e.preventDefault();
                var submitter = e.submitter || null;

                if (people < 1 || !field) {
                    if (back) {
                        /* Nobody was told it was off, so there is nobody to
                         * tell it is back, and nothing to confirm. */
                        answered = true;
                        resubmit(form, submitter);
                        return;
                    }
                    ucAskNotify({
                        title: 'Cancel this event?',
                        lead: 'It keeps its registrations and takes no new ones. Nobody is registered, so there is nobody to tell.',
                        changes: [],
                        sendQuestion: '',
                        /* No send: there is nobody to email, so there is one
                         * action. See the note in ucAskNotify(). */
                        sendLabel: '',
                        silentLabel: 'Cancel the event',
                        cancelLabel: 'Go back'
                    }, function (answer) {
                        if (null === answer) { return; }
                        answered = true;
                        resubmit(form, submitter);
                    });
                    return;
                }

                ucAskNotify({
                    title: back ? 'Put this event back on?' : 'Cancel this event?',
                    lead: back
                        ? (people + (1 === people ? ' person was' : ' people were')
                            + ' told this was cancelled. Their registrations were kept and still hold. '
                            + 'Emailing them cannot be undone.')
                        : (people + (1 === people ? ' person is' : ' people are') + ' registered. '
                            + 'The event keeps its registrations and takes no new ones. '
                            + 'Emailing them cannot be undone.'),
                    changes: [],
                    sendQuestion: back
                        ? ('Tell the ' + people + (1 === people ? ' person' : ' people') + ' it is back on?')
                        : ('Email the ' + people + (1 === people ? ' person' : ' people') + ' registered?'),
                    sendLabel: back
                        ? ('Put it back on and tell ' + (1 === people ? 'them' : 'them all'))
                        : ('Cancel and email ' + (1 === people ? 'them' : 'them all')),
                    silentLabel: back ? 'Put it back on without telling them' : 'Cancel without telling them',
                    /* "Leave it alone" beside two buttons that both cancel the
                     * event read as a third thing to do to it. This button
                     * closes the dialog and writes nothing: see the callback,
                     * which returns on a null answer before touching the
                     * hidden field or resubmitting. "Go back" is what it does. */
                    cancelLabel: 'Go back',
                    /* NO SECOND STEP ON A REINSTATE. The cancellation message
                     * exists because an organizer calling something off often
                     * has something to say about why; "it is back on" is the
                     * whole message, and a box nobody fills in is a step. */
                    sendPrompt: back ? null : {
                        label: 'Anything to add, just for the people registered (optional)',
                        hint: 'This goes in their email and nowhere else. It is not on the event page.',
                        placeholder: 'We are looking at a new date and will write again.',
                        confirmLabel: 'Cancel and email ' + (1 === people ? 'them' : 'them all')
                    }
                }, function (answer, message) {
                    if (null === answer) { return; }
                    field.value = answer;
                    if (note) { note.value = ('send' === answer) ? (message || '') : ''; }
                    answered = true;
                    resubmit(form, submitter);
                });
            });
        });
    }

    function initNotifyConsent() {
        initChangeNotice();
        initCancelConsent();
    }

    /* ---------------------------------------------------------------------
     * RICH TEXT ON ROWS THAT DID NOT EXIST WHEN THE PAGE WAS BUILT (3.44.0)
     *
     * wp_editor() renders the editors it is asked for while the page is being
     * assembled. A FAQ row cloned from a <template> afterwards has nothing
     * rendered for it, so its editor has to be started here, with
     * wp.editor.initialize().
     *
     * THE SETTINGS ARE NOT WRITTEN HERE. They come from the JSON block that
     * SFAF_Rich_Text::settings_json() prints, which is the same array
     * wp_editor() was given. A second copy of the toolbar in this file is
     * exactly the drift 3.43.1 was about, one screen quietly allowing
     * something another does not.
     *
     * IT DEGRADES TO THE TEXTAREA IT ALREADY IS. Every one of these is a real
     * <textarea> with a real name, so if wp.editor is missing the row still
     * works, still posts and still saves. Nothing here builds a control.
     * ------------------------------------------------------------------ */
    function richTextSettings() {
        var el = document.getElementById('uc-rich-settings');
        if (!el) { return null; }
        try {
            return JSON.parse(el.textContent || el.innerHTML);
        } catch (err) {
            return null;
        }
    }

    function initRichText() {
        var settings = richTextSettings();
        if (!settings || !window.wp || !wp.editor || typeof wp.editor.initialize !== 'function') {
            return;
        }

        var seq = 0;
        function start(area) {
            if (!area || area.getAttribute('data-uc-rich-on')) { return; }
            /* wp_editor() ids may hold lowercase letters, numbers and dashes
             * only, and a field name here is `faqs[3][answer]`. */
            if (!area.id) {
                seq++;
                area.id = 'uc-rich-' + seq + '-' + Math.max(1, seq);
            }
            area.setAttribute('data-uc-rich-on', '1');
            try {
                wp.editor.initialize(area.id, settings);
            } catch (err) {
                area.removeAttribute('data-uc-rich-on');
                /*
                 * AND SAY SO (3.72.0). This catch was silent, and that is why
                 * the fault under it could not be named from a browser: the
                 * answers showed raw markup as text, nothing appeared in the
                 * console, and the only observable was that pressing Add FAQ
                 * afterwards turned every box on the screen into an editor
                 * including the ones that were already there.
                 *
                 * THE SAME CHANNEL run() USES, which is the point rather than a
                 * detail. run() exists precisely so a failed initialiser is
                 * named instead of swallowed, and this was the one place in the
                 * file quietly doing the opposite inside it. The id is in the
                 * message because there are several of these on a page and
                 * "one of them failed" is not a report.
                 */
                if (window.console && window.console.error) {
                    window.console.error(
                        'SFAF caladmin: rich text failed to start on #' + area.id + '. '
                        + 'The field still works as a plain textarea.',
                        err
                    );
                }
            }
        }

        function startAll() {
            document.querySelectorAll('textarea[data-uc-rich]').forEach(function (area) {
                /* Not the ones still inside a <template>: they are the pattern
                 * for future rows, not rows. */
                if (area.closest('template')) { return; }
                start(area);
            });
        }

        /*
         * THE LOAD PASS GOES THROUGH THE SAME DEFERRED TASK THE ADD PASS USES
         * (3.72.0).
