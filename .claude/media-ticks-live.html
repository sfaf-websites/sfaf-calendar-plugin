<script>
/**
 * SFAF Calendar — /caladmin portal (standalone, vanilla JS).
 *
 * THIS FILE IS FOUR TOP-LEVEL IIFEs, NOT ONE, and anything shared between them
 * has to live out here. That is not a style note: 3.72.0 added
 * ucDismissOnBackdrop() inside the first one and called it from the third and
 * the fourth, which are its SIBLINGS and cannot see into it. Both calls threw
 * ReferenceError, and because each throws after preventDefault() and after the
 * panel has been moved into a not-yet-shown <dialog>, the visible result was a
 * control that did nothing at all: "Get a form link" on the dashboard, and
 * Approve and Reject on the pending queue.
 *
 * NEITHER BUILD GATE COULD SEE IT. `node --check` proves the file parses and a
 * ReferenceError is a runtime fact. `.claude/js-scope-test.js` is the check that
 * closes it: it reads every top-level scope, and every call to a name this file
 * itself declares must be made from a scope that can see the declaration.
 */

/* CLICKING THE DIM CLOSES IT, AND THAT IS THE ONE THING <dialog> DOES NOT GIVE
 * US (3.72.0).
 *
 * Every overlay in this file is already a real <dialog> opened with
 * showModal(), so Escape, the focus trap and the inert page all come from the
 * browser. Light dismiss does not: a modal <dialog> ignores a click on its own
 * ::backdrop, which is why the cancel confirmation read as a box with no way
 * out even though Escape has always closed it.
 *
 * THE TEST IS `e.target === dialog`, and it works because the backdrop is the
 * dialog's own pseudo-element: a click that lands on the dim reports the dialog
 * itself as the target, while a click on anything inside reports that child.
 * Every dialog here has `padding: 0` and one child filling it, so there is no
 * strip of dialog to mis-hit. This is the same test the public RSVP and follow
 * dialogs have used since 3.70.1, moved here rather than written a second time.
 *
 * close() WITH NO ARGUMENT leaves returnValue as it was, which is empty on a
 * dialog nobody has answered, so every caller reads a dismissal exactly as it
 * reads Escape. Nothing is sent and nothing is submitted.
 *
 * IT LIVES AT FILE SCOPE BECAUSE FOUR IIFEs CALL IT. See the header above for
 * what happened when it did not.
 */
function ucDismissOnBackdrop(dialog) {
    dialog.addEventListener('click', function (e) {
        if (e.target === dialog) { dialog.close(); }
    });
}

(function () {
    'use strict';

    /**
     * Run one initialiser without letting it take the others down.
     *
     * WHY THIS EXISTS. These ran as a bare list, so a single exception in any
     * one of them silently killed every one below it: no error visible on the
     * page, no clue which screen was affected, and the features nearest the
     * bottom of the list the most likely to be missing. That is a whole class
     * of bug that reports as "X is not working" and points nowhere.
     *
     * A failure is now contained to its own feature and named in the console.
     * Never swallowed silently: a caught exception nobody can see is the same
     * bug wearing a different hat.
     */
    function run(name, fn) {
        try {
            fn();
        } catch (err) {
            if (window.console && window.console.error) {
                window.console.error('SFAF caladmin: ' + name + ' failed and was skipped.', err);
            }
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        run('sidebar', initSidebar);
        run('repeaters', initRepeaters);
        run('faqSetPicker', initFaqSetPicker);
        run('seriesPrefill', initSeriesPrefill);
        run('notifyPicker', initNotifyPicker);
        run('imagePicker', initImagePicker);
        // ORDER MATTERS between these three. Both the scope confirmation and
        // the completeness confirmation bind a click listener to the same save
        // buttons, and listeners on one element fire in the order they were
        // registered. The scope one has to go first: a manager who decides not
        // to update twelve events should never then be asked about a missing
        // image on an event they have just decided not to save.
        run('helpToggles', initHelpToggles);
        run('categoryChips', initCategoryChips);
        run('recurrence', initRecurrence);
        run('emailPills', initEmailPills);
        run('locationPicker', initLocationPicker);
        run('liveSearch', initLiveSearch);
        run('editScope', initEditScope);
        run('confirmButtons', initConfirmButtons);
        // AFTER confirmButtons and BEFORE completeness, for the same reason the
        // three above are ordered: these all bind to the same save buttons and
        // fire in registration order. Whether to email people who have already
        // signed up outranks a reminder that the image is missing.
        run('notifyConsent', initNotifyConsent);
        // After repeaters, so the rows that exist on load are in the document
        // before their editors are started.
        run('richText', initRichText);
        run('completeness', initCompleteness);
        run('asyncActions', initAsyncActions);
        run('disclosures', initDisclosures);
        run('filterLists', initFilterLists);
        // After filterLists, which is what actually narrows this one's list.
        // This adds only what a <details> and a radio cannot do on their own.
        run('imageChoice', initImageChoice);
        // After imageChoice, which is what makes the picker live and is where
        // the trigger renderer this one reuses is bound.
        run('requestSeriesImage', initRequestSeriesImage);
        // After requestSeriesImage, which sets the default row's picture and
        // name from the chosen series. This narrows the list under it, and it
        // may reset the choice back to that row, so the row has to be right
        // before this runs.
        run('seriesImageFilter', initSeriesImageFilter);
        run('fixedSeriesImageFilter', initFixedSeriesImageFilter);
        // Last of the three: it reads whatever the other two settled on.
        run('formBanner', initFormBanner);
        run('uploadPreview', initUploadPreview);
        run('mediaUploadPreview', initMediaUploadPreview);
        run('faqSetPeek', initFaqSetPeek);
        run('requestPrefill', initRequestPrefill);
        run('calendarTick', initCalendarTick);
        run('tickPickers', initTickPickers);
    });

    /* ---------------------------------------------------------------------
     * WHICH DRAFTS THE PUBLISH BUTTON IS ABOUT TO PUBLISH (3.72.0)
     *
     * ENHANCEMENT ONLY, AND THE SERVER ALREADY RENDERED A COMPLETE CONTROL.
     * Every eligible draft has a real checkbox with a real name, ticked, so
     * with this function deleted the list still posts, unticking still works
     * and the button still publishes what is ticked. What is added here is
     * select-all, and keeping the button's own number honest while somebody
     * changes their mind.
     *
     * THE NUMBER IS THE POINT. A button reading "Publish 47 upcoming drafts"
     * over a list where three are unticked is a button that lies about what it
     * is going to do, and this is the one action on the screen that reaches the
     * public calendar. The confirmation is rewritten with it for the same
     * reason: the two must not disagree.
     *
     * INELIGIBLE ROWS CARRY NO CHECKBOX AT ALL, so there is nothing here that
     * has to remember not to tick them. See render_schedule_publish_form().
     * ------------------------------------------------------------------ */
    function initTickPickers() {
        document.querySelectorAll('[data-uc-tick-picker]').forEach(function (form) {
            /* RUN TWICE, BIND ONCE (3.74.0). The events list swaps its results
             * region in place when somebody searches, so this runs again to
             * pick up the new rows; the picker form itself is outside that
             * region and survives, and binding a second set of listeners to it
             * would double every count. */
            if (form.getAttribute('data-uc-tick-on')) { return; }
            form.setAttribute('data-uc-tick-on', '1');

            /* form.elements, NOT querySelectorAll, and that is the whole reason
             * this works on both screens. The events list keeps its ticks in
             * table rows that already contain their own <form> elements, and
             * forms cannot nest, so those boxes are associated by the `form=`
             * attribute instead. They are not descendants of the form and a
             * selector would never see them. form.elements does, because that
             * is what the association is for. */
            var boxes = Array.prototype.filter.call(form.elements, function (el) {
                return el.hasAttribute && el.hasAttribute('data-uc-tick-one');
            });
            if (!boxes.length) { return; }

            var all = form.querySelector('[data-uc-tick-all]')
                || document.querySelector('[data-uc-tick-all][form="' + form.id + '"]');
            var allRow = all ? (all.closest('[data-uc-tick-all-row]') || all.parentNode) : null;

            /* ONE SET OF TICKS, AS MANY BUTTONS AS THE SCREEN HAS (3.79.0).
             *
             * The events list carries two: add a category, and publish. A
             * checkbox associates with exactly ONE form, so a second action
             * cannot bring a second form without bringing a second column of
             * boxes, and that is the worst answer available. It doubles the
             * width of the column somebody's eye runs down and it makes
             * "select all" ambiguous.
             *
             * THE TWO BUTTONS DO NOT REACH THE SAME ROWS, WHICH IS WHY EACH
             * KEEPS ITS OWN COUNT. Every ticked row can be filed under a
             * category. Only some can go on the public calendar: a past date,
             * an import, a submission and an event with no date are each
             * refused by rules that live on the server and are marked on the
             * box as data-uc-tick-block. A button carrying a number that
             * includes rows it is about to skip is the exact failure this is
             * built to prevent, and it is the one button on the screen where
             * being wrong is public.
             *
             * SO THE SERVER DECIDES ELIGIBILITY AND THIS ONLY COUNTS IT. The
             * attribute is a label on a decision already made; nothing here
             * works out whether a row may be published, and a box with the
             * attribute stripped by hand is still refused at the write. */
            var btns = Array.prototype.slice.call(form.querySelectorAll('[data-uc-tick-submit]'));

            var total = boxes.length;

            /* Per button: where it writes its number, which subset it counts,
             * and the words and sentence it does it with. Read once, because
             * these are attributes on markup this function does not change. */
            var readouts = btns.map(function (btn) {
                return {
                    btn: btn,
                    /* INSIDE THE BUTTON, NOT ANYWHERE IN THE FORM, and that is
                     * the whole reason two buttons can keep two different
                     * numbers. A form-wide lookup would hand both of them the
                     * first span it found, so the publish button would count
                     * the category button's ticks. All three screens put the
                     * number in the label, which is where it belongs anyway:
                     * nobody should have to look elsewhere to see what a
                     * button is about to do. */
                    countEl: btn.querySelector('[data-uc-tick-count]'),
                    nounEl: btn.querySelector('[data-uc-tick-noun]'),
                    /* The plural and the singular, off the server, so the words
                     * are WordPress's answer rather than an "s" glued on here. */
                    many: btn.getAttribute('data-uc-tick-word') || '',
                    one: btn.getAttribute('data-uc-tick-word-one') || '',
                    /* THE CONFIRMATION IS A TEMPLATE, NOT THE SENTENCE ITSELF.
                     * data-uc-confirm holds a real sentence for the no-script
                     * path and is what ucConfirm() reads; this is the same
                     * sentence with {n} and {noun} left in it, so the count can
                     * be swapped without this file knowing how either screen
                     * phrases its question. Rewriting by regex over the live
                     * attribute was tried and is wrong: a category name can
                     * hold a digit. */
                    tpl: btn.getAttribute('data-uc-tick-confirm') || '',
                    /* Counts only the ticks with no block on them. */
                    eligibleOnly: btn.hasAttribute('data-uc-tick-eligible')
                };
            });

            function ticked(eligibleOnly) {
                var n = 0;
                boxes.forEach(function (b) {
                    if (!b.checked) { return; }
                    if (eligibleOnly && b.hasAttribute('data-uc-tick-block')) { return; }
                    n++;
                });
                return n;
            }

            function sync() {
                var n = ticked(false);

                if (all) {
                    all.checked = (n === total);
                    /* Some but not all: the box says so rather than showing a
                     * state that is wrong in both directions. */
                    all.indeterminate = (n > 0 && n < total);
                }

                readouts.forEach(function (r) {
                    var mine = r.eligibleOnly ? ticked(true) : n;
                    var noun = (1 === mine) ? r.one : r.many;

                    if (r.countEl) { r.countEl.textContent = String(mine); }
                    if (r.nounEl) { r.nounEl.textContent = noun; }

                    /* Nothing ticked is not an error and does not need a
                     * message. It is a button with nothing to do, so it says
                     * so and cannot be pressed. A publish button over forty
                     * ticked past dates is that same button: it counts zero,
                     * so it disables, and the rows keep their ticks for the
                     * action that CAN reach them. */
                    r.btn.disabled = (0 === mine);
                    if (r.tpl) {
                        r.btn.setAttribute(
                            'data-uc-confirm',
                            r.tpl.split('{n}').join(String(mine)).split('{noun}').join(noun)
                        );
                    }
                });
            }

            boxes.forEach(function (b) { b.addEventListener('change', sync); });

            if (all && allRow) {
                allRow.hidden = false;
                all.addEventListener('change', function () {
                    var on = all.checked;
                    boxes.forEach(function (b) { b.checked = on; });
                    sync();
                });
            }

            sync();
        });
    }

    /* ---------------------------------------------------------------------
     * "Add to calendar" follows "Accept RSVPs", live.
     *
     * Both controls are on the event editor at once, in two different cards,
     * and the answer to one decides whether the other means anything: an event
     * taking registrations has no Add to Calendar button on its page, because
     * the calendar file goes out with the confirmation instead. The server
     * renders the greyed state on load; this is the same state while somebody
     * is still deciding, so ticking Accept RSVPs does not leave a live-looking
     * control that a save will ignore.
     *
     * IT IS NOT WHAT MAKES IT TRUE, and that is the whole reason it is safe to
     * do in the browser. save_event_from_post() asks the same question of the
     * stored value and skips the field either way, so with scripting off, or
     * with the attribute removed by hand, nothing about what gets saved
     * changes. This only keeps the screen honest.
     * ------------------------------------------------------------------ */
    function initCalendarTick() {
        var label = document.querySelector('[data-uc-calendar-check]');
        var note = document.querySelector('[data-uc-calendar-note]');
        var rsvp = document.querySelector('input[name="rsvp_enabled"]');
        var show = document.querySelector('input[name="show_rsvp"]');
        if (!label || !note || !rsvp) { return; }

        var box = label.querySelector('input');
        if (!box) { return; }

        function sync() {
            // Both halves, exactly as sfaf_event_takes_rsvps() asks them:
            // registration is on AND the RSVP control is being shown. The
            // second is a tick in this very card, so it can change too.
            var on = rsvp.checked && (!show || show.checked);
            box.disabled = on;
            label.classList.toggle('uc-check-locked', on);
            note.hidden = !on;
        }

        rsvp.addEventListener('change', sync);
        if (show) { show.addEventListener('change', sync); }
        sync();

        /* AND THE RSVP TICK FOLLOWS Accept RSVPs (3.73.0), which is the
         * same arrangement one field along: an event accepting nothing has
         * no button to show, so the tick says so rather than looking
         * settable. Bound here rather than in a second initialiser because
         * it is the same two controls and the same event.
         *
         * IT IS NOT WHAT MAKES IT TRUE. save_event_from_post() skips
         * show_rsvp on its own reading of the stored value, so with
         * scripting off, or the attribute removed by hand, nothing about
         * what gets saved changes. */
        var showLabel = document.querySelector('[data-uc-rsvp-show-check]');
        var showNote = document.querySelector('[data-uc-rsvp-show-note]');
        if (showLabel && show) {
            var syncShow = function () {
                var off = !rsvp.checked;
                show.disabled = off;
                showLabel.classList.toggle('uc-check-locked', off);
                if (showNote) { showNote.hidden = !off; }
            };
            rsvp.addEventListener('change', syncShow);
            syncShow();
        }
    }

    /* ---------------------------------------------------------------------
     * THE PICTURE PICKER ON THE STAFF REQUEST FORM (3.65.0).
     *
     * WHAT THIS DOES NOT DO, WHICH IS THE POINT. It does not build the control.
     * The control is a <details> full of radio buttons, rendered by
     * SFAF_Request, and the browser opens it, closes it, and posts the chosen
     * radio with no script at all. This page is reached by a link and used by
     * people with no WordPress account, so a picker that exists only once
     * JavaScript has run is not something this form can carry.
     *
     * IT ADDS TWO THINGS. It reveals the search box, which cannot honestly be
     * shown before something can act on it, and it closes the panel when a
     * picture is chosen, which is what makes it feel like a picker rather than
     * a long list. The narrowing itself is initFilterLists(), the same one the
     * teams screen uses; nothing about searching is written twice.
     *
     * THE TRIGGER IS UPDATED FROM THE ROW THAT WAS CHOSEN, not from a second
     * copy of the list. Each radio carries its own thumbnail and name, so the
     * closed control and the open one cannot describe the same picture
     * differently.
     * ------------------------------------------------------------------ */
    /**
     * What the closed trigger says: the chosen row's picture and its name.
     *
     * HOISTED OUT OF initImageChoice() (3.68.0) so the series control can
     * refresh the same trigger without a second copy of this. Two functions
     * writing that element would be two answers to "what is chosen", free to
     * disagree the first time either changed.
     *
     * Rebuilt as nodes rather than markup: these names come out of the media
     * library and are never put through innerHTML.
     */
    function showImageChoice(current, radio) {
        if (!current || !radio) { return; }
        var thumb = radio.getAttribute('data-uc-image-thumb');
        var name = radio.getAttribute('data-uc-image-name') || '';

        current.textContent = '';
        if (thumb) {
            var img = document.createElement('img');
            img.className = 'uc-image-current-thumb';
            img.alt = '';
            img.src = thumb;
            current.appendChild(img);
        }
        var label = document.createElement('span');
        label.className = 'uc-image-current-name';
        label.textContent = name;
        current.appendChild(label);
    }

    function initImageChoice() {
        document.querySelectorAll('[data-uc-image-picker]').forEach(function (picker) {
            var current = picker.querySelector('[data-uc-image-current]');
            var summary = picker.querySelector('summary');
            var search = picker.querySelector('input[data-uc-filter]');
            var options = picker.querySelectorAll('[data-uc-image-option]');
            if (!current || !options.length) { return; }

            // Only now is the search box a thing that does something.
            picker.classList.add('uc-image-picker-live');

            function show(radio) { showImageChoice(current, radio); }

            Array.prototype.forEach.call(options, function (radio) {
                radio.addEventListener('change', function () {
                    if (!radio.checked) { return; }
                    show(radio);
                    picker.open = false;
                    // Closing the panel under somebody's cursor leaves a
                    // keyboard user nowhere, so the trigger takes the focus
                    // back. It is also what they would press next.
                    if (summary) { summary.focus(); }
                });
            });

            if (search) {
                picker.addEventListener('toggle', function () {
                    // Opening it is the moment somebody is looking for a
                    // picture, which is the moment the search box is worth
                    // having under the cursor.
                    if (picker.open) { search.focus(); }
                });
            }
        });
    }

    /* ---------------------------------------------------------------------
     * THE BANNER IS A LIVE PREVIEW OF THE EVENT (3.80.0)
     *
     * WHAT IT SHOWS, IN ORDER: the picture chosen in the picker, or failing
     * that the chosen series' own picture, or nothing at all. Nothing means the
     * element is REMOVED rather than emptied, because a grey band saying
     * nothing is worse than a form that starts at its heading.
     *
     * AN UPLOAD DOES NOT CHANGE IT, AND THAT IS NOT A LIMITATION. A file
     * somebody attaches here is a WORKING COPY: it lands outside the calendar
     * folder and an approver decides whether it becomes the event's picture.
     * Putting it in the banner would say it already is, which is the one thing
     * this form must not say. So the banner stays on the series picture and the
     * upload gets a thumbnail of its own with a line saying what happens next.
     * Somebody who attaches a file and sees nothing at all change will believe
     * it failed, which is the reason the thumbnail exists.
     *
     * THE ZOOM IS 260ms AND IT IS SHORT ON PURPOSE. Somebody comparing three
     * programmes will change that select three times; a slow reveal is a
     * pleasure the first time and an obstruction the third. It is also skipped
     * entirely under prefers-reduced-motion, in CSS, so this file never asks.
     * ------------------------------------------------------------------ */
    function initFormBanner() {
        var card = document.querySelector('.uc-request-card');
        var picker = document.querySelector('[data-uc-image-picker]');
        if (!card) { return; }

        var select = document.querySelector('[data-uc-request-series]');
        if (!picker && !select) { return; }

        function seriesBanner() {
            if (!select) {
                /* The community form: its series cannot change, so whatever the
                 * server put in the banner is that series' picture and stays
                 * the fallback for the whole visit. */
                var had = card.querySelector('[data-uc-form-banner-img]');
                return had ? (had.getAttribute('data-uc-series-src') || '') : '';
            }
            var opt = select.options[select.selectedIndex];
            return opt ? (opt.getAttribute('data-uc-series-banner') || '') : '';
        }

        function chosenBanner() {
            if (!picker) { return ''; }
            var on = picker.querySelector('[data-uc-image-option]:checked');
            if (!on) { return ''; }
            /* The default row posts 0 and carries no full-size picture of its
             * own: it MEANS the series picture, so that is what it shows. */
            return on.getAttribute('data-uc-image-full') || '';
        }

        function apply() {
            var src = chosenBanner() || seriesBanner();
            var band = card.querySelector('[data-uc-form-banner]');

            if (!src) {
                if (band) { band.parentNode.removeChild(band); }
                return;
            }

            if (!band) {
                band = document.createElement('div');
                band.className = 'uc-submit-banner';
                band.setAttribute('data-uc-form-banner', '');
                var fresh = document.createElement('img');
                fresh.alt = '';
                fresh.setAttribute('data-uc-form-banner-img', '');
                band.appendChild(fresh);
                card.insertBefore(band, card.firstChild);
            }

            var img = band.querySelector('[data-uc-form-banner-img]');
            if (!img || img.getAttribute('src') === src) { return; }

            /* Restarting the animation needs the class off, a reflow read, and
             * the class back on. Without the read the browser coalesces the two
             * writes and nothing plays from the second change onwards, which is
             * exactly the case somebody comparing series is in. */
            band.classList.remove('is-in');
            void band.offsetWidth;
            img.src = src;
            band.classList.add('is-in');
        }

        if (select) { select.addEventListener('change', apply); }
        if (picker) {
            picker.addEventListener('change', function (e) {
                if (e.target && e.target.hasAttribute('data-uc-image-option')) { apply(); }
            });
        }

        /* Remember what the server said the series picture was, so the community
         * form has a fallback to go back to when somebody unpicks a choice. */
        var first = card.querySelector('[data-uc-form-banner-img]');
        if (first && !select) {
            first.setAttribute('data-uc-series-src', first.getAttribute('src') || '');
        }

        apply();
    }

    /* ---------------------------------------------------------------------
     * WHAT WAS ATTACHED, AND WHAT HAPPENS TO IT (3.80.0)
     *
     * A thumbnail of the file somebody just chose, with one line under it. The
     * thumbnail is there to say IT ARRIVED; the line is there to stop the
     * thumbnail saying "this is now your event picture", which it is not.
     *
     * FileReader, NOT AN UPLOAD. Nothing leaves the browser until the form is
     * submitted. This reads the file the input already holds.
     * ------------------------------------------------------------------ */
    /**
     * The Images screen's Add an image panel: show what was chosen (3.87.0).
     *
     * THE MARKUP IS ALREADY THERE, which is the difference between this and
     * initUploadPreview() below. That one builds its box in script, so with no
     * script the public form has no preview and no gap where one was. Here the
     * well is server-rendered at a fixed 16:9 so the layout is the same before
     * a file is chosen, after one is chosen, and with no script at all. This
     * only fills it in.
     *
     * NOTHING IS UPLOADED BY LOOKING. FileReader reads the file the browser
     * already has; the upload still happens on submit, through the same handler
     * and the same folder rule.
     */
    function initMediaUploadPreview() {
        var input = document.querySelector('[data-uc-upload-input]');
        if (!input || !window.FileReader) { return; }

        var img   = document.querySelector('[data-uc-upload-preview]');
        var empty = document.querySelector('[data-uc-upload-empty]');
        if (!img || !empty) { return; }

        input.addEventListener('change', function () {
            var file = input.files && input.files[0];
            if (!file || file.type.indexOf('image/') !== 0) {
                img.hidden = true;
                img.removeAttribute('src');
                empty.hidden = false;
                return;
            }
            var reader = new FileReader();
            reader.onload = function (e) {
                img.src = e.target.result;
                img.hidden = false;
                empty.hidden = true;
            };
            reader.readAsDataURL(file);
        });
    }

    function initUploadPreview() {
        var input = document.querySelector('.uc-request-upload input[type="file"]');
        if (!input || !window.FileReader) { return; }

        var box = document.createElement('div');
        box.className = 'uc-upload-preview';
        box.hidden = true;
        var img = document.createElement('img');
        img.alt = '';
        var said = document.createElement('p');
        said.className = 'uc-hint';
        said.textContent = 'Sent for review. Somebody will decide whether this becomes the event picture.';
        box.appendChild(img);
        box.appendChild(said);
        input.parentNode.insertBefore(box, input.nextSibling);

        input.addEventListener('change', function () {
            var file = input.files && input.files[0];
            if (!file || file.type.indexOf('image/') !== 0) {
                box.hidden = true;
                img.removeAttribute('src');
                return;
            }
            var reader = new FileReader();
            reader.onload = function () {
                img.src = reader.result;
                box.hidden = false;
            };
            reader.readAsDataURL(file);
        });
    }

    /* ---------------------------------------------------------------------
     * THE PICKER SHOWS ONE SERIES' PICTURES AND HIDES THE REST (3.80.0)
     *
     * ONLY ON A FORM WHOSE SERIES CAN CHANGE. Where the series is fixed by the
     * URL the server has already written out that series' pictures and nothing
     * else, so this finds no select and returns: the filtering is done, and
     * done somewhere a script cannot undo it.
     *
     * IT MARKS, IT DOES NOT HIDE. Every row it wants gone gets
     * data-uc-off-series and then initFilterLists() is asked to run, which is
     * the one function that assigns `hidden` on these rows. Two functions
     * setting that property is two answers to the same question, and the one
     * that loses is whichever ran first.
     *
     * A PICTURE WITH NO SERIES IS HIDDEN BY EVERY SERIES. An untagged picture
     * is not one that belongs to everybody; it is one nobody has filed yet, and
     * offering it here is the ungrouped list coming back through the side door.
     *
     * THE CHOSEN PICTURE IS GIVEN UP WHEN IT LEAVES THE LIST. If somebody picks
     * a Strut photograph and then changes the series to Cycle to Zero, that
     * radio is still checked and is now invisible: the form would post a
     * picture that is not on screen and not in the chosen programme. So the
     * choice goes back to the default row, which is the series' own picture.
     * The alternative, keeping it visible as an exception, is the grouping
     * again with one row in the second group.
     * ------------------------------------------------------------------ */
    function initSeriesImageFilter() {
        var select = document.querySelector('[data-uc-request-series]');
        var picker = document.querySelector('[data-uc-image-picker]');
        if (!select || !picker) { return; }

        var scope = picker.querySelector('[data-uc-filter-scope]') || picker;
        var list = picker.querySelector('[data-uc-filter-list]');
        var note = picker.querySelector('[data-uc-image-none]');
        var current = picker.querySelector('[data-uc-image-current]');
        var fallback = picker.querySelector('[data-uc-image-default] input[type="radio"]');
        if (!list) { return; }

        var rows = list.querySelectorAll('[data-uc-image-series]');
        if (!rows.length) { return; }

        function apply() {
            var id = String(select.value || '').trim();
            var shown = 0;
            var lost = false;

            Array.prototype.forEach.call(rows, function (opt) {
                /* No series chosen means nothing to filter on, so everything is
                 * offered. That is the "an event with no series sees them all"
                 * rule, and it is this branch. */
                var keep = !id;
                if (!keep) {
                    var mine = opt.getAttribute('data-uc-image-series') || '';
                    keep = mine.indexOf(' ' + id + ' ') !== -1;
                }
                if (keep) {
                    opt.removeAttribute('data-uc-off-series');
                    shown++;
                } else {
                    opt.setAttribute('data-uc-off-series', '');
                    var radio = opt.querySelector('input[type="radio"]');
                    if (radio && radio.checked) { lost = true; }
                }
            });

            if (lost && fallback) {
                fallback.checked = true;
                showImageChoice(current, fallback);
                /* So the banner follows the choice back to the series picture
                 * rather than going on showing one that is no longer chosen. */
                fallback.dispatchEvent(new Event('change', { bubbles: true }));
            }

            if (note) { note.hidden = !(id && 0 === shown); }

            /* initFilterLists() owns `hidden`. This is the ask, not the doing. */
            scope.dispatchEvent(new CustomEvent('uc:refilter'));
        }

        select.addEventListener('change', apply);
        apply();
    }


    /* ---------------------------------------------------------------------
     * THE SAME NARROWING, FROM AN ATTRIBUTE RATHER THAN A SELECT (3.94.0)
     *
     * The event editor uses the request form's picker now instead of wp.media,
     * and its series cannot change on the page: it is a property of the event
     * being edited. So there is no <select> to listen to, and the id arrives on
     * the picker as data-uc-image-series-fixed.
     *
     * EVERYTHING ELSE IS THE SAME MECHANISM ON PURPOSE. It sets
     * data-uc-off-series on the rows it wants gone and asks initFilterLists()
     * to run, exactly as initSeriesImageFilter() does, because one owner of
     * `hidden` is what stopped the search box and the series filter fighting
     * over the same rows. A second hiding scheme here would be that fight
     * again.
     *
     * AND THERE IS A WAY PAST IT, which the public forms do not need and an
     * approver does. Pressing it clears the narrowing for good rather than
     * toggling: somebody who has asked to see everything has answered the
     * question, and a control that puts the filter back is one more thing to
     * understand on a screen that already has enough.
     * ------------------------------------------------------------------ */
    function initFixedSeriesImageFilter() {
        var picker = document.querySelector('[data-uc-image-picker][data-uc-image-series-fixed]');
        if (!picker) { return; }

        var id = String(picker.getAttribute('data-uc-image-series-fixed') || '').trim();
        var scope = picker.querySelector('[data-uc-filter-scope]') || picker;
        var list = picker.querySelector('[data-uc-filter-list]');
        var all = picker.querySelector('[data-uc-image-show-all]');
        var note = picker.querySelector('[data-uc-image-none]');
        if (!list) { return; }

        var rows = list.querySelectorAll('[data-uc-image-series]');
        if (!rows.length) { return; }

        /* WITH NO SERIES THERE IS NOTHING TO NARROW TO, so nothing is hidden
         * and the escape is pointless. Same branch the select version has. */
        if (!id || '0' === id) {
            if (all) { all.hidden = true; }
            return;
        }

        var narrowed = false;

        function apply(on) {
            var shown = 0;
            Array.prototype.forEach.call(rows, function (opt) {
                var keep = !on;
                if (!keep) {
                    var mine = opt.getAttribute('data-uc-image-series') || '';
                    keep = mine.indexOf(' ' + id + ' ') !== -1;
                }
                if (keep) {
                    opt.removeAttribute('data-uc-off-series');
                    shown++;
                } else {
                    opt.setAttribute('data-uc-off-series', '');
                }
            });
            narrowed = on;
            /* THE CHOSEN PICTURE IS NEVER HIDDEN. It is what the event is
             * already using, so hiding it would make the panel disagree with
             * the summary row above it, and unticking is the only way back. */
            var picked = list.querySelector('input[type="radio"]:checked');
            if (picked) {
                var row = picked.closest('[data-uc-image-series]');
                if (row && row.hasAttribute('data-uc-off-series')) {
                    row.removeAttribute('data-uc-off-series');
                    shown++;
                }
            }
            if (note) { note.hidden = !(on && 0 === shown); }
            if (all) { all.hidden = !on; }
            scope.dispatchEvent(new CustomEvent('uc:refilter'));
        }

        if (all) {
            all.addEventListener('click', function (e) {
                e.preventDefault();
                if (narrowed) { apply(false); }
            });
        }

        apply(true);
    }

    /* ---------------------------------------------------------------------
     * THE SERIES FILLS IN THE PICTURE, ON THE STAFF REQUEST FORM (3.68.0)
     *
     * WHAT THIS DOES, AND WHAT IT DELIBERATELY DOES NOT. Choosing a series
     * makes the picture chooser SAY what that event's picture will be, which is
     * the series' own photo. It writes nothing: the radio still posts 0, and an
     * event in a series with no picture of its own already resolves to the
     * series photo every time it is displayed. Copying the id here would make a
     * value that goes stale the moment somebody changes the series photo, and
     * would also hand the server an attachment id it has to check against the
     * calendar folder all over again.
     *
     * NEVER OVER A PICTURE SOMEBODY CHOSE. The closed trigger is rewritten only
     * while the "nothing chosen" row is the one selected. Picking a real
     * picture leaves the trigger alone, and the row underneath goes on saying
     * what would happen if they went back to it, which is true either way.
     *
     * WHY IT IS NOT initSeriesPrefill(). That control is caladmin's, and it
     * fills in six fields through two hidden inputs and a wp.media preview.
     * This form has no hidden image fields and no media library: its picture
     * control is a list of radio buttons over the calendar folder, because the
     * page has no logged-in user. The two screens share the QUESTION and the
     * RULE, not the control. See PROJECT.md.
     *
     * IT ADDS NOTHING THE FORM NEEDS. With this function deleted the select
     * still posts, the hint above it still says what choosing a series does,
     * and the event still gets the series photo.
     * ------------------------------------------------------------------ */

    /* ---------------------------------------------------------------------
     * WHAT IS IN THE FAQ SET SOMEBODY JUST CHOSE (3.76.0).
     *
     * The staff form's set picker named a set and a count and showed nothing
     * else, so a requester picked blind. Every set's questions are now in the
     * markup, and this narrows it to the chosen one.
     *
     * IT HIDES, IT NEVER SHOWS. With this function missing or thrown, all of
     * them are on the page under headings naming each set, which is longer and
     * complete; nothing is hidden that a script has to come back and reveal.
     * Same rule as the reveal initialiser at the foot of this file, and the
     * same reason: a form reached by a link on somebody's phone has to be
     * completable whatever ran.
     * ------------------------------------------------------------------ */
    function initFaqSetPeek() {
        var box = document.querySelector('[data-uc-faq-set-lists]');
        var select = document.querySelector('select[name="faq_set"]');
        if (!box || !select) { return; }

        var lists = box.querySelectorAll('[data-uc-faq-set-list]');
        if (!lists.length) { return; }

        function apply() {
            var chosen = select.value || '';
            Array.prototype.forEach.call(lists, function (el) {
                el.hidden = (el.getAttribute('data-uc-faq-set-list') !== chosen);
            });
        }

        apply();
        select.addEventListener('change', apply);
    }

    /* ---------------------------------------------------------------------
     * FILL THE STAFF REQUEST FORM IN FROM THE LAST EVENT IN A SERIES (3.77.0).
     *
     * caladmin has had this since 3.64.0 through initSeriesPrefill(), and this
     * is the same offer against a different form. ONE DATA SOURCE, TWO
     * APPLIERS: the payload is SFAF_Series::prefill_data() in both cases, and
     * what differs is the writing, because the two forms genuinely have
     * different controls. A venue select and a text box here rather than a
     * location-mode radio group; radios for the picture rather than wp.media's
     * hidden id; one organizer rather than several.
     *
     * A FLAG INSIDE initSeriesPrefill() WOULD HAVE BEEN THE OTHER WAY, and it
     * is the arrangement this project refuses on permission-sensitive renders
     * for the same reason: a function with two field maps in it is two
     * functions sharing a body, and the one nobody is looking at is the one
     * that rots.
     *
     * NOTHING POSTS. Every write lands in a field already on the page, so an
     * answer somebody has already typed is theirs to keep: see the overwrite
     * rule below, which is why each option asks whether its field is empty
     * before offering to fill it.
     *
     * THE DATE IS NEVER OFFERED, and neither is the title. Setting the date is
     * the reason somebody is filling this form in.
     * ------------------------------------------------------------------ */
    function initRequestPrefill() {
        var panel = document.querySelector('[data-uc-request-prefill]');
        var select = document.querySelector('[data-uc-request-series]');
        var dataNode = document.querySelector('[data-uc-request-prefill-data]');
        if (!panel || !select || !dataNode) { return; }

        var data;
        try {
            data = JSON.parse(dataNode.textContent || '{}');
        } catch (e) {
            return; // Without the payload there is nothing to offer.
        }

        var form = select.form || document.querySelector('form.uc-form');
        if (!form) { return; }

        var optsBox = panel.querySelector('[data-uc-prefill-opts]');
        var nameOut = panel.querySelector('[data-uc-prefill-name]');
        var applyBtn = panel.querySelector('[data-uc-prefill-apply]');
        var noneBtn = panel.querySelector('[data-uc-prefill-none]');
        var said = panel.querySelector('[data-uc-prefill-said]');
        if (!optsBox || !applyBtn) { return; }

        function field(name) { return form.querySelector('[name="' + name + '"]'); }

        function textOf(el) { return el ? String(el.value || '').trim() : ''; }

        /* The description is the one field that may be a rich text editor by
           the time this runs. Writing the textarea and telling TinyMCE, in that
           order, so the value is right whether or not an editor started. */
        function setDescription(html) {
            var area = field('description');
            if (!area) { return; }
            area.value = html;
            if (window.tinymce && area.id) {
                var ed = window.tinymce.get(area.id);
                if (ed) { ed.setContent(html); }
            }
        }

        function descriptionValue() {
            var area = field('description');
            if (!area) { return ''; }
            if (window.tinymce && area.id) {
                var ed = window.tinymce.get(area.id);
                if (ed) { return ed.getContent(); }
            }
            return area.value || '';
        }

        function stripTags(html) { return String(html).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }

        function trimWords(text, n) {
            var words = String(text).split(' ');
            return words.length <= n ? text : words.slice(0, n).join(' ') + '...';
        }

        /*
         * EACH OPTION KEEPS ITS READ AND ITS WRITE TOGETHER, which is what
         * makes the "already filled" check honest: the thing that decides
         * whether a field is empty is the same thing that will write to it.
         */
        var OPTIONS = [
            {
                key: 'location', label: 'Location',
                has: function (d) { return d.location_mode !== ''; },
                preview: function (d) { return d.venue_name || d.location; },
                filled: function () {
                    var venue = field('venue');
                    return textOf(field('venue_other')) !== ''
                        || (venue && venue.value && venue.value !== '0');
                },
                write: function (d) {
                    var venue = field('venue');
                    var other = field('venue_other');
                    if ('venue' === d.location_mode && venue && d.venue) {
                        venue.value = String(d.venue);
                        venue.dispatchEvent(new Event('change', { bubbles: true }));
                    } else if (other) {
                        other.value = d.location;
                    }
                }
            },
            {
                key: 'times', label: 'Start and end time',
                has: function (d) { return d.start_time !== '' || d.end_time !== ''; },
                preview: function (d) { return d.start_time + (d.end_time ? ' to ' + d.end_time : ''); },
                filled: function () { return textOf(field('start_time')) !== '' || textOf(field('end_time')) !== ''; },
                write: function (d) {
                    var s = field('start_time');
                    var e = field('end_time');
                    if (s) { s.value = d.start_time; }
                    if (e) { e.value = d.end_time; }
                }
            },
            {
                key: 'description', label: 'Description',
                has: function (d) { return String(d.description).trim() !== ''; },
                preview: function (d) { return trimWords(stripTags(d.description), 8); },
                filled: function () { return descriptionValue().trim() !== ''; },
                write: function (d) { setDescription(d.description); }
            },
            {
                key: 'organizer', label: 'Organizer',
                has: function (d) { return d.organizers && d.organizers.length > 0; },
                preview: function (d) { return d.organizer_name; },
                filled: function () {
                    return !!form.querySelector('[name="organizer[]"]:checked');
                },
                /* ALL OF THEM (3.84.0). This took organizers[0] because the form
                   asked with a single select, so the preview said "A, B and C"
                   and then applied A on its own. The control is tick boxes now
                   and the whole set goes on, which is what the preview has been
                   promising all along. */
                write: function (d) {
                    d.organizers.forEach(function (id) {
                        var box = form.querySelector('[name="organizer[]"][value="' + id + '"]');
                        if (box) { box.checked = true; }
                    });
                }
            },
            {
                key: 'image', label: 'Picture',
                /* ONLY AN ATTACHMENT, NEVER A URL. This form's picture control
                   is radios over the calendar folder, so there is a radio to
                   check only where the series photo IS one of those pictures. A
                   series whose photo is a typed URL has nothing here to select,
                   and the "no picture" row already shows that photo and says it
                   is what will be used. */
                has: function (d) { return d.image_id > 0 && !!radioFor(d.image_id); },
                preview: function (d) { return nameFor(d.image_id); },
                filled: function () {
                    var chosen = form.querySelector('[name="image_id"]:checked');
                    return !!(chosen && chosen.value && chosen.value !== '0');
                },
                write: function (d) {
                    var radio = radioFor(d.image_id);
                    if (radio) {
                        radio.checked = true;
                        radio.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                }
            },
            {
                key: 'faq', label: 'FAQ set',
                has: function (d) { return d.faq_set !== ''; },
                preview: function (d) { return d.faq_set_name; },
                filled: function () {
                    var el = field('faq_set');
                    return !!(el && el.value);
                },
                write: function (d) {
                    var el = field('faq_set');
                    if (el) {
                        el.value = String(d.faq_set);
                        el.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                }
            }
        ];

        function radioFor(id) {
            return form.querySelector('[name="image_id"][value="' + String(id) + '"]');
        }

        function nameFor(id) {
            var radio = radioFor(id);
            return radio ? (radio.getAttribute('data-uc-image-name') || '') : '';
        }

        var shown = [];

        function build() {
            var d = data[String(select.value)] || null;
            shown = [];
            optsBox.innerHTML = '';

            if (!d || !select.value || '0' === String(select.value)) {
                panel.hidden = true;
                return;
            }

            OPTIONS.forEach(function (opt) {
                if (!opt.has(d)) { return; }

                var row = document.createElement('label');
                row.className = 'uc-check uc-prefill-opt';

                var box = document.createElement('input');
                box.type = 'checkbox';
                /* ALL TICKED. Somebody who pressed a button called "fill this
                   in from the last one" has already said yes; the ticks are for
                   taking one back out, not for opting each one in. */
                box.checked = true;
                row.appendChild(box);

                var text = document.createElement('span');
                text.className = 'uc-prefill-opt-text';

                var label = document.createElement('span');
                label.className = 'uc-prefill-opt-label';
                label.textContent = opt.label;
                text.appendChild(label);

                var value = document.createElement('span');
                value.className = 'uc-prefill-opt-value';
                value.textContent = opt.preview(d) || '';
                text.appendChild(value);

                /* WHAT IT WILL OVERWRITE, SAID BEFORE IT DOES IT. A field the
                   requester has already answered is one this must not take back
                   without telling them, so the row says so and stays ticked:
                   the decision is theirs and the information is the point. */
                if (opt.filled()) {
                    var warn = document.createElement('span');
                    warn.className = 'uc-prefill-opt-warn';
                    warn.textContent = 'replaces what you have typed';
                    text.appendChild(warn);
                }

                row.appendChild(text);
                optsBox.appendChild(row);
                shown.push({ opt: opt, box: box });
            });

            if (!shown.length) {
                panel.hidden = true;
                return;
            }

            if (nameOut) {
                var chosen = select.options[select.selectedIndex];
                nameOut.textContent = chosen ? chosen.textContent.trim() : '';
            }
            if (said) { said.hidden = true; }
            panel.hidden = false;
        }

        applyBtn.addEventListener('click', function () {
            var d = data[String(select.value)] || null;
            if (!d) { return; }

            var n = 0;
            shown.forEach(function (row) {
                if (!row.box.checked) { return; }
                row.opt.write(d);
                n++;
            });

            if (said) {
                said.textContent = n
                    ? (n + (1 === n ? ' field filled in.' : ' fields filled in.') + ' Check them before you send.')
                    : 'Nothing was ticked, so nothing was filled in.';
                said.hidden = false;
            }
        });

        if (noneBtn) {
            noneBtn.addEventListener('click', function () { panel.hidden = true; });
        }

        select.addEventListener('change', build);
        build();
    }

    function initRequestSeriesImage() {
        var select = document.querySelector('[data-uc-request-series]');
        var picker = document.querySelector('[data-uc-image-picker]');
        if (!select || !picker) { return; }

        var row = picker.querySelector('[data-uc-image-default]');
        var current = picker.querySelector('[data-uc-image-current]');
        if (!row || !current) { return; }

        var radio = row.querySelector('input[type="radio"]');
        var thumb = row.querySelector('.uc-image-option-thumb');
        var name = row.querySelector('.uc-image-option-name');
        if (!radio || !thumb || !name) { return; }

        var NONE = 'No picture';

        function chosenThumb() {
            var opt = select.options[select.selectedIndex];
            return opt ? (opt.getAttribute('data-uc-series-thumb') || '') : '';
        }

        function apply() {
            var src = chosenThumb();
            if (src) {
                /* backgroundImage, not a swapped <img>: the row already has one
                   element sized and bordered for a thumbnail, and replacing it
                   would mean rebuilding it again on the way back. The picture
                   is decoration here, exactly as the alt="" thumbs beside it
                   are, so it carries no name of its own. */
                thumb.style.backgroundImage = 'url("' + src.replace(/"/g, '%22') + '")';
                thumb.classList.add('uc-image-option-thumb-series');
                thumb.classList.remove('uc-image-option-blank');
                name.textContent = 'The series picture';
                radio.setAttribute('data-uc-image-thumb', src);
                radio.setAttribute('data-uc-image-name', 'The series picture');
            } else {
                thumb.style.backgroundImage = '';
                thumb.classList.remove('uc-image-option-thumb-series');
                thumb.classList.add('uc-image-option-blank');
                name.textContent = NONE;
                radio.removeAttribute('data-uc-image-thumb');
                radio.setAttribute('data-uc-image-name', NONE);
            }

            // ONLY WHEN NOTHING IS CHOSEN. This is the whole guard.
            if (radio.checked) {
                showImageChoice(current, radio);
            }
        }

        select.addEventListener('change', apply);
        // And on load, because a rejected submission comes back with the series
        // still chosen and the trigger would otherwise say "No picture chosen"
        // about an event that has one.
        apply();
    }

    /* ---------------------------------------------------------------------
     * Disclosures: keep aria-expanded in step with the <details> state.
     *
     * The disclosure works with no script at all, <details> is what opens and
     * closes it, and the chevron is rotated by CSS off the [open] attribute.
     * What a <summary> does NOT reliably expose is aria-expanded: browsers vary
     * on whether the details state reaches the accessibility tree as one, and
     * the attribute is what a screen reader announces. So it is written into
     * the markup closed, and corrected here on every toggle.
     * ------------------------------------------------------------------ */
    function initDisclosures() {
        document.querySelectorAll('details[data-uc-disclosure]').forEach(function (d) {
            var summary = d.querySelector('summary');
            if (!summary) { return; }
            function sync() { summary.setAttribute('aria-expanded', d.open ? 'true' : 'false'); }
            sync();
            d.addEventListener('toggle', sync);
        });
    }

    /* ---------------------------------------------------------------------
     * Type-to-filter over any list of choices.
     *
     * THE NOTIFY PICKER HAD THIS AND NOTHING ELSE COULD USE IT. Its filter is
     * bound inside initNotifyPicker(), scoped to that picker's root and keyed
     * on data-uc-picker-filter="people", so the team member picker would have
     * meant a second copy of the same twenty lines. This is the same behaviour
     * with the container found from the input rather than named by it: an
     * <input data-uc-filter> filters the [data-uc-filter-text] elements inside
     * the nearest [data-uc-filter-list] after it, and toggles the
     * [data-uc-filter-empty] note.
     *
     * A TICKED CHOICE IS NEVER FILTERED OUT OF SIGHT, which is the one rule
     * that matters here and the reason this is not a plain string match.
     * Losing track of somebody already chosen is how a filter turns into an
     * accidental deselection, and on this screen the choices are staged and
     * not yet saved.
     *
     * THE EMPTY NOTE RUNS ONCE ON LOAD, so the message on screen always
     * describes the list on screen, and it only ever answers a query: with the
     * box empty there is nothing to fail to match.
     * ------------------------------------------------------------------ */
    function initFilterLists() {
        document.querySelectorAll('input[data-uc-filter]').forEach(function (input) {
            // The list is the closest following one within a shared ancestor,
            // so a screen may carry several without them reaching each other.
            var scope = input.closest('[data-uc-filter-scope]') || input.parentNode.parentNode;
            var list = scope ? scope.querySelector('[data-uc-filter-list]') : null;
            if (!list) { return; }
            var note = scope.querySelector('[data-uc-filter-empty]');

            /* ONE OWNER OF `hidden`, AND THAT IS THIS FUNCTION (3.80.0).
             *
             * The image picker now has a SECOND filter over the same list: the
             * series narrowing in initImageChoice(). Two functions assigning
             * opt.hidden is two answers to "is this row on screen", and the one
             * that wins is whichever ran last, so typing in the search box
             * would have un-hidden every picture the series filter had just
             * taken away.
             *
             * So the series filter owns a MARKER and this owns the property.
             * It sets data-uc-off-series on the rows it wants gone and asks
             * this to run again; nothing else ever touches hidden on these
             * rows. The same shape as the cascade rule on the stylesheet side:
             * decide where a property is set, once, rather than racing. */
            function apply() {
                var q = input.value.replace(/\s+/g, ' ').trim().toLowerCase();
                var shown = 0;
                Array.prototype.forEach.call(
                    list.querySelectorAll('[data-uc-filter-text]'),
                    function (opt) {
                        var hay = opt.getAttribute('data-uc-filter-text') || '';
                        var box = opt.querySelector('input[type="checkbox"]');
                        var off = opt.hasAttribute('data-uc-off-series');
                        var keep = !off && (!q || hay.indexOf(q) !== -1 || (box && box.checked));
                        opt.hidden = !keep;
                        if (keep) { shown++; }
                    }
                );
                /* Only about the SEARCH. A list emptied by the series filter is
                 * a different sentence, said by the series filter's own note,
                 * and two notes at once would be the screen telling somebody
                 * off twice for one thing. */
                if (note) { note.hidden = (shown !== 0 || q === ''); }
            }

            input.addEventListener('input', apply);
            /* The series filter's way of asking for a re-run without reaching
             * into this closure. */
            scope.addEventListener('uc:refilter', apply);
            // Escape clears the filter before the browser closes the <details>
            // out from under somebody mid-search.
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && input.value !== '') {
                    e.preventDefault();
                    e.stopPropagation();
                    input.value = '';
                    apply();
                }
            });
            apply();
        });
    }

    /* ---------------------------------------------------------------------
     * NO ENTRANCE CODE IN THIS FILE. It moved to an inline script in
     * SFAF_Portal::head() in 3.17.0, and the move is the fix rather than a
     * tidy-up: from here it could only ever run on DOMContentLoaded, which is
     * after the first paint, so the page drew itself complete and only then
     * dropped to opacity 0 to fade back in. It was also the last call in this
     * list, where any earlier initialiser throwing would have removed it in
     * silence. In the head it lands before anything is painted, and the
     * animation itself is pure CSS afterwards.
     * ------------------------------------------------------------------ */

    /* ---------------------------------------------------------------------
     * Help disclosures: a "?" beside a label opening a paragraph.
     *
     * THE REGION IS VISIBLE UNTIL THIS RUNS, and that is the whole no-script
     * story: with the file missing, every explanation is simply on the page as
     * it used to be. Nothing is ever hidden behind a control that cannot open.
     *
     * A BUTTON, NOT A HOVER. Hover cannot be produced by a touch screen or by a
     * keyboard, and `title` is announced inconsistently and cannot hold a
     * sentence worth reading. This is the plain disclosure pattern: click, tap,
     * Enter and Space all work because they are what a <button> already does,
     * and aria-expanded says which way it is.
     * ------------------------------------------------------------------- */
    function initHelpToggles() {
        document.querySelectorAll('[data-uc-help-toggle]').forEach(function (btn) {
            var id = btn.getAttribute('aria-controls');
            var body = id ? document.getElementById(id) : null;
            if (!body) {
                return; // leave the paragraph where it is rather than orphan it
            }

            body.hidden = true;
            btn.setAttribute('aria-expanded', 'false');

            btn.addEventListener('click', function () {
                var open = btn.getAttribute('aria-expanded') === 'true';
                btn.setAttribute('aria-expanded', open ? 'false' : 'true');
                body.hidden = open;
            });

            // Escape closes it without moving focus somewhere unexpected, and
            // stops there rather than reaching whatever else listens for it.
            btn.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && btn.getAttribute('aria-expanded') === 'true') {
                    e.stopPropagation();
                    btn.setAttribute('aria-expanded', 'false');
                    body.hidden = true;
                }
            });
        });
    }

    /* ---------------------------------------------------------------------
     * Categories as chips.
     *
     * THE CHECKBOXES ARE STILL THE FORM. Every one of them is rendered by the
     * server, every one of them posts, and with this function deleted the
     * control is the checkbox list it has always been. What happens here is
     * that the list is folded away behind an "Add category" button and the
     * ticked ones are mirrored as removable chips, because that is what a
     * category looks like on a card, on the event page and in the filter bar,
     * and the editor was the one place it did not.
     *
     * NOTHING IS STORED TWICE. A chip has no state: it is drawn from the
     * checkbox and its × unticks the checkbox. There is no second list to fall
     * out of step with the first.
     * ------------------------------------------------------------------- */
    function initCategoryChips() {
        document.querySelectorAll('[data-uc-chips]').forEach(function (root) {
            var source = root.querySelector('[data-uc-chips-source]');
            var list = root.querySelector('[data-uc-chips-list]');
            var empty = root.querySelector('[data-uc-chips-empty]');
            var addWrap = root.querySelector('[data-uc-chips-add]');
            var toggle = root.querySelector('[data-uc-chips-toggle]');
            if (!source || !list || !addWrap || !toggle) {
                return;
            }

            var boxes = Array.prototype.slice.call(source.querySelectorAll('input[type="checkbox"]'));
            if (!boxes.length) {
                return;
            }

            function labelOf(box) {
                var label = box.closest ? box.closest('label') : null;
                return (label && label.getAttribute('data-uc-chip-label')) || (label ? label.textContent.trim() : '');
            }

            function draw() {
                list.innerHTML = '';
                var chosen = 0;

                boxes.forEach(function (box) {
                    if (!box.checked) {
                        return;
                    }
                    chosen++;
                    var chip = document.createElement('span');
                    chip.className = 'uc-chip';
                    var color = box.getAttribute('data-uc-chip-color');
                    if (color) {
                        chip.style.setProperty('--chip-color', color);
                    }

                    var text = document.createElement('span');
                    text.className = 'uc-chip-text';
                    text.textContent = labelOf(box);
                    chip.appendChild(text);

                    // A chip is only removable while the field is editable. On
                    // an imported event whose categories a platform owns, the
                    // checkbox is disabled and the chip is a label.
                    //
                    // The `uc-inert` half of this test went with the pencils in
                    // 3.23.0: that class was how the scope lock made a checkbox
                    // unusable, since a checkbox has no readonly. Nothing sets
                    // it now, so `disabled` is the whole question again.
                    if (!box.disabled) {
                        var kill = document.createElement('button');
                        kill.type = 'button';
                        kill.className = 'uc-chip-remove';
                        kill.setAttribute('aria-label', 'Remove ' + labelOf(box));
                        kill.innerHTML = '&times;';
                        kill.addEventListener('click', function () {
                            box.checked = false;
                            draw();
                            toggle.focus();
                        });
                        chip.appendChild(kill);
                    }

                    list.appendChild(chip);
                });

                list.hidden = (chosen === 0);
                if (empty) { empty.hidden = (chosen !== 0); }
            }

            boxes.forEach(function (box) {
                box.addEventListener('change', draw);
            });

            toggle.addEventListener('click', function () {
                var open = source.hasAttribute('hidden');
                if (open) {
                    source.removeAttribute('hidden');
                } else {
                    source.setAttribute('hidden', 'hidden');
                }
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });

            // Only now that the button works is the list allowed to fold away.
            source.setAttribute('hidden', 'hidden');
            source.classList.add('uc-chips-source');
            addWrap.removeAttribute('hidden');
            root.classList.add('uc-chips-on');
            draw();
        });
    }

    /* ---------------------------------------------------------------------
     * Location: a venue, or somewhere one-off.
     *
     * Both panels are server-rendered and both submit; the radio decides which
     * one the save believes. All this does is hide the one that is not chosen,
     * so with scripting off the screen shows two controls and a choice rather
     * than nothing.
     * ------------------------------------------------------------------- */
    function initLocationPicker() {
        document.querySelectorAll('[data-uc-location]').forEach(function (root) {
            var modes = Array.prototype.slice.call(root.querySelectorAll('[data-uc-location-mode]'));

            /* Online, and the venue/address half it replaces. Both are
             * server-rendered and both submit; the SAVE prefers the tick, so
             * this only hides the half that does not apply. An imported event
             * has neither control and drops out here. */
            var online = root.querySelector('[data-uc-online-toggle]');
            var place  = root.querySelector('[data-uc-location-place]');
            var panel  = root.querySelector('[data-uc-online-panel]');

            if (!modes.length && !online) {
                return;
            }

            function apply() {
                var isOnline = !!(online && online.checked);
                if (panel) { panel.hidden = !isOnline; }
                if (place) { place.hidden = isOnline; }

                var chosen = 'custom';
                modes.forEach(function (m) { if (m.checked) { chosen = m.value; } });
                Array.prototype.forEach.call(root.querySelectorAll('[data-uc-location-panel]'), function (p) {
                    p.hidden = (p.getAttribute('data-uc-location-panel') !== chosen);
                });
            }

            modes.forEach(function (m) { m.addEventListener('change', apply); });
            if (online) { online.addEventListener('change', apply); }
            root.classList.add('uc-location-on');
            apply();
        });
    }

    /* ---------------------------------------------------------------------
     * The events list search, as you type.
     *
     * IT USED TO SUBMIT THE FORM, AND THAT IS WHAT WAS DROPPING LETTERS
     * (3.74.0).
     *
     * The complaint was that the box fights the person typing. It was already
     * debounced at 300ms, so "it searches on every keystroke" was not the
     * cause; what it did after the debounce was NAVIGATE. A submit tears down
     * the document, so every letter typed between the request going out and
     * the new page arriving went into a page that no longer exists, and
     * `data-uc-refocus` then put the caret back at the end of whatever the
     * SERVER thought the term was. On a 259-row list over a slow connection
     * that is a word and a half gone, and a longer debounce would not have
     * fixed any of it. Both halves of the complaint were the same half.
     *
     * SO IT DOES NOT NAVIGATE ANY MORE. It fetches the same URL it used to
     * submit to, takes the results region out of the response, and swaps that
     * one element. The input is never touched, so there is no focus to
     * restore, no caret to put back, and nothing typed mid-flight is lost.
     *
     * THE URL STILL SAYS WHAT IS BEING SEARCHED. history.replaceState(), so
     * the address bar is shareable and a reload lands on the same list.
     * REPLACE rather than push: one history entry per keystroke would make the
     * back button walk backwards through a word.
     *
     * A STALE ANSWER IS DISCARDED, not rendered. Each fetch takes a sequence
     * number and only the newest one may write, or a slow response for "co"
     * would land on top of the results for "coffee".
     *
     * AND IT FALLS BACK TO THE PAGE LOAD IT REPLACED. No fetch, no DOMParser,
     * no results region in the answer, or a request that failed: the form is
     * submitted, which is exactly what this did before and still what happens
     * with no script at all. `data-uc-refocus` stays for that path and for the
     * Filter button.
     * ------------------------------------------------------------------- */
    function initLiveSearch() {
        var refocus = document.querySelector('[data-uc-refocus]');
        if (refocus) {
            refocus.focus();
            var end = refocus.value.length;
            try { refocus.setSelectionRange(end, end); } catch (err) { /* not all inputs allow it */ }
        }

        document.querySelectorAll('[data-uc-live-search]').forEach(function (form) {
            var input = form.querySelector('[data-uc-live-search-input]');
            if (!input) {
                return;
            }
            var timer = null;
            var last = input.value;
            var seq = 0;

            /* The results region, which is the only thing on the page a search
             * changes. Looked up per search rather than held, because the swap
             * below replaces what is inside it. */
            function region() {
                return document.querySelector('[data-uc-live-search-results]');
            }

            /* What this did before, kept as the fallback and as the no-script
             * path's behaviour. */
            function navigate() {
                form.classList.add('uc-searching');
                if (typeof form.requestSubmit === 'function') {
                    form.requestSubmit();
                } else {
                    form.submit();
                }
            }

            function urlNow() {
                var base = form.getAttribute('action') || window.location.pathname;
                var query = new URLSearchParams(new FormData(form)).toString();
                return base + (base.indexOf('?') >= 0 ? '&' : '?') + query;
            }

            function go() {
                if (input.value === last) {
                    return; // nothing changed: a stray keyup, or arrow keys
                }
                last = input.value;

                var target = region();
                if (!target || !window.fetch || !window.DOMParser || !window.URLSearchParams
                    || !window.history || !window.history.replaceState) {
                    navigate();
                    return;
                }

                var url = urlNow();
                var mine = ++seq;
                form.classList.add('uc-searching');

                window.fetch(url, { credentials: 'same-origin' }).then(function (res) {
                    if (!res.ok) { throw new Error('HTTP ' + res.status); }
                    return res.text();
                }).then(function (html) {
                    if (mine !== seq) {
                        return; // a later keystroke has already answered
                    }
                    var fresh = new DOMParser()
                        .parseFromString(html, 'text/html')
                        .querySelector('[data-uc-live-search-results]');
                    if (!fresh) { throw new Error('no results region in the answer'); }

                    target.innerHTML = fresh.innerHTML;
                    window.history.replaceState({}, '', url);
                    form.classList.remove('uc-searching');

                    /* THE CONTROLS INSIDE THE REGION ARE NEW ELEMENTS, and
                     * both of these bind per element rather than delegating.
                     * Without this the tick boxes and the Remove confirmation
                     * would be dead on every row after the first search, which
                     * is a worse fault than the one being fixed. Both are
                     * idempotent, so the controls outside the region that were
                     * already bound are left alone. */
                    run('tickPickers', initTickPickers);
                    run('confirmButtons', initConfirmButtons);
                }).catch(function () {
                    if (mine !== seq) { return; }
                    navigate();
                });
            }

            input.addEventListener('input', function () {
                clearTimeout(timer);
                timer = setTimeout(go, 300);
            });
            // Enter should search now rather than wait out the debounce, and
            // should not double-submit afterwards.
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    clearTimeout(timer);
                }
            });
        });
    }

    /**
     * Slow actions that need to say they are working.
     *
     * "Fetch updates" is several seconds of remote HTTP. As a plain form POST
     * it gave no sign it had started, so people pressed it again; and when it
     * failed the browser showed an error page or nothing at all, with no way
