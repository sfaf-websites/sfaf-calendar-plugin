         *
         * THE TWO PASSES DIFFERED BY EXACTLY ONE THING and the one that worked
         * was the deferred one. Rows that exist when the page is built were
         * started synchronously from here, inside DOMContentLoaded; rows added
         * by Add FAQ are started inside a setTimeout(..., 0). The first showed
         * raw markup and the second worked, on the same textareas, with the
         * same settings, through the same start().
         *
         * WHAT IS NOT CLAIMED. The underlying reason cannot be named from this
         * repository: there is no browser here, and until the catch above
         * started logging there was nothing to read in one either. So this is
         * not "the fix" being asserted; it is the load pass being made to look
         * like the pass that demonstrably works, and the exception being made
         * readable so the next attempt has something to go on.
         *
         * AND IT DOES NOT STOP AT ONE TASK. A bare setTimeout(0) is a guess
         * about timing, and this project has paid for those. If wp.editor is
         * present but not yet able to start an editor, one deferred turn may
         * not be enough and no number of them is knowable in advance. So it
         * retries while nothing has taken, on a short backoff, and gives up
         * after a second: what is left then is the textarea it already was,
         * holding the same content, posting the same field. That is the
         * degradation SFAF_Rich_Text::deferred() promises and it is unchanged.
         */
        var tries = 0;
        function pass() {
            startAll();
            tries++;
            /* Anything still un-started, and time left to try again. Reading
             * the DOM rather than a counter, so a row that started on the
             * second attempt is not retried on the third. */
            var pending = document.querySelector(
                'textarea[data-uc-rich]:not([data-uc-rich-on])'
            );
            if (pending && !pending.closest('template') && tries < 6) {
                window.setTimeout(pass, tries * 50);
            }
        }
        window.setTimeout(pass, 0);

        /*
         * A new row arrives by cloning, and a removed one has to have its
         * editor taken down or TinyMCE keeps an instance pointed at an element
         * that is no longer in the document, and the next row with that id
         * silently fails to start.
         *
         * THERE ARE THREE WAYS A ROW GETS ONTO THIS SCREEN AND ONLY TWO OF
         * THEM ASKED FOR AN EDITOR (3.74.0).
         *
         *   from the server   the load pass above covers it
         *   + Add FAQ         `.uc-repeater-add`, covered here
         *   a FAQ set         `[data-uc-faq-apply]`, covered by NOTHING
         *
         * initFaqSetPicker() builds its rows from the same <template>, fills
         * in the question and the answer, and appends them. It never asked for
         * an editor, so those answers stayed the plain textareas the template
         * holds, and they stayed plain until something else happened to run
         * startAll() over the whole document. Pressing + Add FAQ afterwards is
         * exactly that: one new row, and every set row already on the screen
         * turning into an editor at the same moment. That is the reported
         * symptom, and it is the SWEEP doing it rather than the add.
         *
         * THE CONSOLE WAS SILENT AND THE SILENCE WAS CORRECT. The catch in
         * start() names an initialise that threw; nothing here ever got as far
         * as initialising, so there was nothing for it to name.
         *
         * MATCHED HERE RATHER THAN CALLED FROM THE PICKER. initFaqSetPicker()
         * is in another top-level scope of this file and cannot see startAll(),
         * which is the 3.72.0 fault exactly. A listener on the document is what
         * the two scopes already share.
         */
        document.addEventListener('click', function (e) {
            var add = e.target.closest
                ? e.target.closest('.uc-repeater-add, [data-uc-faq-apply]')
                : null;
            if (add) {
                /* After initRepeaters() or the set picker has appended its
                 * rows. This listener is on the capture phase and both of
                 * theirs are on the target, so the rows are in the document by
                 * the time a deferred task runs. Same startAll() the load pass
                 * runs, rather than a second copy of the loop. */
                window.setTimeout(startAll, 0);
                return;
            }
            var remove = e.target.closest ? e.target.closest('.uc-repeater-remove') : null;
            if (remove) {
                var row = remove.closest('.uc-repeater-row');
                if (!row) { return; }
                row.querySelectorAll('textarea[data-uc-rich][data-uc-rich-on]').forEach(function (area) {
                    try { wp.editor.remove(area.id); } catch (err) { /* nothing to take down */ }
                });
            }
        }, true);
    }
})();

/* ---------------------------------------------------------------------------
   A CHOICE THAT REVEALS A FIELD (3.47.0)

   The submission form asks for cost and age as closed lists with an escape, and
   for a venue with an address as the alternative. In each case one control
   decides whether a second one is worth showing.

   IT STARTS FROM VISIBLE AND HIDES, RATHER THAN STARTING HIDDEN AND SHOWING.
   That is the whole of the progressive enhancement here: with this script
   missing or broken, every field is on the page and the form still works. The
   opposite arrangement, hidden in CSS until JavaScript says otherwise, means
   somebody who picks "Something else" with no JavaScript is asked for a value
   in a box they cannot see, and is then refused for leaving it empty.

   The trigger names its target by id and says which value reveals it, so the
   venue select (reveal when the location is entered by hand, value 0) and the
   two choice selects (reveal on "other") are the same mechanism rather than
   three.

   A TICK BOX IS THE FOURTH, AND ITS VALUE DOES NOT MOVE (3.74.0). "Use my
   details as the public contact" reveals the separate contact fields when it is
   OFF, and a checkbox's `value` is the same string whether it is ticked or not,
   so the comparison below cannot answer for one. It reads `checked` instead,
   and `data-uc-reveal-when="unchecked"` is how a trigger says which way round
   it runs.
   --------------------------------------------------------------------------- */
(function () {
    var triggers = document.querySelectorAll('[data-uc-reveal]');
    if (!triggers.length) { return; }

    function sync(trigger) {
        var target = document.getElementById(trigger.getAttribute('data-uc-reveal'));
        if (!target) { return; }
        var when = trigger.getAttribute('data-uc-reveal-when');
        if (when === null) { when = 'other'; }
        var on;
        if ('checkbox' === trigger.type) {
            on = ('unchecked' === when) ? !trigger.checked : !!trigger.checked;
        } else {
            on = (String(trigger.value) === String(when));
        }
        target.hidden = !on;
        /* A hidden field must not be submitted as an empty answer, and must not
           be reachable by keyboard while it is off screen. `hidden` alone does
           neither for the controls inside it. */
        target.querySelectorAll('input, select, textarea').forEach(function (field) {
            field.disabled = !on;
        });
    }

    triggers.forEach(function (trigger) {
        sync(trigger);
        trigger.addEventListener('change', function () { sync(trigger); });
    });
})();

/* ---------------------------------------------------------------------------
   THE APPROVAL PROMPT (3.48.0)

   Approving a submission asks two things about the person who sent it, and both
   are about the same person at the same moment, so they are ONE dialog. Two
   prompts in a row is how a manager learns to press the second without reading
   it.

   THE PANEL IS ALREADY IN THE PAGE. This moves it into a real <dialog> and
   opens it modally, then puts it back where it was. With this script missing,
   or in a browser with no <dialog>, the panel stays visible beside the Approve
   button and the ticks work exactly as they read: the enhancement can fail and
   leave a usable screen, which is the same arrangement the recurrence scope
   question uses.

   THE INPUTS CARRY `form=`, so they still post with the Approve form while they
   are sitting in the dialog. Without that they would be detached from it the
   moment the panel moved, and both answers would arrive unticked whatever was
   pressed.
   --------------------------------------------------------------------------- */
(function () {
    var buttons = document.querySelectorAll('[data-uc-approve-ask]');
    if (!buttons.length) { return; }

    var supported = false;
    try {
        supported = typeof document.createElement('dialog').showModal === 'function';
    } catch (err) {
        supported = false;
    }
    if (!supported) { return; }

    /* Only hidden once we know we can show it again.
     *
     * THE SELECTOR IS THE ATTRIBUTE, NOT THE CLASS (3.72.0). Rejecting now
     * asks the same way approving does, and its panel is not an approval panel
     * and does not want approval styling. What the two share is being a block
     * of controls that belongs inside the confirmation rather than beside it,
     * so that is what the selector says. */
    document.querySelectorAll('[data-uc-ask-panel]').forEach(function (panel) {
        panel.hidden = true;
    });

    buttons.forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            if (btn.hasAttribute('data-uc-approved')) {
                btn.removeAttribute('data-uc-approved');
                return;
            }
            var panel = document.getElementById(btn.getAttribute('data-uc-approve-ask'));
            if (!panel) { return; }

            e.preventDefault();

            /* Where to put it back. A marker rather than a remembered parent
               and index, because the row around it can be re-rendered by
               nothing else on this screen but a marker is cheap and exact. */
            var home = document.createComment('uc-approve-ask');
            panel.parentNode.insertBefore(home, panel);

            var dialog = document.createElement('dialog');
            dialog.className = 'uc-confirm-modal uc-approve-modal';

            var form = document.createElement('form');
            form.method = 'dialog';

            /* The question and the verb come off the button, so one mechanism
             * serves Approve and Reject without either one's words being
             * written here. The defaults are what this said before it had to
             * serve two. */
            var heading = document.createElement('p');
            heading.className = 'uc-confirm-msg';
            heading.textContent = btn.getAttribute('data-uc-ask-title') || 'Publish this event?';

            var actions = document.createElement('div');
            actions.className = 'uc-confirm-actions';

            var cancel = document.createElement('button');
            cancel.type = 'submit';
            cancel.value = 'cancel';
            cancel.className = 'uc-btn uc-btn-sm';
            cancel.textContent = 'Cancel';

            var ok = document.createElement('button');
            ok.type = 'submit';
            ok.value = 'ok';
            ok.className = 'uc-btn uc-btn-sm '
                + (btn.hasAttribute('data-uc-ask-danger') ? 'uc-btn-danger' : 'uc-btn-primary');
            ok.textContent = btn.getAttribute('data-uc-ask-confirm') || 'Approve';

            actions.appendChild(cancel);
            actions.appendChild(ok);

            form.appendChild(heading);
            panel.hidden = false;
            form.appendChild(panel);
            form.appendChild(actions);
            dialog.appendChild(form);
            document.body.appendChild(dialog);

            dialog.addEventListener('close', function () {
                document.body.classList.remove('uc-modal-open');
                var answer = dialog.returnValue;

                /* Home first, whatever the answer: a cancelled dialog that took
                   the panel with it would leave the row unable to ask again. */
                panel.hidden = true;
                home.parentNode.insertBefore(panel, home);
                home.parentNode.removeChild(home);
                dialog.remove();

                if ('ok' === answer) {
                    btn.setAttribute('data-uc-approved', '1');
                    btn.click();
                }
            });

            ucDismissOnBackdrop(dialog);
            document.body.classList.add('uc-modal-open');
            dialog.showModal();
        });
    });
})();

/* ---------------------------------------------------------------------------
   THE FORM LINKS (3.49.0)

   Nothing in caladmin linked to either public form, so sending somebody one
   meant remembering the URL shape. The dashboard now carries a control that
   hands them over.

   THE PANEL IS A <details> IN THE PAGE AND THIS LIFTS IT INTO A <dialog>.
   Same arrangement as the approval prompt and the recurrence scope question,
   and the same reason: with this script missing, or in a browser with no
   <dialog>, the disclosure opens in place and every link is already written
   out. The enhancement can fail and leave a screen that works.

   THE PICKER AND THE COPY BUTTONS ARE DELEGATED FROM `document`, deliberately.
   The panel gets MOVED between the page and the dialog, and a listener bound to
   a node inside it would have to survive that move. Delegation does not care
   where the node currently lives.

   WITHOUT THIS SCRIPT the picker cannot rewrite the box, which is why the
   markup also prints every campaign's link inside a <noscript>: a select that
   silently does nothing would leave the first campaign's link showing while a
   different campaign was chosen, which is a wrong answer wearing the shape of a
   right one.
   --------------------------------------------------------------------------- */
(function () {
    var host = document.querySelector('[data-uc-form-links]');

    /* ---- The picker rewrites the box ------------------------------------
     * The option's value IS the URL, built by SFAF_Submit::url() in PHP, so
     * nothing here assembles an address out of parts. A link this script had
     * to construct would be a second copy of that format, in a second
     * language, free to drift from the one the form actually answers to. */
    document.addEventListener('change', function (e) {
        var select = e.target.closest ? e.target.closest('[data-uc-form-link-series]') : null;
        if (!select) { return; }
        var scope = select.closest('.uc-form-link') || document;
        var out = scope.querySelector('[data-uc-form-link-out]');
        if (out) { out.value = select.value; }
    });

    /* ---- Copy -----------------------------------------------------------
     * Two ways, because the modern one needs a secure context and caladmin is
     * not guaranteed to be on one. If both fail the field is still readable
     * and still selects itself on focus, so the link can always be taken by
     * hand: the button is a convenience over a working control, never the
     * only way to get the value out. */
    document.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('[data-uc-copy]') : null;
        if (!btn) { return; }
        e.preventDefault();

        var row = btn.closest('.uc-form-link-row');
        var field = row ? row.querySelector('.uc-form-link-url') : null;
        if (!field) { return; }

        var said = function (word) {
            var was = btn.getAttribute('data-uc-copy-was') || btn.textContent;
            btn.setAttribute('data-uc-copy-was', was);
            btn.textContent = word;
            window.setTimeout(function () { btn.textContent = was; }, 1600);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(field.value).then(
                function () { said('Copied'); },
                function () { field.select(); said('Press Ctrl+C'); }
            );
            return;
        }

        field.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
        said(ok ? 'Copied' : 'Press Ctrl+C');
    });

    /* ---- The dialog ----------------------------------------------------- */
    if (!host) { return; }

    var supported = false;
    try {
        supported = typeof document.createElement('dialog').showModal === 'function';
    } catch (err) {
        supported = false;
    }
    if (!supported) { return; }

    var body = host.querySelector('.uc-form-links-body');
    var summary = host.querySelector('summary');
    if (!body || !summary) { return; }

    summary.addEventListener('click', function (e) {
        /* The <details> never opens once we can show a dialog instead. Leaving
           it to open as well would put the panel on the page BEHIND the modal
           holding the same fields, with two of every id and two Copy buttons. */
        e.preventDefault();

        var home = document.createComment('uc-form-links');
        body.parentNode.insertBefore(home, body);

        var dialog = document.createElement('dialog');
        dialog.className = 'uc-confirm-modal uc-form-links-modal';

        var form = document.createElement('form');
        form.method = 'dialog';

        var actions = document.createElement('div');
        actions.className = 'uc-confirm-actions';

        var done = document.createElement('button');
        done.type = 'submit';
        done.value = 'done';
        done.className = 'uc-btn uc-btn-sm uc-btn-primary';
        done.textContent = 'Done';

        actions.appendChild(done);
        form.appendChild(body);
        form.appendChild(actions);
        dialog.appendChild(form);
        document.body.appendChild(dialog);

        dialog.addEventListener('close', function () {
            document.body.classList.remove('uc-modal-open');
            /* Home first, whatever closed it: a dialog that took the panel away
               with it would leave the summary unable to open anything again. */
            home.parentNode.insertBefore(body, home);
            home.parentNode.removeChild(home);
            dialog.remove();
            host.open = false;
        });

        ucDismissOnBackdrop(dialog);
        document.body.classList.add('uc-modal-open');
        dialog.showModal();
    });
})();

</script>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
var lines = [];
function say(s) { lines.push(s); }
say("script errors: " + (window.__errs.length ? window.__errs.join(" | ") : "none"));

var form = document.getElementById('uc-bulk-tag');
var btn = form.querySelector('[data-uc-tick-submit]');
var countEl = btn.querySelector('[data-uc-tick-count]');
var allRow = document.querySelector('[data-uc-tick-all-row]');
var all = document.querySelector('[data-uc-tick-all]');

/* 1. ASSOCIATION. The question the events list got wrong for six releases. */
var owned = Array.prototype.filter.call(form.elements, function (el) {
  return el.hasAttribute && el.hasAttribute('data-uc-tick-one');
});
var inDoc = document.querySelectorAll('[data-uc-tick-one]');
say('ticks in the document        ' + inDoc.length);
say('ticks owned by the form      ' + owned.length
    + (owned.length === inDoc.length ? '   (all of them)' : '   MISMATCH'));
say('form.elements total          ' + form.elements.length);

/* 2. Did the initialiser bind at all? */
say('picker marked as bound       ' + (form.getAttribute('data-uc-tick-on') ? 'yes' : 'NO, initTickPickers did not reach it'));
say('select-all row revealed      ' + (allRow && !allRow.hidden ? 'yes' : 'no'));
say('button disabled on arrival   ' + (btn.disabled ? 'yes' : 'no'));
say('button reads                 "' + btn.textContent.replace(/\s+/g, ' ').trim() + '"');

/* 3. TICK TWO, THE WAY A PERSON DOES: a click on the label. */
var labels = document.querySelectorAll('.uc-media-tick');
labels[0].click();
labels[2].click();
say('');
say('after clicking two labels:');
say('  boxes checked              ' + document.querySelectorAll('[data-uc-tick-one]:checked').length);
say('  count element reads        "' + countEl.textContent + '"');
say('  button reads               "' + btn.textContent.replace(/\s+/g, ' ').trim() + '"');
say('  button disabled            ' + btn.disabled);

/* 4. WHAT WOULD ACTUALLY POST. This is the half that decides whether tagging
      works at all, and it is not the same question as the count. */
var fd = new FormData(form);
var ids = fd.getAll('ids[]');
say('  ids[] the form would post  [' + ids.join(', ') + ']');
say('  uc_action                  ' + fd.get('uc_action'));
say('  marker present             ' + (fd.get('uc_media_tick_present') ? 'yes' : 'NO'));

/* 5. SELECT ALL. */
if (all) {
  all.click();
  say('');
  say('after select-all:');
  say('  boxes checked              ' + document.querySelectorAll('[data-uc-tick-one]:checked').length);
  say('  count element reads        "' + countEl.textContent + '"');
  say('  ids[] posted               ' + new FormData(form).getAll('ids[]').length);
}

/* 6. UNTICK EVERYTHING: the count must go to 0 and the button must go dead. */
Array.prototype.forEach.call(document.querySelectorAll('[data-uc-tick-one]'), function (b) {
  if (b.checked) { b.click(); }
});
say('');
say('after unticking everything:');
say('  count element reads        "' + countEl.textContent + '"');
say('  button disabled            ' + btn.disabled);

document.getElementById('out').textContent = lines.join('\n');
  }, 60);
});
</script>
</body>
</html>
