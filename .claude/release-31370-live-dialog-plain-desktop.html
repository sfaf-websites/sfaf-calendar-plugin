<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../public/css/portal.css"></head><body class="uc-portal" style="margin:0"><div class="uc-portal-main"><div class="uc-portal-content"><div class="uc-card"><form method="post" action="#" onsubmit="return false"><button type="submit" class="uc-btn" data-uc-confirm="Are you sure?">Reset to default</button></form></div></div></div><script src="../public/js/portal.js"></script><script>window.RL_PAGE="dialog-plain";(function () {
