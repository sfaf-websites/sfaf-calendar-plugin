<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFAF Calendar embed — bare test</title>
</head>
<body>

<!--
  BARE TEST PAGE. No WordPress, no theme, no jQuery, no other scripts, no CSS of
  its own. Everything below this comment is exactly the block the Embed Code
  generator produces, and nothing else. If the calendar renders here, the embed
  has no host-page dependencies.

  ONE THING TO CHECK: the URL on the <script> line is the site that SERVES the
  calendar. Edit it if the plugin lives somewhere else.
-->

<!-- SFAF Calendar: all upcoming events, 12 at a time, with search and category filters -->
<div class="sfaf-calendar-embed" data-sfaf-calendar
     data-per-page="12"
     data-show-filters="yes"></div>
<script src="https://www.sfaf.org/wp-content/plugins/sfaf-calendar/public/js/embed.js" async></script>

</body>
</html>
