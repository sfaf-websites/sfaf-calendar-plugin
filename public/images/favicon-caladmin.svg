<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="SFAF calendar admin">
  <!--
    THE CALADMIN FAVICON. Generated geometry, kept in step with
    .claude/build-favicon.js, which writes the PNG fallback from the same
    numbers. Change one and re-run the other.

    It is sfaf_icon_paths()['calendar'] simplified for 16 pixels: the two
    hanging tabs are dropped and the head rule is a solid band, because at that
    size a 1.33px nub and a 1.33px hairline smear into each other. Dark Gray
    #373433 on brand Yellow #FFD900, measured 8.92:1.
  -->
  <rect width="24" height="24" rx="5" fill="#FFD900"/>
  <rect x="4.4" y="6.4" width="15.2" height="13.2" rx="2.6" fill="none" stroke="#373433" stroke-width="2.4"/>
  <path d="M4.4 10.9V9a2.6 2.6 0 0 1 2.6-2.6h10A2.6 2.6 0 0 1 19.6 9v1.9Z" fill="#373433"/>
</svg>
